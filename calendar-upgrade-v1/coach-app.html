    const TODAY = { y: 2026, m: 6, d: 15 }; // 15 July 2026

    function buildWeek(baseDate) {
      const jsDow = baseDate.getDay();
      const mondayOffset = (jsDow + 6) % 7;
      const monday = new Date(baseDate);
      monday.setDate(baseDate.getDate() - mondayOffset);
      return Array.from({ length: 7 }, (_, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        return {
          key: i, label: DOW_LABELS[i], day: d.getDate(),
          isToday: d.getFullYear() === TODAY.y && d.getMonth() === TODAY.m && d.getDate() === TODAY.d,
        };
      });
    }

    /* buildGrid — copied from index.html verbatim (Monday-first 6-week month grid) */
    function buildGrid(year, month) {
      const first = new Date(year, month, 1);
      const jsDow = first.getDay();
      const lead = (jsDow + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysPrev = new Date(year, month, 0).getDate();
      const cells = [];
      for (let i = 0; i < 42; i++) {
        const dayNum = i - lead + 1;
        if (dayNum < 1) cells.push({ day: daysPrev + dayNum, inMonth: false, m: month - 1 });
        else if (dayNum > daysInMonth) cells.push({ day: dayNum - daysInMonth, inMonth: false, m: month + 1 });
        else cells.push({ day: dayNum, inMonth: true, m: month });
      }
      return cells;
    }

    function addDuration(start, durationLabel) {
      const mins = { '30m': 30, '1h': 60, '1.5h': 90, '2h': 120 }[durationLabel];
      if (!mins) return null;
      const [h, m] = start.split(':').map(Number);
      const total = h * 60 + m + mins;
      const eh = Math.floor((total / 60) % 24).toString().padStart(2, '0');
      const em = (total % 60).toString().padStart(2, '0');
      return `${eh}:${em}`;
    }

    function hsvToHex(h, s, v) {
      s /= 100; v /= 100;
      const c = v * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = v - c;
      let r = 0, g = 0, b = 0;
      if (h < 60) { r = c; g = x; b = 0; }
      else if (h < 120) { r = x; g = c; b = 0; }
      else if (h < 180) { r = 0; g = c; b = x; }
      else if (h < 240) { r = 0; g = x; b = c; }
      else if (h < 300) { r = c; g = 0; b = x; }
      else { r = x; g = 0; b = c; }
      const toHex = (n) => Math.round((n + m) * 255).toString(16).padStart(2, '0');
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`.toUpperCase();
    }

    function MapPreview({ location, onLocationChange }) {
      const [dragging, setDragging] = useState(false);
      const [offset, setOffset] = useState({ x: 0, y: 0 });
      const [scale, setScale] = useState(1);
      const [resolving, setResolving] = useState(false);
      const [resolved, setResolved] = useState(location);
      const dragStart = useRef(null);

      useEffect(() => { setResolved(location); }, [location]);

      const fakeGeocode = (ox, oy) => {
        const idx = Math.abs(Math.round(ox / 45) + Math.round(oy / 45) * 3) % LOCATION_SUGGESTIONS.length;
        return LOCATION_SUGGESTIONS[idx];
      };

      const pointerXY = (e) => (e.touches ? e.touches[0] : e);

      const handleDown = (e) => {
        const p = pointerXY(e);
        dragStart.current = { x: p.clientX - offset.x, y: p.clientY - offset.y };
        setDragging(true);
      };
      const handleMove = (e) => {
        if (!dragStart.current) return;
        const p = pointerXY(e);
        setOffset({ x: p.clientX - dragStart.current.x, y: p.clientY - dragStart.current.y });
      };
      const handleUp = () => {
        if (!dragStart.current) return;
        dragStart.current = null;
        setDragging(false);
        setResolving(true);
        setResolved(null);
        const next = fakeGeocode(offset.x, offset.y);
        setTimeout(() => {
          setResolved(next);
          setResolving(false);
          onLocationChange && onLocationChange(next);
        }, 500);
      };
      const handleWheel = (e) => {
        e.preventDefault();
        setScale(s => Math.min(2, Math.max(0.6, s - e.deltaY * 0.001)));
      };

      return (
        <Box sx={{ height: '100%', display: 'flex', flexDirection: 'column', borderRadius: 1.5, overflow: 'hidden', border: '1px solid #E8EAED' }}>
          <Box
            onMouseDown={handleDown} onMouseMove={handleMove} onMouseUp={handleUp} onMouseLeave={handleUp}
            onTouchStart={handleDown} onTouchMove={handleMove} onTouchEnd={handleUp}
            onWheel={handleWheel}
            sx={{ position: 'relative', flex: 1, minHeight: 0, bgcolor: '#E8EDF2', overflow: 'hidden', cursor: dragging ? 'grabbing' : 'grab', touchAction: 'none' }}
          >
            <Box sx={{ position: 'absolute', inset: -80, transform: `translate(${offset.x}px, ${offset.y}px) scale(${scale})`, transition: dragging ? 'none' : 'transform 150ms ease' }}>
              <svg width="100%" height="100%" viewBox="0 0 560 290" preserveAspectRatio="xMidYMid slice" style={{ width: '100%', height: '100%', display: 'block' }}>
                <rect width="560" height="290" fill="#E8EDF2" />
                <rect x="60" y="30" width="150" height="70" fill="#D6E8D2" />
                <rect x="360" y="150" width="160" height="70" fill="#D6E8D2" />
                <rect x="240" y="40" width="80" height="60" fill="#DCE6F0" />
                <rect x="80" y="180" width="120" height="60" fill="#DCE6F0" />
                <g stroke="#FFFFFF" strokeWidth="7">
                  <line x1="0" y1="145" x2="560" y2="145" />
                  <line x1="230" y1="0" x2="230" y2="290" />
                  <line x1="365" y1="0" x2="365" y2="290" />
                </g>
                <g stroke="#C7D2DC" strokeWidth="2">
                  <line x1="0" y1="70" x2="560" y2="70" />
                  <line x1="0" y1="220" x2="560" y2="220" />
                  <line x1="130" y1="0" x2="130" y2="290" />
                  <line x1="450" y1="0" x2="450" y2="290" />
                </g>
              </svg>
            </Box>
            <Box sx={{
              position: 'absolute', left: '50%', top: '50%', pointerEvents: 'none',
              transform: dragging ? 'translate(-50%, calc(-100% - 6px))' : 'translate(-50%, -100%)',
              transition: 'transform 150ms ease',
            }}>
              <Box sx={{
                position: 'absolute', bottom: dragging ? -10 : -3, left: '50%', transform: 'translateX(-50%)',
                width: dragging ? 18 : 10, height: dragging ? 6 : 3, borderRadius: '50%',
                bgcolor: 'rgba(0,0,0,0.35)', filter: 'blur(1px)', opacity: dragging ? 1 : 0, transition: 'all 150ms ease',
              }} />
              <Icon path={P.pin} size={40} color="#EA4335" />
            </Box>
          </Box>
          <Box sx={{ px: 1.5, py: 1, bgcolor: '#fff', display: 'flex', gap: 1, alignItems: 'flex-start', flexShrink: 0 }}>
            <Icon path={P.pin} size={18} color="#3B5BDB" sx={{ mt: '2px' }} />
            <Box sx={{ flex: 1 }}>
              {resolving || !resolved ? (
                <Typography sx={{ fontSize: 14, color: '#5F7089' }}>Locating…</Typography>
              ) : (
                <>
                  <Typography sx={{ fontSize: 14, color: '#172B4D' }}>{resolved.name}</Typography>
                  <Typography sx={{ fontSize: 13, color: '#5F7089' }}>{resolved.address}</Typography>
                </>
              )}
            </Box>
          </Box>
        </Box>
      );
    }

    function ColorPickerSheet({ color, onSelect, onBack }) {
      const [tab, setTab] = useState('branding');
      const [tempColor, setTempColor] = useState(color);
      const [hex, setHex] = useState(color);
      const [hue, setHue] = useState(210);
      const [applyAll, setApplyAll] = useState(false);
      const [handlePos, setHandlePos] = useState({ x: 220, y: 40 });
      const canvasRef = useRef(null);

      const updateFromCanvas = (x, y, h) => {
        const newHex = hsvToHex(h, (x / 300) * 100, 100 - (y / 160) * 100);
        setHex(newHex); setTempColor(newHex);
      };

      const handleCanvasPointer = (e) => {
        const rect = canvasRef.current.getBoundingClientRect();
        const x = Math.max(0, Math.min(300, e.clientX - rect.left));
        const y = Math.max(0, Math.min(160, e.clientY - rect.top));
        setHandlePos({ x, y });
        updateFromCanvas(x, y, hue);
      };

      const handleHueChange = (h) => { setHue(h); updateFromCanvas(handlePos.x, handlePos.y, h); };
      const handleHexInput = (v) => { setHex(v); if (/^#[0-9A-Fa-f]{6}$/.test(v)) setTempColor(v); };
      const handleSelect = () => { onSelect(tempColor); onBack(); };

      return (
        <Box sx={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
          <Box sx={{ px: 2.5, py: 2, display: 'flex', alignItems: 'center', gap: 1.5, borderBottom: '1px solid #E8EAED' }}>

              }}>{t}</Typography>
            ))}
          </Box>

          <Box sx={{ flex: 1, overflowY: 'auto', p: 2.5 }}>
            {tab === 'branding' ? (
              <Box sx={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 1.25 }}>
                {BRANDING_SWATCHES.map((c, i) => {
                  const selected = tempColor && tempColor.toUpperCase() === c.toUpperCase();
                  return (
                    <Box key={`${c}-${i}`} onClick={() => setTempColor(c)} sx={{
                      width: '100%', aspectRatio: '1', borderRadius: 1.5, bgcolor: c, cursor: 'pointer',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      border: selected ? '2px solid #1D2635' : '2px solid transparent',

                      <Typography sx={{ fontSize: 15, color: '#fff' }}>Aa</Typography>

            ) : (
              <Box>
                <Box ref={canvasRef} onMouseDown={handleCanvasPointer}
                  onMouseMove={(e) => { if (e.buttons === 1) handleCanvasPointer(e); }}
                  sx={{
                    position: 'relative', width: 300, height: 160, borderRadius: 1.5, overflow: 'hidden',
                    cursor: 'crosshair', mx: 'auto', backgroundColor: `hsl(${hue}, 100%, 50%)`,
                  }}>
                  <Box sx={{ position: 'absolute', inset: 0, background: 'linear-gradient(to right, #fff, rgba(255,255,255,0))' }} />
                  <Box sx={{ position: 'absolute', inset: 0, background: 'linear-gradient(to bottom, rgba(0,0,0,0), #000)' }} />
                  <Box sx={{

                    border: '2px solid #fff', boxShadow: '0 0 0 1px rgba(0,0,0,0.3)', bgcolor: tempColor, pointerEvents: 'none',

                </Box>

                <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5, mt: 2 }}>
                  <Box sx={{ width: 32, height: 32, borderRadius: 1, bgcolor: tempColor, border: '1px solid #E8EAED', flexShrink: 0 }} />

      const [types, setTypes] = useState([...DEFAULT_TYPES, 'Academy Day']);

        const base = { ...TYPE_COLORS, 'Squad session': '#00897B', 'Individual session': '#5D4037', 'Event': '#C2185B', 'Academy Day': '#455A64' };
        return Object.fromEntries([...DEFAULT_TYPES, 'Academy Day'].map((t, i) => [t, base[t] || TYPE_COLOR_FALLBACKS[i % TYPE_COLOR_FALLBACKS.length]]));
      });

      const selectedOrgList = useMemo(() => ORGS.filter(o => selectedOrgIds.has(o.id)), [selectedOrgIds]);
      const primaryOrgId = selectedOrgList[0]?.id || 'atl';
      const primarySquadId = (ORG_BY_ID[primaryOrgId].squads[0] && ORG_BY_ID[primaryOrgId].squads[0].id) || 'atl-first';

      useEffect(() => {
        setOrgParticipantIds(prev => {
          const next = { ...prev };
          selectedOrgIds.forEach(orgId => {
            if (!next[orgId]) {
              const squadId = ORG_BY_ID[orgId].squads[0]?.id;
              next[orgId] = new Set(rosterForSquad(squadId).filter(a => a.type === 'athlete').map(a => a.id));
            }
          });
          return next;
        });
      }, [selectedOrgIds]);

      const toggleCustom = (id) => setSelectedCustomIds(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const toggleOrg = (id) => setSelectedOrgIds(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const toggleExpandOrg = (id) => setExpandedOrgIds(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const toggleParticipant = (orgId, athleteId) => setOrgParticipantIds(prev => {
        const current = new Set(prev[orgId] || []);
        current.has(athleteId) ? current.delete(athleteId) : current.add(athleteId);
        return { ...prev, [orgId]: current };
      });
      const toggleSelectAllOrg = (orgId) => setOrgParticipantIds(prev => {
        const squadId = ORG_BY_ID[orgId].squads[0]?.id;
        const athletes = rosterForSquad(squadId).filter(a => a.type === 'athlete');
        const current = prev[orgId] || new Set();
        const allSelected = athletes.every(a => current.has(a.id));
        return { ...prev, [orgId]: new Set(allSelected ? [] : athletes.map(a => a.id)) };
      });
      const setStaffForOrg = (orgId, staffId) => setOrgStaffId(prev => ({ ...prev, [orgId]: staffId }));

      const toggleNotifyChannel = (ch) => setNotifyChannels(prev => { const n = new Set(prev); n.has(ch) ? n.delete(ch) : n.add(ch); return n; });
      const addAttachment = () => {
        if (!attachmentTitle.trim()) return;
        setAttachments(prev => [...prev, { id: `att-${prev.length}-${attachmentTitle.trim()}`, title: attachmentTitle.trim(), link: attachmentLink.trim() }]);
        setAttachmentTitle(''); setAttachmentLink('');
      };
      const removeAttachment = (id) => setAttachments(prev => prev.filter(a => a.id !== id));

      const createType = (t) => {
        if (types.includes(t)) return;
        setTypes(prev => [...prev, t]);
        setTypeColors(prev => ({ ...prev, [t]: TYPE_COLOR_FALLBACKS[types.length % TYPE_COLOR_FALLBACKS.length] }));
        onToast && onToast({ severity: 'info', msg: `Type “${t}” added` });
      };

      const reset = () => {
        setStep(1); setPushed(null);
        setSelectedCustomIds(new Set()); setSelectedOrgIds(new Set());
        setExpandedOrgIds(new Set()); setOrgParticipantIds({}); setOrgStaffId({});
        setTitle(''); setType(''); setDescription('');
        setDate('2026-07-15'); setStart('09:00'); setDuration('1h'); setCustomEnd('10:00'); setTimezone('ET'); setRepeat('Never');
        setLocation(null); setVisibility('All staff'); setAttachments([]); setAttachmentTitle(''); setAttachmentLink('');
        setNotifyChannels(new Set()); setReminderPlayer('None'); setReminderPush('1 min before');
      };
      const close = () => { reset(); onClose(); };

      const displayColour = typeColors[type] || '#3B4960';
      const canSave = title.trim() && type;
      const hasGroupSelection = selectedCustomIds.size + selectedOrgIds.size > 0;

      const goBack = () => {
        if (pushed) { setPushed(null); return; }
        if (step === 1) { close(); return; }
        setStep(s => s - 1);
      };
      const goNext = () => {
        if (step === 1 && !hasGroupSelection) return;
        if (step === 1) setExpandedOrgIds(new Set(selectedOrgList[0] ? [selectedOrgList[0].id] : []));
        if (step === 3 && !canSave) return;
        if (step < 3) { setStep(s => s + 1); return; }
        save();
      };

      const save = () => {
        if (!canSave) return;
        const dayNum = date ? Number(date.split('-')[2]) : 15;
        const endTime = duration === 'Custom' ? customEnd : (addDuration(start, duration) || customEnd);
        const roster = rosterForSquad(primarySquadId);
        const chosenAthleteIds = orgParticipantIds[primaryOrgId] || new Set();
        const chosenStaffId = orgStaffId[primaryOrgId];
        const attendees = roster.filter(a => (a.type === 'athlete' && chosenAthleteIds.has(a.id)) || (a.type === 'staff' && a.id === chosenStaffId));
        const reminders = [
          ...(reminderPlayer !== 'None' ? [`Player: ${reminderPlayer}`] : []),
          `Push: ${reminderPush}`,
        ];
        onCreate({
          id: `ev-${Date.now()}`, day: dayNum, orgId: primaryOrgId, squadId: primarySquadId, type,
          title: title.trim(), start, end: endTime, location, reminders, notes: description,
          attendees: attendees.length ? attendees : roster,
          repeat, visibility, attachments, notifyChannels: [...notifyChannels],
        });
        reset();
        onClose();
      };

      if (!open) return null;

      return (
        <Box onClick={close} sx={{ position: 'absolute', inset: 0, bgcolor: 'rgba(0,0,0,0.5)', zIndex: 40, animation: 'scrimFadeIn 0.2s ease-out' }}>
          <Box onClick={(e) => e.stopPropagation()} sx={{
            position: 'absolute', left: 0, right: 0, bottom: 0, width: '100%',
            bgcolor: '#FFFFFF', borderTopLeftRadius: 20, borderTopRightRadius: 20, maxHeight: '88%',
            display: 'flex', flexDirection: 'column', animation: 'sheetSlideUp 0.25s ease-out',
          }}>
            <SheetHandle />

            {pushed ? (
              <>
                {pushed === 'type' && (
                  <TypePickerSheet types={types} value={type}
                    onSelect={(t) => { setType(t); setPushed(null); }}
                    onCreate={(t) => { createType(t); setType(t); setPushed(null); }}
                    onBack={() => setPushed(null)} />
                )}
                {pushed === 'location' && (
                  <LocationPickerSheet value={location} onSelect={setLocation} onBack={() => setPushed(null)} />
                )}
                {pushed === 'color' && (
                  <ColorPickerSheet color={displayColour}
                    onSelect={(hex) => type && setTypeColors(prev => ({ ...prev, [type]: hex }))}
                    onBack={() => setPushed(null)} />
                )}
              </>
            ) : (
              <>
                <Box sx={{ px: 2.5, py: 1.5, display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '1px solid #E8EAED' }}>
                  <Box>
                    <Typography sx={{ color: '#172B4D', fontSize: 16, fontWeight: 600 }}>{ADD_EVENT_STEPS[step - 1]}</Typography>
                    <Typography sx={{ color: '#5F7089', fontSize: 12 }}>Step {step} of {ADD_EVENT_STEPS.length}</Typography>
                  </Box>
                  <IconButton size="small" onClick={close}><Icon path={P.close} size={20} color="#5F7089" /></IconButton>
                </Box>

                <Box sx={{ flex: 1, overflowY: 'auto' }}>
                  {step === 1 && (
                    <GroupPickerStep selectedCustomIds={selectedCustomIds} onToggleCustom={toggleCustom}
                      selectedOrgIds={selectedOrgIds} onToggleOrg={toggleOrg} />
                  )}
                  {step === 2 && (
                    <ParticipantsStep selectedOrgIds={selectedOrgIds} expandedOrgIds={expandedOrgIds} onToggleExpand={toggleExpandOrg}
                      orgParticipantIds={orgParticipantIds} onToggleParticipant={toggleParticipant} onToggleSelectAllOrg={toggleSelectAllOrg}
                      orgStaffId={orgStaffId} onSetStaff={setStaffForOrg} />
                  )}
                  {step === 3 && (
                    <EventSetupStep
                      kind={kind || 'Event'}
                      type={type} title={title} setTitle={setTitle} description={description} setDescription={setDescription}
                      date={date} setDate={setDate} start={start} setStart={setStart} duration={duration} setDuration={setDuration}
                      customEnd={customEnd} setCustomEnd={setCustomEnd} timezone={timezone} setTimezone={setTimezone}
                      repeat={repeat} setRepeat={setRepeat} location={location}
                      visibility={visibility} setVisibility={setVisibility} attachments={attachments}
                      attachmentTitle={attachmentTitle} setAttachmentTitle={setAttachmentTitle}
                      attachmentLink={attachmentLink} setAttachmentLink={setAttachmentLink}
                      onAddAttachment={addAttachment} onRemoveAttachment={removeAttachment}
                      notifyChannels={notifyChannels} onToggleNotifyChannel={toggleNotifyChannel}
                      reminderPlayer={reminderPlayer} setReminderPlayer={setReminderPlayer}
                      reminderPush={reminderPush} setReminderPush={setReminderPush}
                      displayColour={displayColour}
                      onOpenTypePicker={() => setPushed('type')} onOpenLocationPicker={() => setPushed('location')} onOpenColorPicker={() => setPushed('color')}
                    />
                  )}
                </Box>

                <Box sx={{ px: 2, py: 2, borderTop: '1px solid #E8EAED', display: 'flex', gap: 1 }}>
                  <Button onClick={goBack} sx={{ bgcolor: '#F3F4F7', color: '#172B4D', '&:hover': { bgcolor: '#E8EAED' } }}>
                    {step === 1 ? 'Cancel' : 'Back'}
                  </Button>
                  <Button
                    disabled={(step === 1 && !hasGroupSelection) || (step === 3 && !canSave)}
                    onClick={goNext}
                    sx={{ flex: 1, bgcolor: '#1D2635', '&:hover': { bgcolor: '#141a24' }, '&.Mui-disabled': { bgcolor: '#F3F4F7', color: '#B4B8C0' } }}>
                    {step < 3 ? 'Next' : 'Create event'}
                  </Button>
                </Box>
              </>
            )}
          </Box>
        </Box>
      );
    }

    function FilterSheet({ open, onClose, applied, onApply }) {
      const [orgIds, setOrgIds] = useState(applied.orgIds);
      const [squadIds, setSquadIds] = useState(applied.squadIds);
      const [types, setTypes] = useState(applied.types);
      const [orgsOpen, setOrgsOpen] = useState(true);
      const [squadsOpen, setSquadsOpen] = useState(true);
      const [typesOpen, setTypesOpen] = useState(true);

      useEffect(() => {
        if (open) { setOrgIds(applied.orgIds); setSquadIds(applied.squadIds); setTypes(applied.types); }
      }, [open]);

      const toggleOrg = (id) => {
        setOrgIds(prev => {
          const n = new Set(prev);
          if (n.has(id)) {
            n.delete(id);
            const org = ORGS.find(o => o.id === id);
            setSquadIds(sq => { const m = new Set(sq); org.squads.forEach(s => m.delete(s.id)); return m; });
          } else {
            n.add(id);
          }
          return n;
        });
      };
      const toggleSquad = (id) => setSquadIds(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const toggleType = (t) => setTypes(prev => { const n = new Set(prev); n.has(t) ? n.delete(t) : n.add(t); return n; });

      const clearAll = () => { setOrgIds(new Set(ALL_ORG_IDS)); setSquadIds(new Set()); setTypes(new Set(ALL_TYPES)); };
      const apply = () => { onApply({ orgIds, squadIds, types }); onClose(); };

      const orgsInView = ORGS.filter(o => orgIds.has(o.id));

      if (!open) return null;

      return (
        <Box onClick={onClose} sx={{ position: 'absolute', inset: 0, bgcolor: 'rgba(0,0,0,0.5)', zIndex: 40, animation: 'scrimFadeIn 0.2s ease-out' }}>
          <Box onClick={(e) => e.stopPropagation()} sx={{
            position: 'absolute', left: 0, right: 0, bottom: 0, width: '100%',
            bgcolor: '#FFFFFF', borderTopLeftRadius: 20, borderTopRightRadius: 20, maxHeight: '85%',
            display: 'flex', flexDirection: 'column', animation: 'sheetSlideUp 0.25s ease-out',
          }}>
            <SheetHandle />
            <Box sx={{ px: 2.5, pb: 1.5, display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '1px solid #E8EAED' }}>
              <Typography sx={{ fontSize: 16, color: '#172B4D' }}>Filters</Typography>
              <IconButton size="small" onClick={onClose}><Icon path={P.close} size={20} color="#5F7089" /></IconButton>
            </Box>
            <Box sx={{ flex: 1, overflowY: 'auto' }}>
              <FilterSection title="Organisation" count={orgIds.size} expanded={orgsOpen} onToggle={() => setOrgsOpen(v => !v)}>
                {ORGS.map(org => (
                  <Box key={org.id} onClick={() => toggleOrg(org.id)} sx={{ display: 'flex', alignItems: 'center', gap: 1, py: 0.75, cursor: 'pointer' }}>
                    <Checkbox checked={orgIds.has(org.id)} onChange={() => toggleOrg(org.id)} onClick={(e) => e.stopPropagation()} sx={{ p: 0.5 }} />
                    <Box sx={{ width: 8, height: 8, borderRadius: '50%', bgcolor: org.color }} />
                    <Typography sx={{ fontSize: 14, color: '#172B4D' }}>{org.name}</Typography>
                  </Box>
                ))}
              </FilterSection>
              <FilterSection title="Squads" count={squadIds.size} expanded={squadsOpen} onToggle={() => setSquadsOpen(v => !v)}>
                {orgsInView.length === 0 && <Typography sx={{ fontSize: 13, color: '#5F7089' }}>Select an organisation.</Typography>}
                {orgsInView.map(org => (
                  <Box key={org.id} sx={{ mb: 1 }}>
                    <Typography sx={{ fontSize: 11, color: '#5F7089', textTransform: 'uppercase', letterSpacing: 0.5, mb: 0.5 }}>{org.name}</Typography>
                    {org.squads.map(s => (
                      <Box key={s.id} onClick={() => toggleSquad(s.id)} sx={{ display: 'flex', alignItems: 'center', gap: 1, py: 0.5, cursor: 'pointer' }}>
                        <Checkbox checked={squadIds.has(s.id)} onChange={() => toggleSquad(s.id)} onClick={(e) => e.stopPropagation()} sx={{ p: 0.5 }} />
                        <Box sx={{ width: 7, height: 7, borderRadius: '50%', bgcolor: squadColor(s.id) }} />
                        <Typography sx={{ fontSize: 13, color: '#172B4D' }}>{s.name}</Typography>
                      </Box>
                    ))}
                  </Box>
                ))}
              </FilterSection>
              <FilterSection title="Types" count={types.size} expanded={typesOpen} onToggle={() => setTypesOpen(v => !v)}>
                {ALL_TYPES.map(t => (
                  <Box key={t} onClick={() => toggleType(t)} sx={{ display: 'flex', alignItems: 'center', gap: 1, py: 0.5, cursor: 'pointer' }}>
                    <Checkbox checked={types.has(t)} onChange={() => toggleType(t)} onClick={(e) => e.stopPropagation()} sx={{ p: 0.5 }} />
                    <Box sx={{ width: 10, height: 10, borderRadius: '50%', bgcolor: TYPE_COLORS[t] }} />
                    <Typography sx={{ fontSize: 14, color: '#172B4D' }}>{t}</Typography>
                  </Box>
                ))}
              </FilterSection>
            </Box>
            <Box sx={{ px: 2, py: 2, borderTop: '1px solid #E8EAED', display: 'flex', gap: 1 }}>
              <Button onClick={clearAll} sx={{ bgcolor: '#F3F4F7', color: '#172B4D', '&:hover': { bgcolor: '#E8EAED' } }}>Clear all</Button>
              <Button onClick={apply} sx={{ flex: 1, bgcolor: '#1D2635', '&:hover': { bgcolor: '#141a24' } }}>Apply</Button>
            </Box>
          </Box>
        </Box>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       TOAST — plain absolute-positioned Box, never fixed, never a portal
       ═══════════════════════════════════════════════════════════════════════ */
    function Toast({ toast, onClose }) {
      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(onClose, 3000);
        return () => clearTimeout(t);
      }, [toast]);

      if (!toast) return null;
      const bg = toast.severity === 'success' ? '#1B5E20' : toast.severity === 'error' ? '#B71C1C' : '#172B4D';
      return (
        <Box sx={{
          position: 'absolute', left: 16, right: 16, bottom: 76, bgcolor: bg, color: '#fff',
          borderRadius: 1.5, px: 2, py: 1.5, zIndex: 50, boxShadow: '0 4px 16px rgba(0,0,0,0.25)',
        }}>
          <Typography sx={{ fontSize: 13, color: '#fff' }}>{toast.msg}</Typography>
        </Box>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       MESSAGE BLAST — copied from index.html BroadcastModal verbatim
       ═══════════════════════════════════════════════════════════════════════ */
    function MessageBlastSheet({ event, onClose, onSent }) {
      const [selected, setSelected] = useState(() => new Set());
      const [toExpanded, setToExpanded] = useState(false);
      const [subject, setSubject] = useState('');
      const [body, setBody] = useState('');
      const [scheduleOpen, setScheduleOpen] = useState(false);
      const [scheduleDate, setScheduleDate] = useState('');
      const [scheduleTime, setScheduleTime] = useState('');

      useEffect(() => {
        if (event) {
          setSelected(new Set(event.attendees.map(a => a.id)));
          setToExpanded(false); setSubject(`Update: ${event.title}`); setBody(''); setScheduleOpen(false);
          setScheduleDate(''); setScheduleTime('');
        }
      }, [event]);

      if (!event) return null;

      const toggle = (id) => setSelected(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const total = selected.size;
      const canSend = total > 0 && subject.trim().length > 0;
      const send = () => onSent(total);

      return (
        <Box onClick={onClose} sx={{ position: 'absolute', inset: 0, bgcolor: 'rgba(0,0,0,0.5)', zIndex: 40, animation: 'scrimFadeIn 0.2s ease-out' }}>
          <Box onClick={(e) => e.stopPropagation()} sx={{
            position: 'absolute', left: 0, right: 0, bottom: 0, width: '100%',
            bgcolor: '#FFFFFF', borderTopLeftRadius: 20, borderTopRightRadius: 20, maxHeight: '88%',
            display: 'flex', flexDirection: 'column', animation: 'sheetSlideUp 0.25s ease-out',
          }}>
            <SheetHandle />
            <Box sx={{ px: 2.5, py: 2, display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '1px solid #E8EAED' }}>
              <Typography sx={{ color: '#172B4D', fontSize: 16 }}>New message</Typography>
              <IconButton size="small" onClick={onClose}><Icon path={P.close} size={20} color="#5F7089" /></IconButton>
            </Box>

            <Box sx={{ flex: 1, overflowY: 'auto' }}>
              <Box sx={{ px: 2, py: 1.5, borderBottom: '1px solid #E8EAED' }}>
                <Typography sx={{ fontSize: 11, color: '#5F7089', textTransform: 'uppercase', letterSpacing: 0.5, mb: 0.5 }}>To</Typography>
                <Box onClick={() => setToExpanded(v => !v)} sx={{ display: 'flex', alignItems: 'center', gap: 1, cursor: 'pointer', minHeight: 32 }}>
                  <Typography sx={{ fontSize: 14, color: '#172B4D', flex: 1 }}>{total} recipients</Typography>
                  <Icon path={toExpanded ? P.chevronUp : P.chevronDown} size={16} color="#5F7089" />
                </Box>
                <Collapse in={toExpanded}>
                  <Box sx={{ mt: 1 }}>
                    {event.attendees.map(a => (
                      <Box key={a.id} onClick={() => toggle(a.id)} sx={{ display: 'flex', alignItems: 'center', gap: 1.5, minHeight: 44, cursor: 'pointer' }}>
                        <Checkbox checked={selected.has(a.id)} onChange={() => toggle(a.id)} onClick={(e) => e.stopPropagation()}
                          sx={{ p: 0.5, color: '#B4B8C0', '&.Mui-checked': { color: '#3B5BDB' } }} />
                        <Box sx={{ width: 32, height: 32, borderRadius: '50%', bgcolor: '#F3F4F7', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                          <Typography sx={{ fontSize: 12, color: '#5F7089' }}>{initials(a.name)}</Typography>
                        </Box>
                        <Typography sx={{ fontSize: 14, color: '#172B4D' }}>{a.name}</Typography>
                      </Box>
                    ))}
                  </Box>
                </Collapse>
              </Box>

              <Box sx={{ px: 2, py: 1.25, display: 'flex', alignItems: 'center', gap: 1, borderBottom: '1px solid #E8EAED' }}>
                <Icon path={P.mailOutline} size={18} color="#3B5BDB" />
                <Typography sx={{ fontSize: 14, color: '#172B4D' }}>Send via Email</Typography>
              </Box>

              <Box sx={{ px: 2, py: 1.5, display: 'flex', flexDirection: 'column', gap: 2 }}>
                <Box>
                  <FieldLabel required>Subject</FieldLabel>
                  <TextField fullWidth value={subject} onChange={(e) => setSubject(e.target.value)} />
                </Box>

                <Box>
                  <FieldLabel>Body</FieldLabel>
                  <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.5, px: 1, py: 0.75, bgcolor: '#F3F4F7', borderRadius: '6px 6px 0 0' }}>
                    <IconButton size="small"><Icon path={P.bold} size={16} color="#5F7089" /></IconButton>
                    <IconButton size="small"><Icon path={P.italic} size={16} color="#5F7089" /></IconButton>
                    <IconButton size="small"><Icon path={P.link} size={16} color="#5F7089" /></IconButton>
                    <IconButton size="small"><Icon path={P.bulletList} size={16} color="#5F7089" /></IconButton>
                    <Box sx={{ flex: 1 }} />
                    <IconButton size="small"><Icon path={P.attach} size={16} color="#5F7089" /></IconButton>
                  </Box>
                  <TextField fullWidth multiline minRows={6} placeholder="Write your message..." value={body} onChange={(e) => setBody(e.target.value)}
                    sx={{ '& .MuiFilledInput-root': { borderRadius: '0 0 6px 6px' } }} />
                  <Typography sx={{ fontSize: 12, color: '#5F7089', mt: 1 }}>Maximum attachment size: 25MB</Typography>
                </Box>

                <Box>
                  {!scheduleOpen ? (
                    <Box onClick={() => setScheduleOpen(true)} sx={{
                      display: 'inline-flex', alignItems: 'center', gap: 0.75, bgcolor: '#F3F4F7', borderRadius: 1.5,
                      height: 40, px: 2, cursor: 'pointer',
                    }}>
                      <Icon path={P.add} size={16} color="#1D2635" />
                      <Typography sx={{ fontSize: 14, color: '#1D2635' }}>Add schedule</Typography>
                    </Box>
                  ) : (
                    <Box sx={{ display: 'flex', flexDirection: 'column', gap: 1.5 }}>
                      <TextField fullWidth type="date" value={scheduleDate} onChange={(e) => setScheduleDate(e.target.value)} />
                      <TextField fullWidth type="time" value={scheduleTime} onChange={(e) => setScheduleTime(e.target.value)} />
                    </Box>
                  )}
                </Box>
              </Box>
            </Box>

            <Box sx={{ px: 2, py: 2, borderTop: '1px solid #E8EAED', display: 'flex', gap: 1 }}>
              <Button onClick={onClose} sx={{ bgcolor: '#F3F4F7', color: '#172B4D', '&:hover': { bgcolor: '#E8EAED' } }}>Save draft</Button>
              <Button disabled={!canSend} onClick={send}
                sx={{ flex: 1, bgcolor: '#1D2635', '&:hover': { bgcolor: '#141a24' }, '&.Mui-disabled': { bgcolor: '#F3F4F7', color: '#B4B8C0' } }}>
                Send
              </Button>
            </Box>
          </Box>
        </Box>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       ADD KIND — Event / Session / Game choice, copied from index.html verbatim
       ═══════════════════════════════════════════════════════════════════════ */
    function AddKindSheet({ open, onClose, onSelect }) {
      if (!open) return null;
      const kinds = ['Event', 'Session', 'Game'];
      return (
        <Box onClick={onClose} sx={{ position: 'absolute', inset: 0, bgcolor: 'rgba(0,0,0,0.5)', zIndex: 40, animation: 'scrimFadeIn 0.2s ease-out' }}>
          <Box onClick={(e) => e.stopPropagation()} sx={{
            position: 'absolute', left: 0, right: 0, bottom: 0, width: '100%',
            bgcolor: '#FFFFFF', borderTopLeftRadius: 20, borderTopRightRadius: 20,
            display: 'flex', flexDirection: 'column', animation: 'sheetSlideUp 0.25s ease-out', pb: 1,
          }}>
            <SheetHandle />
            <Typography sx={{ px: 2.5, pb: 1, color: '#5F7089', fontSize: 12, textTransform: 'uppercase', letterSpacing: 0.5 }}>Add</Typography>
            {kinds.map((k, i) => (
              <Box key={k} onClick={() => onSelect(k)} sx={{
                display: 'flex', alignItems: 'center', minHeight: 44, px: 2.5, cursor: 'pointer',
                borderTop: i > 0 ? '1px solid #E8EAED' : 'none',
              }}>
                <Typography sx={{ fontSize: 15, color: '#172B4D' }}>{k}</Typography>
              </Box>
            ))}
          </Box>
        </Box>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       CALENDAR TAB (combines header, week strip, list, sheets)
       ═══════════════════════════════════════════════════════════════════════ */
    function CalendarTab() {
      const [weekOffset, setWeekOffset] = useState(0);
      const [selectedDay, setSelectedDay] = useState(TODAY.d);
      const [view, setView] = useState('Week');
      const [activeEvent, setActiveEvent] = useState(null);
      const [messageEvent, setMessageEvent] = useState(null);
      const [addOpen, setAddOpen] = useState(false);
      const [addKindOpen, setAddKindOpen] = useState(false);
      const [addKind, setAddKind] = useState('Event');
      const [filterOpen, setFilterOpen] = useState(false);
      const [events, setEvents] = useState(SEED_EVENTS);
      const [toast, setToast] = useState(null);
      const [appliedFilters, setAppliedFilters] = useState({
        orgIds: new Set(ALL_ORG_IDS), squadIds: new Set(), types: new Set(ALL_TYPES),
      });

      const baseDate = useMemo(() => {
        const d = new Date(TODAY.y, TODAY.m, TODAY.d);
        d.setDate(d.getDate() + weekOffset * 7);
        return d;
      }, [weekOffset]);
      const week = useMemo(() => buildWeek(baseDate), [baseDate]);
      const monthLabel = `${MONTHS[baseDate.getMonth()]} ${baseDate.getFullYear()}`;
      const year = baseDate.getFullYear();
      const month = baseDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const visibleEvents = useMemo(() => events.filter(e =>
        appliedFilters.orgIds.has(e.orgId) &&
        (appliedFilters.squadIds.size === 0 || appliedFilters.squadIds.has(e.squadId)) &&
        appliedFilters.types.has(e.type)
      ), [events, appliedFilters]);

      const dayEvents = useMemo(
        () => visibleEvents.filter(e => e.day === selectedDay).sort((a, b) => a.start.localeCompare(b.start)),
        [visibleEvents, selectedDay]
      );

      const filterCount = Math.max(0, ALL_ORG_IDS.length - appliedFilters.orgIds.size)
        + Math.max(0, ALL_TYPES.length - appliedFilters.types.size)
        + appliedFilters.squadIds.size;

      const handleCreate = (evt) => {
        setEvents(prev => [...prev, evt]);
        setSelectedDay(evt.day);
        setAppliedFilters(prev => ({
          ...prev,
          orgIds: new Set([...prev.orgIds, evt.orgId]),
          types: new Set([...prev.types, evt.type]),
        }));
        setToast({ severity: 'success', msg: 'Event added to the calendar' });
      };

      const handleSendMessage = (evt) => { setActiveEvent(null); setMessageEvent(evt); };

      return (
        <Box sx={{ position: 'absolute', top: 44, left: 0, right: 0, bottom: 0, overflowY: 'auto', pb: '96px', bgcolor: '#FFFFFF' }}>
          <CalendarHeader monthLabel={monthLabel}
            onPrev={() => setWeekOffset(w => w - 1)} onNext={() => setWeekOffset(w => w + 1)}
            onAdd={() => setAddKindOpen(true)}
            filterCount={filterCount} onFilterClick={() => setFilterOpen(true)}
            view={view} onViewChange={setView} />
          {view === 'Week' && <WeekStrip days={week} selectedDay={selectedDay} onSelectDay={setSelectedDay} />}
          {view === 'Month' && (
            <MonthGridView year={year} month={month} events={visibleEvents} selectedDay={selectedDay} onSelectDay={setSelectedDay} />
          )}
          {view === 'Day' && (
            <DayAgendaView year={year} month={month} selectedDay={selectedDay} onSelectDay={setSelectedDay} daysInMonth={daysInMonth} />
          )}
          <EventList events={dayEvents} onSelect={setActiveEvent} />
          <EventDetailSheet event={activeEvent} onClose={() => setActiveEvent(null)} onSendMessage={handleSendMessage} />
          <AddKindSheet open={addKindOpen} onClose={() => setAddKindOpen(false)}
            onSelect={(k) => { setAddKind(k); setAddKindOpen(false); setAddOpen(true); }} />
          <AddEventSheet open={addOpen} kind={addKind} onClose={() => setAddOpen(false)} onCreate={handleCreate} onToast={setToast} />
          <MessageBlastSheet event={messageEvent} onClose={() => setMessageEvent(null)}
            onSent={(count) => { setMessageEvent(null); setToast({ severity: 'success', msg: `Message sent to ${count} recipients` }); }} />
          <FilterSheet open={filterOpen} onClose={() => setFilterOpen(false)} applied={appliedFilters} onApply={setAppliedFilters} />
          <Toast toast={toast} onClose={() => setToast(null)} />
        </Box>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       PLACEHOLDER TABS
       ═══════════════════════════════════════════════════════════════════════ */
    function PlaceholderTab({ label }) {
      return (
        <Box sx={{ position: 'absolute', top: 44, left: 0, right: 0, bottom: 0, bgcolor: '#FFFFFF', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <Typography sx={{ color: '#5F7089', fontSize: 15 }}>{label}</Typography>
        </Box>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       APP
       ═══════════════════════════════════════════════════════════════════════ */
    function App() {
      const [screen, setScreen] = useState('login');
      const [tab, setTab] = useState('athletes');

      const statusBarProps = screen === 'login'
        ? { bg: '#000', color: '#fff' }
        : tab === 'athletes'
          ? { bg: '#33383F', color: '#fff' }
          : { bg: '#FFFFFF', color: '#172B4D' };

      return (
        <ThemeProvider theme={theme}>
          <Box className="phone-frame">
            <StatusBar {...statusBarProps} />
            {screen === 'login' && <LoginScreen onLogin={() => setScreen('app')} />}
            {screen === 'app' && (
              <>
                {tab === 'athletes' && <AthletesTab />}
                {tab === 'calendar' && <CalendarTab />}
                {tab === 'messages' && <PlaceholderTab label="Messages" />}
                {tab === 'settings' && <PlaceholderTab label="Settings" />}
                <BottomNav active={tab} onChange={setTab} />
              </>
            )}
          </Box>
        </ThemeProvider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Force Babel's classic JSX runtime so it runs in a plain script tag -->
  <script>
    (function () {
      const source = document.getElementById('app-source').textContent;
      const compiled = Babel.transform(source, { presets: [['react', { runtime: 'classic' }]] }).code;
      const script = document.createElement('script');
      script.text = compiled;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
