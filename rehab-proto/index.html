function BuilderScreen({ planSource, phases, milestones, mode, templateMeta, planTotalDays, selectedPlayer, onBack, sourceTemplate, templatesData, setTemplatesData, setSnackbar }) {
  const isTemplateMode = mode === 'template';
  const isTemplate = planSource === 'template';
  const [guidanceDismissed, setGuidanceDismissed] = useState(false);
  const [saveTemplateOpen, setSaveTemplateOpen] = useState(false);
  const [savedAsTemplateName, setSavedAsTemplateName] = useState(null);
  const [editState, setEditState] = useState(() => selectedPlayer ? {
    planTitle: null, clinician: CLINICIAN_OPTIONS[0],
    planStart: selectedPlayer.planStart, durationDays: selectedPlayer.durationDays,
    phases: selectedPlayer.phases, milestones: selectedPlayer.milestones,
  } : null);

  let totalDays, referenceToday, planStartDate, resolveExercises, playerName, subtitleLine2, effectivePhases, effectiveMilestones, effectiveInjuryLabel, effectiveFamily, effectiveSourceTemplate;

  if (selectedPlayer) {
    totalDays = editState.durationDays;
    const todaysPlanDay = daysBetween(editState.planStart, TODAY) + 1;
    referenceToday = todaysPlanDay;
    planStartDate = editState.planStart;
    resolveExercises = (day) => ({ list: exercisesForDay(selectedPlayer.family, day), hasData: true });
    playerName = selectedPlayer.name;
    subtitleLine2 = todaysPlanDay > totalDays
      ? `${selectedPlayer.injury} · ${todaysPlanDay - totalDays} days beyond plan`
      : `${selectedPlayer.injury} · Day ${todaysPlanDay} of ${totalDays}`;
    effectivePhases = editState.phases;
    effectiveMilestones = editState.milestones;
    effectiveInjuryLabel = selectedPlayer.injury;
    effectiveFamily = selectedPlayer.family;
    effectiveSourceTemplate = selectedPlayer.sourceTemplate || null;
  } else {
    totalDays = isTemplateMode ? templateMeta.totalDays : (planTotalDays || BUILDER_TOTAL_DAYS);
    referenceToday = isTemplateMode ? null : BUILDER_TODAY_DAY;
    planStartDate = null;
    resolveExercises = (day) => ({ list: DAY_EXERCISES[day] || [], hasData: Object.prototype.hasOwnProperty.call(DAY_EXERCISES, day) });
    playerName = 'Marcus Ellery';
    subtitleLine2 = isTemplateMode ? '' : 'Grade II Hamstring Strain' + (isTemplate ? ' · built from Hamstring strain, grade II — standard' : ' · built from scratch, not saved as a template');
    effectivePhases = phases;
    effectiveMilestones = milestones;
    effectiveInjuryLabel = 'Grade II Hamstring Strain';
    effectiveFamily = 'Lower body muscle strain';
    effectiveSourceTemplate = sourceTemplate || null;
  }

  if (savedAsTemplateName && !isTemplateMode) {
    subtitleLine2 = subtitleLine2 + ` · saved as template: ${savedAsTemplateName}`;
  }

  const zoomSpan = (z) => z === '5 days' ? 5 : z === '1 week' ? 7 : z === '1 month' ? 30 : totalDays;
  const anchorDate = planStartDate || PLAN_START_DATE;
  const mondaySnap = (day) => {
    const d = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), anchorDate.getDate() + day - 1);
    const back = (d.getDay() + 6) % 7;
    return day - back;
  };
  const computeWindow = (rawStart, z) => {
    const span = Math.min(zoomSpan(z), totalDays);
    let start = z === '1 week' ? mondaySnap(rawStart) : rawStart;
    let end = start + span - 1;
    if (end > totalDays) { end = totalDays; start = Math.max(1, end - span + 1); }
    if (start < 1) { start = 1; end = Math.min(totalDays, start + span - 1); }
    return [start, end];
  };
  const defaultCenter = referenceToday != null ? Math.min(Math.max(referenceToday, 1), totalDays) : 1;

  const [zoom, setZoom] = useState('5 days');
  const [windowStart, setWindowStart] = useState(computeWindow(defaultCenter - 2, '5 days')[0]);
  const span = zoomSpan(zoom);
  const [ws, we] = computeWindow(windowStart, zoom);
  const isWholePlan = zoom === 'Whole plan';
  const todayInWindow = referenceToday != null && referenceToday >= ws && referenceToday <= we;
  const todayDay = todayInWindow ? referenceToday : null;

  const handleZoomChange = (newZoom) => {
    const newSpan = zoomSpan(newZoom);
    const center = referenceToday != null ? referenceToday : ws;
    setZoom(newZoom);
    setWindowStart(center - Math.floor((newSpan - 1) / 2));
  };
  const handlePrev = () => setWindowStart(ws - span);
  const handleNext = () => setWindowStart(ws + span);
  const handleToday = () => { if (referenceToday != null) setWindowStart(referenceToday - Math.floor((span - 1) / 2)); };

  const hasExercisesInWindow = Array.from({ length: we - ws + 1 }, (_, i) => ws + i).some((d) => resolveExercises(d).list.length > 0);
  const showGuidance = !isTemplateMode && !selectedPlayer && effectivePhases.length === 0 && !hasExercisesInWindow && !guidanceDismissed;

  const isCalendarView = !isTemplateMode && (zoom === '1 month' || isWholePlan);
  const [selectedDay, setSelectedDay] = useState(defaultCenter);
  const [checkedDays, setCheckedDays] = useState(new Set());
  const [exerciseOverrides, setExerciseOverrides] = useState({});
  const [viewMonthDate, setViewMonthDate] = useState(new Date(anchorDate.getFullYear(), anchorDate.getMonth(), anchorDate.getDate() + defaultCenter - 1));

  const getDayExercises = (day) => exerciseOverrides[day] !== undefined ? exerciseOverrides[day] : resolveExercises(day).list;
  const handleToggleCheck = (day) => setCheckedDays((prev) => { const next = new Set(prev); if (next.has(day)) next.delete(day); else next.add(day); return next; });
  const handleAddExercise = (day, ex) => setExerciseOverrides((prev) => ({ ...prev, [day]: [...getDayExercises(day), ex] }));
  const handleRemoveExercise = (day, idx) => setExerciseOverrides((prev) => ({ ...prev, [day]: getDayExercises(day).filter((_, i) => i !== idx) }));
  const handleClearDay = () => { if (selectedDay != null) setExerciseOverrides((prev) => ({ ...prev, [selectedDay]: [] })); };
  const handleOpenIn5DayView = () => {
    if (selectedDay == null) return;
    setZoom('5 days');
    setWindowStart(computeWindow(selectedDay - 2, '5 days')[0]);
  };
  const handleWholePlanCellClick = (day, e) => {
    if (e && e.shiftKey && selectedDay != null) {
      const lo = Math.min(selectedDay, day), hi = Math.max(selectedDay, day);
      setCheckedDays(new Set(Array.from({ length: hi - lo + 1 }, (_, i) => lo + i)));
    } else {
      setSelectedDay(day);
      setCheckedDays(new Set());
    }
  };
  const handleJumpToToday = () => { if (referenceToday != null) setSelectedDay(Math.min(Math.max(referenceToday, 1), totalDays)); };
  const handleZoomChangeFull = (newZoom) => {
    handleZoomChange(newZoom);
    const effectiveDay = selectedDay != null ? selectedDay : defaultCenter;
    if (selectedDay == null) setSelectedDay(effectiveDay);
    if (newZoom === '1 month') setViewMonthDate(new Date(anchorDate.getFullYear(), anchorDate.getMonth(), anchorDate.getDate() + effectiveDay - 1));
  };
  const handlePrevMonth = () => setViewMonthDate((d) => new Date(d.getFullYear(), d.getMonth() - 1, 1));

      affects: { losses: affectsLosses, changes: [], reassurances },
      needsFillChoice: Boolean(addedRange), needsPhaseAssignChoice: Boolean(addedRange) && effectivePhases.length > 0,
      lastPhaseName: effectivePhases.length ? effectivePhases[effectivePhases.length - 1].shortName : '',
      requiresRemovalCheckbox: Boolean(removedSet),
      removalCounts: removedSet ? { days: removedSet.size, exercises: removedExerciseCount, milestones: removedMilestonesList.length } : null,
      onConfirm: ({ fillChoice, phaseAssignChoice }) => {
        setEditState((prev) => {
          let nextPhases = prev.phases, nextMilestones = prev.milestones;
          if (removedSet) {
            nextPhases = remapPhasesAfterRemoval(prev.phases, removedSet, dayMap);
            nextMilestones = remapMilestonesAfterRemoval(prev.milestones, removedSet, dayMap);
          } else if (addedRange && phaseAssignChoice === 'extend' && prev.phases.length) {
            nextPhases = extendLastPhase(prev.phases, newDurationDays);
          }
          return { ...prev, planTitle, clinician, planStart: newStart, durationDays: newDurationDays, phases: nextPhases, milestones: nextMilestones };
        });
        setExerciseOverrides((prev) => {
          if (removedSet) return remapExerciseOverridesAfterRemoval(getDayExercises, removedSet, dayMap, oldTotalDays);
          if (addedRange) return buildAddedDaysOverrides(prev, getDayExercises, oldTotalDays, newDurationDays - oldTotalDays, fillChoice);
          return prev;
        });
        setPendingChange(null);
        setSnackbar({ message: `Return to play moved to ${formatDate(newRtpDate)}`, undo: null });
      },
    });
  };

  const monthStartD = new Date(viewMonthDate.getFullYear(), viewMonthDate.getMonth(), 1);
  const monthEndD = new Date(viewMonthDate.getFullYear(), viewMonthDate.getMonth() + 1, 0);
  const monthStartDay = daysBetween(anchorDate, monthStartD) + 1;
  const monthEndDay = daysBetween(anchorDate, monthEndD) + 1;
  const monthGridStart = mondaySnap(monthStartDay);
  const monthGridEnd = mondaySnap(monthEndDay) + 6;

  return (
    <Box sx={isCalendarView ? { display: 'flex', flexDirection: 'column', height: 'calc(100vh - 160px)', overflow: 'hidden' } : { display: 'flex', flexDirection: 'column', minHeight: 'calc(100vh - 160px)' }}>
      {isTemplateMode && <TemplateModeBanner />}
      {selectedPlayer && (
        <Box sx={{ px: 4, py: 2, borderBottom: '1px solid #E8EAED' }}>
          <Box sx={{ fontSize: 13, color: '#3B4960', cursor: 'pointer', width: 'fit-content' }} onClick={onBack}>‹ Rehab</Box>
        </Box>
      )}
      <PlanHeader mode={mode} isTemplate={isTemplate} templateMeta={templateMeta} phases={effectivePhases} milestones={effectiveMilestones} playerName={playerName} subtitleLine2={subtitleLine2} onOpenSaveTemplate={() => setSaveTemplateOpen(true)} onOpenEditDrawer={() => setEditDrawerOpen(true)} showEditPlanDetails={Boolean(selectedPlayer)} />
      {showGuidance && <FirstRunGuidance onDismiss={() => setGuidanceDismissed(true)} />}
      <BuilderToolbar zoom={zoom} onZoomChange={handleZoomChangeFull} windowStart={ws} windowEnd={we} totalDays={totalDays} onPrev={handlePrev} onNext={handleNext} onToday={handleToday} planStartDate={planStartDate} isTemplateMode={isTemplateMode} />
      <TimelineStrip mode={mode} totalDays={totalDays} phases={effectivePhases} milestones={effectiveMilestones} windowStart={ws} windowEnd={we} todayDay={todayDay} isWholePlan={isWholePlan} planStartDate={planStartDate} onPhaseClick={selectedPlayer ? handlePhaseClick : undefined} />
      {isCalendarView && checkedDays.size > 0 && (
        <BulkActionBar
          count={checkedDays.size} onClear={() => setCheckedDays(new Set())}
          onClearExercises={handleBulkClearExercises} onAssignToPhase={handleBulkAssignToPhase}
          onAddDays={handleBulkRequestAddDays} onRemoveDays={handleBulkRequestRemoveDays}
          phases={effectivePhases}
        />
      )}
      {isCalendarView ? (
        <Box sx={{ flex: 1, minHeight: 0, display: 'flex', overflow: 'hidden' }}>
          <Box sx={{ flex: 1, minWidth: 0, overflowY: 'auto', p: 2.5, ...(isWholePlan ? { display: 'flex', flexDirection: 'column', justifyContent: 'center' } : {}) }}>
            {zoom === '1 month' && (
              <>
                <MonthNavRow viewMonthDate={viewMonthDate} onPrevMonth={handlePrevMonth} onNextMonth={handleNextMonth} totalDays={totalDays} planStartDate={planStartDate} />
                <CalendarGrid gridStartDay={monthGridStart} gridEndDay={monthGridEnd} totalDays={totalDays} phases={effectivePhases} milestones={effectiveMilestones} resolveExercises={getDayExercises} planStartDate={planStartDate} todayPlanDay={referenceToday} selectedDay={selectedDay} onSelectDay={setSelectedDay} checkedDays={checkedDays} onToggleCheck={handleToggleCheck} onMilestoneClick={handleMilestoneClick} />
              </>
            )}
            {isWholePlan && (
              <WholePlanCalendar
                phases={effectivePhases} milestones={effectiveMilestones} totalDays={totalDays}
                planStartDate={planStartDate} todayPlanDay={referenceToday} selectedDay={selectedDay}
                checkedDays={checkedDays} onCellClick={handleWholePlanCellClick}
              />
            )}
          </Box>
          <Box sx={{ width: 380, minWidth: 380, borderLeft: '1px solid #E8EAED', overflowY: 'auto' }}>
            {zoom === '1 month' ? (
              <DetailPanel
                selectedDay={selectedDay} totalDays={totalDays} phases={effectivePhases} milestones={effectiveMilestones}
                planStartDate={planStartDate} todayPlanDay={referenceToday}
                exercises={selectedDay != null ? getDayExercises(selectedDay) : []}
                onRemoveExercise={(idx) => handleRemoveExercise(selectedDay, idx)}
                onAddExercise={(ex) => handleAddExercise(selectedDay, ex)}
                onOpenIn5DayView={handleOpenIn5DayView} onClearDay={handleClearDay}
                family={effectiveFamily} playerName={playerName} injuryLabel={effectiveInjuryLabel}
                onMilestoneClick={handleMilestoneClick}
              />
            ) : (
              <WholePlanPanel
                selectedDay={selectedDay} totalDays={totalDays} phases={effectivePhases} milestones={effectiveMilestones}
                planStartDate={planStartDate} todayPlanDay={referenceToday}
                exercises={selectedDay != null ? getDayExercises(selectedDay) : []}
                onRemoveExercise={(idx) => handleRemoveExercise(selectedDay, idx)}
                onAddExercise={(ex) => handleAddExercise(selectedDay, ex)}
                onOpenIn5DayView={handleOpenIn5DayView} onClearDay={handleClearDay}
                family={effectiveFamily} playerName={playerName} injuryLabel={effectiveInjuryLabel}
                onMilestoneClick={handleMilestoneClick}
                onJumpToday={handleJumpToToday} onEditPhases={undefined}
                onBackToOverview={() => setSelectedDay(null)}
              />
            )}
          </Box>
        </Box>
      ) : (
        <DayGrid phases={effectivePhases} milestones={effectiveMilestones} windowStart={ws} windowEnd={we} mode={mode} planStartDate={planStartDate} todayDay={todayDay} resolveExercises={resolveExercises} totalDays={totalDays} onMilestoneClick={handleMilestoneClick} />
      )}
      {!isTemplateMode && (
        <SaveTemplateModal
          open={saveTemplateOpen} onClose={() => setSaveTemplateOpen(false)}
          playerName={playerName} injuryLabel={effectiveInjuryLabel} phases={effectivePhases} milestones={effectiveMilestones}
          family={effectiveFamily} durationDays={totalDays} sourceTemplate={effectiveSourceTemplate}
          templatesData={templatesData} setTemplatesData={setTemplatesData} setSnackbar={setSnackbar}
          onSaved={setSavedAsTemplateName}
        />
      )}
      {selectedPlayer && (
        <>
          <PhasePopover
            anchorEl={phasePopoverAnchor} onClose={closePhasePopover}
            phase={phasePopoverTarget && phasePopoverTarget.phase} phaseIndex={phasePopoverTarget && phasePopoverTarget.index}
            phases={effectivePhases} totalDays={totalDays} planStartDate={planStartDate}
            onSaveImmediate={handlePhaseSaveImmediate} onExtendPastEnd={handlePhaseExtendPastEnd} onRemove={handlePhaseRemove}
            onRequestDurationChange={handlePhaseRequestDurationChange}
          />
          <MilestonePopover
            anchorEl={milestonePopoverAnchor} onClose={closeMilestonePopover}
            milestone={milestonePopoverTarget} phases={effectivePhases} totalDays={totalDays} planStartDate={planStartDate}
            onSaveImmediate={handleMilestoneSaveImmediate} onExtendPastEnd={handleMilestoneExtendPastEnd} onRemove={handleMilestoneRemove}
          />
          <ConfirmPlanChange open={Boolean(pendingChange)} onClose={() => setPendingChange(null)} change={pendingChange} />
          <CreateRehabDrawer
            mode="edit" open={editDrawerOpen} onClose={() => setEditDrawerOpen(false)} onCreate={() => {}}
            initialValues={editInitialValues} onSaveImmediate={handleEditSaveImmediate} onRequestConfirm={handleEditRequestConfirm}
          />
        </>
      )}
    </Box>
  );
}

function App() {
  const [screen, setScreen] = useState('hub');
  const [planSource, setPlanSource] = useState(null);
  const [planPhases, setPlanPhases] = useState([]);
  const [planMilestones, setPlanMilestones] = useState([]);
  const [mode, setMode] = useState('rehab');
  const [templateMeta, setTemplateMeta] = useState(null);
  const [planTotalDays, setPlanTotalDays] = useState(null);
  const [selectedPlayer, setSelectedPlayer] = useState(null);
  const [lastHubView, setLastHubView] = useState('table');
  const [templatesData, setTemplatesData] = useState(TEMPLATES_DATA);
  const [snackbar, setSnackbar] = useState(null);
  const snackbarView = typeof snackbar === 'string' ? { message: snackbar, undo: null } : snackbar;
  const [planSourceTemplate, setPlanSourceTemplate] = useState(null);
  const [planVersion, setPlanVersion] = useState(0);
  const handleDrawerCreate = (payload) => {
    setPlanVersion((v) => v + 1);
    setSelectedPlayer(null);
    setMode(payload.mode);
    setPlanSource(payload.mode === 'template' ? null : payload.path);
    setPlanPhases(payload.phases);
    setPlanMilestones(payload.milestones);
    setTemplateMeta(payload.mode === 'template' ? { title: payload.templateTitle, family: payload.injuryFamily, injuryType: payload.injuryType, durationLabel: payload.durationLabel, totalDays: payload.totalDays } : null);
    setPlanTotalDays(payload.mode === 'template' ? null : payload.totalDays || null);
    setPlanSourceTemplate(payload.sourceTemplate || null);
    if (payload.saveAsTemplate) {
      const t = payload.saveAsTemplate;
      setTemplatesData((prev) => [...prev, {
        name: t.name, phaseNames: (payload.phases || []).map((p) => p.shortName).join(' · '), family: t.family,
        duration: t.durationLabel, phases: t.phaseCount, milestones: t.milestoneCount, exercises: 0, used: 0, updated: formatDate(TODAY),
      }]);
      setSnackbar(`Plan created and saved as template: ${t.name}`);
    }
    setScreen('builder');
  };
  const handlePlayerSelected = (row, view) => {
    setPlanVersion((v) => v + 1);
    setSelectedPlayer(row);
    setLastHubView(view);
    setMode('rehab');
    setScreen('builder');
  };
  return (
    <Box sx={{ display: 'flex' }}>
      <NavRail />
      <Box sx={{ flex: 1, minWidth: 0, ml: '60px', minHeight: '100vh' }}>
        <TopBar />
        {screen !== 'builder' && <PageHeader />}
        {screen === 'hub' && <RehabHub setScreen={setScreen} onPlanCreated={handleDrawerCreate} onPlayerSelected={handlePlayerSelected} initialView={lastHubView} templatesData={templatesData} />}
        {screen === 'templates' && <TemplatesScreen setScreen={setScreen} onTemplateCreated={handleDrawerCreate} templatesData={templatesData} />}
        {screen === 'builder' && <BuilderScreen key={planVersion} planSource={planSource} phases={planPhases} milestones={planMilestones} mode={mode} templateMeta={templateMeta} planTotalDays={planTotalDays} selectedPlayer={selectedPlayer} onBack={() => setScreen('hub')} sourceTemplate={planSourceTemplate} templatesData={templatesData} setTemplatesData={setTemplatesData} setSnackbar={setSnackbar} />}
      </Box>
      <Snackbar
        open={Boolean(snackbarView && snackbarView.message)}
        autoHideDuration={6000}
        onClose={() => setSnackbar(null)}
        anchorOrigin={{ vertical: 'bottom', horizontal: 'left' }}
        message={snackbarView ? snackbarView.message : ''}
        action={snackbarView && snackbarView.undo ? (
          <Button variant="text" size="small" onClick={() => { snackbarView.undo(); setSnackbar(null); }} sx={{ color: '#fff' }}>Undo</Button>
        ) : null}
      />
    </Box>
  );
}

function PasswordGate() {
  const [unlocked, setUnlocked] = useState(() => sessionStorage.getItem('rehab_unlocked') === 'true');
  const [password, setPassword] = useState('');
  const [wrongPassword, setWrongPassword] = useState(false);

  if (unlocked) return <App />;

  const handleSubmit = () => {
    if (password === 'kitman2026') {
      sessionStorage.setItem('rehab_unlocked', 'true');
      setUnlocked(true);
    } else {
      setWrongPassword(true);
      setPassword('');
    }
  };

  return (
    <Box sx={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', bgcolor: '#F3F4F7' }}>
      <Box sx={{ width: 400, bgcolor: '#fff', borderRadius: '8px', border: '1px solid #E8EAED', p: 4, boxShadow: '0 4px 16px rgba(0,0,0,0.08)' }}>
        <Box sx={{ fontSize: 11, fontWeight: 600, color: '#5F7089', letterSpacing: '0.08em', mb: 0.5 }}>Kitman Labs</Box>
        <Box sx={{ fontSize: 20, fontWeight: 600, color: '#172B4D', mb: 1 }}>Rehab prototype</Box>
        <Box sx={{ fontSize: 12, color: '#5F7089', mb: 3 }}>Enter the password to view.</Box>
        <Box component="form" onSubmit={(e) => { e.preventDefault(); handleSubmit(); }}>
          <TextField
            variant="filled" size="small" type="password" label="Password" fullWidth
            value={password}
            onChange={(e) => { setPassword(e.target.value); setWrongPassword(false); }}
            error={wrongPassword}
            helperText={wrongPassword ? 'Incorrect password' : ''}
            FormHelperTextProps={{ sx: { color: '#D32F2F' } }}
            sx={{ mb: 2 }}
          />
          <Button type="submit" variant="contained" size="small" disableElevation fullWidth>View prototype</Button>
        </Box>
      </Box>
    </Box>
  );
}

function Root() {
  return <ThemeProvider theme={theme}><PasswordGate /></ThemeProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
