function mkDate(y, m, day) { return new Date(y, m - 1, day); }
const TODAY = mkDate(2026, 3, 18);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function formatDate(dt) { return `${dt.getDate()} ${MONTHS[dt.getMonth()]} ${dt.getFullYear()}`; }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function daysAgo(dt) { return daysBetween(dt, TODAY); }
function addDays(dt, n) { return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + n); }
function parseISODate(str) {
  if (!str) return null;
  const parts = String(str).split('-');
  if (parts.length !== 3) return null;
  const [y, m, d] = parts.map((p) => parseInt(p, 10));
  if (!y || !m || !d) return null;
  return mkDate(y, m, d);
}
function toISODate(dt) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
}
function formatDateWithWeekday(dt) { return `${WEEKDAYS[dt.getDay()]} ${dt.getDate()} ${MONTHS[dt.getMonth()]} ${dt.getFullYear()}`; }
function rtpInfo(rtp) {
  const days = daysBetween(TODAY, rtp);
  if (days < 0) return { color: '#5F7089', label: `${-days} days beyond plan` };
  if (days <= 7) return { color: '#ED6C02', label: `Coming up in ${days} days` };
  if (days <= 14) return { color: '#5F7089', label: `In ${days} days` };
  return { color: '#5F7089', label: null };
}
function initials(name) { return name.split(' ').map(p => p[0]).join('').toUpperCase(); }
const PHASE_COLOURS = ['#E4E9F0', '#DCE8E3', '#F0E7DA', '#E9E0EC'];
function makePhases(specs) {
  return specs.map(([name, shortName, startDay, endDay], i) => ({ name, shortName, startDay, endDay, colour: PHASE_COLOURS[i % PHASE_COLOURS.length] }));
}
function deriveProgress(player) {
  const dayNum = daysBetween(player.planStart, TODAY) + 1;
  const pct = dayNum / player.durationDays;
  if (dayNum <= player.durationDays) {
    const idx = player.phases.findIndex((p) => dayNum >= p.startDay && dayNum <= p.endDay);
    const phase = idx === -1 ? null : player.phases[idx];
    const label = phase ? `Phase ${idx + 1} of ${player.phases.length}: ${phase.shortName}` : `Day ${dayNum} of ${player.durationDays}`;
    return { label, pct };
  }
  const weekNow = Math.ceil(dayNum / 7);
  const weekTotal = Math.ceil(player.durationDays / 7);
  return { label: `Week ${weekNow} of ${weekTotal}`, pct };
}

function ProgressBar({ pct }) {
  const fillPct = Math.min(1, pct);
  const overrun = pct > 1;
  const overrunPct = overrun ? pct - 1 : 0;
  const width = overrun ? 160 + overrunPct * 160 : 160;
  return (
    <Box sx={{ position: 'relative', width, height: 8 }}>
      <Box sx={{ position: 'absolute', left: 0, top: 1, width: 160, height: 6, borderRadius: '3px', bgcolor: '#E8EAED' }} />
      <Box sx={{ position: 'absolute', left: 0, top: 1, width: fillPct * 160, height: 6, borderRadius: '3px', bgcolor: '#3B4960' }} />
      {overrun && <Box sx={{ position: 'absolute', left: 160, top: 0, width: 1, height: 8, bgcolor: '#5F7089' }} />}
      {overrun && <Box sx={{ position: 'absolute', left: 160, top: 1, width: overrunPct * 160, height: 6, borderRadius: '3px', bgcolor: '#D32F2F' }} />}
    </Box>
  );
}

// ---------- timeline ----------
const LANE_WIDTH = 1000;
const RANGE_START = mkDate(2026, 2, 1);
const RANGE_DAYS = 89;
const PX_PER_DAY = LANE_WIDTH / RANGE_DAYS;
function offsetPx(dt) { return daysBetween(RANGE_START, dt) * PX_PER_DAY; }
function clampPx(px) { return Math.max(0, Math.min(LANE_WIDTH, px)); }

function TimelineAxisHeader() {
  const marOffset = offsetPx(mkDate(2026, 3, 1));
  const aprOffset = offsetPx(mkDate(2026, 4, 1));
  const todayOffset = offsetPx(TODAY);
  return (
    <Box sx={{ display: 'flex', borderBottom: '1px solid #E8EAED' }}>
      <Box sx={{ width: 300, minWidth: 300 }} />
      <Box sx={{ width: 1000, minWidth: 1000, position: 'relative', height: 26 }}>
        <Box sx={{ position: 'absolute', left: 0, top: 6, fontSize: 11, color: '#5F7089' }}>Feb</Box>
        <Box sx={{ position: 'absolute', left: marOffset, top: 6, fontSize: 11, color: '#5F7089' }}>Mar</Box>
        <Box sx={{ position: 'absolute', left: aprOffset, top: 6, fontSize: 11, color: '#5F7089' }}>Apr</Box>
        <Box sx={{ position: 'absolute', left: todayOffset, top: 6, fontSize: 11, fontWeight: 600, color: '#1D2635' }}>Today 18 Mar</Box>
      </Box>
    </Box>
  );
}

function TimelineRow({ row, showMaint, onSelectPlayer }) {
  const rtpC = rtpInfo(row.rtp);
  const injPx = offsetPx(row.injuryDate);
  const rtpPx = offsetPx(row.rtp);
  const todayPx = offsetPx(TODAY);
  const isOverdue = row.rtp < TODAY;
  const barStart = clampPx(injPx);
  const barEnd = clampPx(rtpPx);
  const showBand = showMaint && row.maintenance;
  const laneHeight = showBand ? 62 : 44;
  const leftArrow = injPx < 0;
  const rightArrow = rtpPx > LANE_WIDTH;
  const labelLeft = (isOverdue ? clampPx(todayPx) : clampPx(rtpPx)) + 10;

  return (
    <Box onClick={() => onSelectPlayer(row)} sx={{ display: 'flex', borderBottom: '1px solid #E8EAED', cursor: 'pointer', '&:hover': { bgcolor: '#F9FAFB' } }}>
      <Box sx={{ width: 300, minWidth: 300, py: 1.5, px: 2 }}>
        <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
          <Avatar sx={{ width: 26, height: 26, bgcolor: '#E8EAED', color: '#5F7089', fontSize: 11 }}>{initials(row.name)}</Avatar>
          <Box sx={{ fontSize: 12, fontWeight: 600, color: '#172B4D' }}>{row.name}</Box>
        </Box>
        <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.5, ml: '34px' }}>
          <Box sx={{ fontSize: 10, color: '#5F7089' }}>{row.pos}</Box>
          {row.chronic.length > 0 && <Box sx={{ width: 6, height: 6, borderRadius: '50%', bgcolor: '#5F7089' }} />}
        </Box>
        <Box sx={{ fontSize: 10, color: '#5F7089', ml: '34px' }}>{row.injury}</Box>
        {showBand && (
          <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.5, ml: '34px', mt: 0.3 }}>
            <Box sx={{ width: 8, height: 8, bgcolor: '#DEE8E8', border: '1px solid #59898E' }} />
            <Box sx={{ fontSize: 9, color: '#5F7089' }}>{row.maintenance}</Box>
          </Box>
        )}
      </Box>
      <Box sx={{ width: 1000, minWidth: 1000, position: 'relative', height: laneHeight, overflow: 'hidden' }}>
        <Box sx={{ position: 'absolute', left: barStart, top: 16, width: Math.max(0, barEnd - barStart), height: 12, borderRadius: '6px', bgcolor: '#CCD6E0' }} />
        {isOverdue && (
          <Box sx={{ position: 'absolute', left: clampPx(rtpPx), top: 16, width: Math.max(0, clampPx(todayPx) - clampPx(rtpPx)), height: 12, borderRadius: '6px', bgcolor: '#D32F2F', zIndex: 1 }} />
        )}
        <Box sx={{ position: 'absolute', left: clampPx(rtpPx) - 5.5, top: 16.5, width: 11, height: 11, borderRadius: '50%', bgcolor: rtpC.color, border: '2px solid #fff', zIndex: 2 }} />
        {rtpC.label && <Box sx={{ position: 'absolute', left: labelLeft, top: 14, fontSize: 10, color: rtpC.color, whiteSpace: 'nowrap' }}>{rtpC.label}</Box>}
        <Box sx={{ position: 'absolute', left: todayPx - 1, top: 0, width: 2, height: laneHeight, bgcolor: '#1D2635' }} />
        {leftArrow && <Box sx={{ position: 'absolute', left: 0, top: 14, fontSize: 14, color: '#5F7089' }}>‹</Box>}
        {rightArrow && <Box sx={{ position: 'absolute', left: 988, top: 14, fontSize: 14, color: '#5F7089' }}>›</Box>}
        {showBand && (
          <Box sx={{ position: 'absolute', left: 0, top: 40, width: 1000, height: 10, borderRadius: '5px', bgcolor: '#DEE8E8', border: '1px dashed #59898E' }} />
        )}
      </Box>
    </Box>
  );
}

  const [showOther, setShowOther] = useState(false);

  const other = (templatesData || []).filter((t) => t.family !== injuryFamily).sort((a, b) => b.used - a.used);

  useEffect(() => {
    if (selected === null) setSelected(matching.length ? matching[0].name : 'scratch');
  }, [injuryFamily]);

  return (
    <Box>
      <Box sx={{ bgcolor: '#F3F4F7', borderRadius: 1, p: 1.5, fontSize: 11, color: '#5F7089', mb: 2.5 }}>
        A template sets the length and brings its phases, milestones and exercises. Starting from scratch means you set the length yourself.

      {matching.length > 0 ? (
        <>
          <Box sx={{ fontSize: 10, fontWeight: 600, color: '#5F7089', mb: 1.5 }}>MATCHING {injuryFamily}</Box>
          {matching.map((t) => (
            <SelectCard key={t.name} selected={selected === t.name} onClick={() => setSelected(t.name)} title={t.name} subtitle={`${t.duration} · ${t.phases} phases · ${t.milestones} milestones · ${t.exercises} exercises`} meta={`Used ${t.used}×`} />

            <Box sx={{ fontSize: 10, fontWeight: 600, color: '#5F7089', mb: 1.5 }}>OTHER TEMPLATES</Box>

      <Divider sx={{ my: 2 }} />
      <SelectCard selected={selected === 'scratch'} onClick={() => setSelected('scratch')} title="Start from scratch" subtitle="Empty canvas. Add phases, milestones and exercises yourself." />
    </Box>
  );
}

function StepPhases({ phases, addPhase, removePhase, totalDays, startDateObj, durationOptions, onExtendDuration }) {
  const covered = phases.reduce((sum, p) => sum + (p.dayEnd - p.dayStart + 1), 0);
  const nextDay = phases.length ? Math.max(...phases.map((p) => p.dayEnd)) + 1 : 1;
  const [name, setName] = useState('');
  const [startDayInput, setStartDayInput] = useState(null);
  const [durationLabel, setDurationLabel] = useState('');
  const startDay = startDayInput === null ? nextDay : startDayInput;
  const durationDays = (PHASE_DURATION_OPTIONS.find((d) => d.label === durationLabel) || {}).days;
  const endDay = durationDays ? startDay + durationDays - 1 : null;
  const overlapping = phases.find((p) => endDay !== null && startDay <= p.dayEnd && endDay >= p.dayStart);
  const overPlanEnd = endDay !== null && endDay > totalDays;
  const canAdd = name.trim() && durationDays && !overlapping;

  const handleAdd = () => {
    addPhase(name.trim(), startDay, durationLabel, durationDays);
    setName(''); setStartDayInput(null); setDurationLabel('');
  };

  return (
    <Box>
      <Box sx={{ bgcolor: '#F3F4F7', borderRadius: 1, p: 1.5, fontSize: 11, color: '#5F7089', mb: 2.5 }}>
        Optional. Skip this to build one continuous plan. Durations are estimates, progression is by milestone not by date.
      </Box>

      <TextField variant="filled" size="small" label="Phase name" value={name} onChange={(e) => setName(e.target.value)} fullWidth sx={{ mb: 1.5 }} />
      <Box sx={{ display: 'flex', gap: 2, mb: 0.5 }}>
        <TextField variant="filled" size="small" type="number" label="Starts on day" value={startDay} onChange={(e) => setStartDayInput(Number(e.target.value))} sx={{ flex: 1 }} />
        <Select variant="filled" size="small" value={durationLabel} onChange={(e) => setDurationLabel(e.target.value)} displayEmpty sx={{ flex: 1 }}>
          <MenuItem value="" disabled>Duration</MenuItem>
          {PHASE_DURATION_OPTIONS.map((d) => <MenuItem key={d.label} value={d.label}>{d.label}</MenuItem>)}
        </Select>
      </Box>
      {overlapping && (
        <Box sx={{ fontSize: 11, color: '#D32F2F', mb: 0.5 }}>Days {startDay} to {endDay} are already in {overlapping.name}.</Box>
      )}
      {endDay !== null && (
        <Box sx={{ fontSize: 11, color: '#5F7089', mb: 1.5 }}>Ends on day {endDay}{startDateObj ? ` · ${formatDate(addDays(startDateObj, endDay - 1))}` : ''}</Box>
      )}
      <Button variant="text" size="small" onClick={handleAdd} disabled={!canAdd} sx={{ mb: 2.5, fontSize: 12 }}>Add phase</Button>

      {phases.length === 0 ? (
        <Box sx={{ fontSize: 12, color: '#5F7089' }}>No phases yet</Box>
      ) : phases.map((phase) => (
        <Box key={phase.id} sx={{ border: '1px solid #E8EAED', borderRadius: 1, p: 1.5, mb: 1 }}>
          <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
            <DragHandleIcon style={{ color: '#CCD6E0' }} />
            <Box sx={{ fontSize: 12, fontWeight: 600, color: '#172B4D', flex: 1 }}>{phase.name}</Box>
            <IconButton size="small" onClick={() => removePhase(phase.id)}><XIcon size={14} /></IconButton>
          </Box>
          <Box sx={{ display: 'flex', justifyContent: 'space-between', ml: '22px', mt: 0.5 }}>
            <Box sx={{ fontSize: 10, color: '#5F7089' }}>Days {phase.dayStart} to {phase.dayEnd} · {phase.durationLabel}</Box>
            {startDateObj && (
              <Box sx={{ fontSize: 10, color: '#5F7089' }}>{formatDate(addDays(startDateObj, phase.dayStart - 1))} – {formatDate(addDays(startDateObj, phase.dayEnd - 1))}</Box>
            )}
          </Box>
        </Box>
      ))}

      {overPlanEnd ? (
        <Box sx={{ bgcolor: '#FDF3E7', border: '1px solid #ED6C02', borderRadius: 1, p: 1.5, mt: 1.5, fontSize: 11, color: '#3B4960' }}>
          This phase would end on day {endDay}, {endDay - totalDays} days past the end of the plan.
          <Box sx={{ display: 'flex', gap: 2, mt: 1 }}>
            <Button variant="text" size="small" onClick={() => setDurationLabel('')} sx={{ fontSize: 11 }}>Shorten the phase</Button>
            <Button variant="text" size="small" onClick={() => onExtendDuration(endDay)} sx={{ fontSize: 11 }}>Extend the plan to {nextDurationCovering(endDay, durationOptions).label}</Button>
          </Box>
        </Box>
      ) : (
        <Box sx={{ bgcolor: '#F3F4F7', borderRadius: 1, p: 1.5, mt: 1.5, fontSize: 11, color: '#3B4960' }}>
          {covered >= totalDays ? `All ${totalDays} days are in a phase.` : `${totalDays - covered} of the ${totalDays} day plan is not yet in a phase. That is allowed, phases are optional.`}
        </Box>
      )}
    </Box>
  );
}

function StepMilestones({ phases, milestones, addMilestone, removeMilestone, menuAnchor, openMenu, closeMenu, totalDays }) {
  const row = (m) => (
    <Box key={m.id} sx={{ display: 'flex', alignItems: 'center', gap: 1.5, py: 0.75 }}>
      <Box sx={{ width: 8, height: 8, bgcolor: '#ED6C02', transform: 'rotate(45deg)', flexShrink: 0 }} />
      <Box sx={{ fontSize: 12, color: '#3B4960', flex: 1 }}>{m.text}</Box>
      <IconButton size="small" onClick={() => removeMilestone(m.id)}><XIcon size={14} /></IconButton>
    </Box>
  );
  const findPhase = (day) => phases.find((p) => day >= p.dayStart && day <= p.dayEnd) || null;
  const unassigned = milestones.filter((m) => !findPhase(m.day));
  const defaultUnassignedDay = Math.max(1, Math.ceil(totalDays / 2));
  return (
    <Box>
      <Box sx={{ bgcolor: '#F3F4F7', borderRadius: 1, p: 1.5, fontSize: 11, color: '#5F7089', mb: 2.5 }}>
        Optional. Milestones are the criteria for leaving a phase.
      </Box>
      {phases.map((phase) => (
        <Box key={phase.id} sx={{ mb: 2.5 }}>
          <Box sx={{ fontSize: 11, fontWeight: 600, color: '#172B4D', mb: 0.5 }}>{phase.shortName} · Day {phase.dayStart}–{phase.dayEnd}</Box>
          {milestones.filter((m) => findPhase(m.day) === phase).map(row)}
          <Button variant="outlined" size="small" onClick={(e) => openMenu(e, phase.dayEnd)} sx={{ mt: 0.5 }}>+ Add milestone</Button>
        </Box>
      ))}
      {(phases.length === 0 || unassigned.length > 0) && (
        <Box sx={{ mb: 2.5 }}>
          {phases.length > 0 && <Box sx={{ fontSize: 11, fontWeight: 600, color: '#172B4D', mb: 0.5 }}>Unphased</Box>}
          {unassigned.map(row)}
          <Button variant="outlined" size="small" onClick={(e) => openMenu(e, defaultUnassignedDay)} sx={{ mt: 0.5 }}>+ Add milestone</Button>
        </Box>
      )}
      <Menu anchorEl={menuAnchor} open={Boolean(menuAnchor)} onClose={closeMenu}>
        {MILESTONE_OPTIONS.map((opt) => <MenuItem key={opt} onClick={() => addMilestone(opt)}>{opt}</MenuItem>)}
        <Divider />
        <MenuItem onClick={() => addMilestone('New milestone')}>+ Create a new milestone</MenuItem>
      </Menu>
    </Box>
  );
}

function StepTemplateDetails({ title, setTitle, family, setFamily, injuryType, setInjuryType, duration, setDuration }) {
  return (
    <Box sx={{ display: 'flex', flexDirection: 'column', gap: 2.5 }}>
      <TextField variant="filled" size="small" placeholder="e.g. Hamstring strain, grade II — standard" value={title} onChange={(e) => setTitle(e.target.value)} fullWidth />
      <Select variant="filled" size="small" value={family} onChange={(e) => setFamily(e.target.value)} displayEmpty fullWidth>
        <MenuItem value="" disabled>Injury family</MenuItem>
        {INJURY_FAMILY_OPTIONS.map((f) => <MenuItem key={f} value={f}>{f}</MenuItem>)}
      </Select>
      <Box>
        <Box sx={{ fontSize: 12, fontWeight: 600, color: '#172B4D', mb: 0.5 }}>Injury type (optional)</Box>
        <Select variant="filled" size="small" value={injuryType} onChange={(e) => setInjuryType(e.target.value)} fullWidth>
          {INJURY_TYPE_OPTIONS.map((t) => <MenuItem key={t} value={t}>{t}</MenuItem>)}
        </Select>
        <Box sx={{ fontSize: 11, color: '#5F7089', mt: 0.5 }}>Leave unset to reuse this template across the whole injury family.</Box>
      </Box>
      <Box>
        <Select variant="filled" size="small" value={duration} onChange={(e) => setDuration(e.target.value)} fullWidth>
          {TEMPLATE_DURATION_OPTIONS.map((d) => <MenuItem key={d.label} value={d.days}>{d.label}</MenuItem>)}
        </Select>
        <Box sx={{ fontSize: 11, color: '#5F7089', mt: 0.5 }}>Days in a template are relative. There is no athlete and no calendar.</Box>
      </Box>
    </Box>
  );
}

function StepTemplateReview({ title, family, injuryType, durationLabel, totalDays, phases, milestones }) {
  const row = (label, value) => (
    <Box sx={{ display: 'flex', justifyContent: 'space-between', py: 1.25, borderBottom: '1px solid #E8EAED' }}>
      <Box sx={{ fontSize: 12, color: '#5F7089' }}>{label}</Box>
      <Box sx={{ fontSize: 12, fontWeight: 600, color: '#172B4D' }}>{value}</Box>
    </Box>
  );
  return (
    <Box>
      {row('Template title', title)}
      {row('Injury family', family)}
      {row('Injury type', injuryType)}
      {row('Duration', `${durationLabel} · ${totalDays} days`)}
      {row('Phases', phases.length)}
      {row('Milestones', milestones.length)}
      {row('Exercises', 'None yet')}
      <Box sx={{ bgcolor: '#F3F4F7', borderRadius: 1, p: 1.5, mt: 2.5 }}>
        <Box sx={{ fontSize: 11, color: '#5F7089' }}>No exercises yet. Add them on the next screen. A template without exercises is only a skeleton, so most of the value comes from filling it in.</Box>
      </Box>
    </Box>
  );
}

function CreateRehabDrawer({ mode, open, onClose, onCreate, initialValues, onSaveImmediate, onRequestConfirm, templatesData }) {
  const [stepIndex, setStepIndex] = useState(0);
  const [planTitle, setPlanTitle] = useState('');
  const [player, setPlayer] = useState('');
  const [injuryIdx, setInjuryIdx] = useState(-1);
  const [clinician, setClinician] = useState('');
  const [startDateText, setStartDateText] = useState('');
  const [startFrom, setStartFrom] = useState(null);
  const [durationOverridden, setDurationOverridden] = useState(false);
  const [phases, setPhases] = useState([]);
  const [milestones, setMilestones] = useState([]);
  const [milestoneMenu, setMilestoneMenu] = useState({ anchor: null, day: null });
  const [templateTitle, setTemplateTitle] = useState('');
  const [injuryFamily, setInjuryFamily] = useState('');
  const [injuryType, setInjuryType] = useState('Not specified');
  const [duration, setDuration] = useState('');
  const [alsoSaveTemplate, setAlsoSaveTemplate] = useState(false);
  const [inlineTemplateNameOverride, setInlineTemplateNameOverride] = useState(null);
  const [inlineTemplateFamily, setInlineTemplateFamily] = useState('');

  useEffect(() => {
    if (open && mode === 'edit' && initialValues) {
      setPlanTitle(initialValues.planTitle || '');
      setClinician(initialValues.clinician);
      setStartDateText(initialValues.startDateText);
      setDuration(initialValues.duration);
    }
  }, [open, mode]);

  const path = startFrom === null ? null : startFrom === 'scratch' ? 'scratch' : 'template';
  const templateName = path === 'template' ? startFrom : null;
  const selectedTemplateObj = templateName ? (templatesData || []).find((t) => t.name === templateName) : null;
  const sourceTemplateDuration = selectedTemplateObj ? selectedTemplateObj.duration : '';
  const effectivePhaseCount = path === 'template' ? STANDARD_TEMPLATE_PHASES.length : phases.length;
  const effectiveMilestoneCount = path === 'template' ? STANDARD_TEMPLATE_MILESTONES.length : milestones.length;
  const injuryOptionsForPlayer = player ? (PLAYER_INJURY_OPTIONS[player] || []) : [];
  const selectedInjury = injuryIdx >= 0 ? injuryOptionsForPlayer[injuryIdx] : null;
  const injuryFamilyForMatch = selectedInjury ? selectedInjury.family : null;
  const inlineTemplateName = inlineTemplateNameOverride !== null ? inlineTemplateNameOverride : (selectedInjury ? selectedInjury.label : '');
  const inlineFamily = inlineTemplateFamily || (selectedInjury ? selectedInjury.family : '');
  const durationOptions = mode === 'template' ? TEMPLATE_DURATION_OPTIONS : REHAB_DURATION_OPTIONS;
  const totalDays = duration || 35;
  const durationLabel = duration ? durationDaysToLabel(duration, durationOptions) : '';
  const startDateObj = parseISODate(startDateText) || mkDate(2026, 2, 25);
  const hasValidStart = Boolean(parseISODate(startDateText));
  const hasValidDuration = Boolean(duration);
  const rtpLabel = mode === 'edit' || (hasValidStart && hasValidDuration) ? formatDateWithWeekday(addDays(startDateObj, totalDays - 1)) : '—';
  const steps = getDrawerSteps(mode, path);
  const stepKey = steps[stepIndex] || steps[0];
  const isOptionalStep = OPTIONAL_STEPS.includes(stepKey);
  const isFinalStep = stepIndex === steps.length - 1 && stepKey !== 'startFrom' && stepKey !== 'athlete';
  const progress = steps.length > 1 ? stepIndex / (steps.length - 1) : 0;

  const reset = () => {
    setStepIndex(0); setPlanTitle(''); setPlayer(''); setInjuryIdx(-1); setClinician('');
    setStartDateText(''); setStartFrom(null); setDurationOverridden(false); setPhases([]); setMilestones([]);
    setTemplateTitle(''); setInjuryFamily(''); setInjuryType('Not specified'); setDuration('');
    setAlsoSaveTemplate(false); setInlineTemplateNameOverride(null); setInlineTemplateFamily('');
  };
  const handleClose = () => { reset(); onClose(); };
  const goBack = () => setStepIndex((i) => Math.max(0, i - 1));
  const goNext = () => setStepIndex((i) => Math.min(steps.length - 1, i + 1));
  const handleSelectPlayer = (value) => { setPlayer(value); setInjuryIdx(-1); };
  const handleSelectInjury = (idx) => { setInjuryIdx(idx); setStartFrom(null); };
  const handleSelectStartFrom = (value) => {
    setStartFrom(value);
    setDurationOverridden(false);
    if (value !== 'scratch') {
      const t = (templatesData || []).find((tpl) => tpl.name === value);
      if (t) setDuration(parseDurationString(t.duration));
    }
  };

  const addPhase = (name, startDay, durationLabelForPhase, durationDays) => {
    setPhases((prev) => [...prev, { id: Date.now() + Math.random(), name, shortName: name, dayStart: startDay, dayEnd: startDay + durationDays - 1, durationLabel: durationLabelForPhase }]);
  };
  const removePhase = (id) => setPhases((prev) => prev.filter((p) => p.id !== id));
  const openMilestoneMenu = (e, day) => setMilestoneMenu({ anchor: e.currentTarget, day });
  const closeMilestoneMenu = () => setMilestoneMenu({ anchor: null, day: null });
  const addMilestone = (text) => {
    setMilestones((prev) => [...prev, { id: Date.now() + Math.random(), text, day: milestoneMenu.day }]);
    closeMilestoneMenu();
  };
  const removeMilestone = (id) => setMilestones((prev) => prev.filter((m) => m.id !== id));
  const convertPhases = () => phases.map((p) => ({ name: p.name, shortName: p.shortName, startDay: p.dayStart, endDay: p.dayEnd }));
  const convertMilestones = () => milestones.map((m) => ({ text: m.text, day: m.day }));
  const handleCreate = () => {
    const saveAsTemplate = alsoSaveTemplate ? { name: inlineTemplateName, family: inlineFamily, phaseCount: effectivePhaseCount, milestoneCount: effectiveMilestoneCount, durationLabel } : null;
    if (mode === 'template') {
      onCreate({ mode, phases: convertPhases(), milestones: convertMilestones(), templateTitle, injuryFamily, injuryType, durationLabel, totalDays });
    } else if (path === 'template') {
      onCreate({ mode, path, phases: STANDARD_TEMPLATE_PHASES, milestones: STANDARD_TEMPLATE_MILESTONES, totalDays, sourceTemplate: templateName, saveAsTemplate });
    } else {
      onCreate({ mode, path, phases: convertPhases(), milestones: convertMilestones(), totalDays, saveAsTemplate });
    }
    reset();
  };
  const handleSaveEdit = () => {
    const startChanged = initialValues && startDateText !== initialValues.startDateText;
    const durationChanged = initialValues && duration !== initialValues.duration;
    if (!startChanged && !durationChanged) {
      onSaveImmediate({ planTitle, clinician });
    } else {
      onRequestConfirm({ startDateText, duration, planTitle, clinician, startChanged, durationChanged });
    }
    onClose();
  };

  return (
    <Drawer anchor="right" open={open} onClose={handleClose} ModalProps={{ BackdropProps: { sx: { bgcolor: 'rgba(0,0,0,0.15)' } } }} PaperProps={{ sx: { width: 520, display: 'flex', flexDirection: 'column', height: '100%' } }}>
      <Box sx={{ px: 3, py: 2.5, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
        <Box>
          <Box sx={{ fontSize: 17, fontWeight: 600, color: '#172B4D' }}>{mode === 'edit' ? 'Edit rehab plan' : mode === 'template' ? 'Create rehab template' : 'Create rehab plan'}</Box>
          {mode === 'edit' ? (
            initialValues && <Box sx={{ fontSize: 11, color: '#5F7089', mt: 0.5 }}>{initialValues.playerName} · {initialValues.injuryLabel}</Box>
          ) : mode === 'template' ? (
            templateTitle && <Box sx={{ fontSize: 11, color: '#5F7089', mt: 0.5 }}>{templateTitle}</Box>
          ) : (
            stepIndex > 0 && player && <Box sx={{ fontSize: 11, color: '#5F7089', mt: 0.5 }}>{player.split(' · ')[0]}{selectedInjury ? ` · ${selectedInjury.label}` : ''}</Box>
          )}
        </Box>
        <IconButton size="small" onClick={handleClose}><XIcon size={16} /></IconButton>
      </Box>

      {mode !== 'edit' && (
        <Box sx={{ px: 3, py: 1.5, borderBottom: '1px solid #E8EAED' }}>
          <Box sx={{ display: 'flex', alignItems: 'baseline', gap: 0.75 }}>
            <Box sx={{ fontSize: 13, fontWeight: 600, color: '#172B4D' }}>{PHASE_STEP_LABELS[stepKey]}</Box>
            {isOptionalStep && <Box sx={{ fontSize: 11, color: '#5F7089' }}>(optional)</Box>}
          </Box>
          <Box sx={{ mt: 1, height: 3, borderRadius: '2px', bgcolor: '#E8EAED', position: 'relative' }}>
            <Box sx={{ position: 'absolute', left: 0, top: 0, height: 3, borderRadius: '2px', width: `${progress * 100}%`, bgcolor: '#1D2635' }} />
          </Box>
        </Box>
      )}

      <Box sx={{ flex: 1, overflowY: 'auto', px: 3, py: 2.5 }}>
        {stepKey === 'details' && mode === 'edit' && (
          <StepDetails planTitle={planTitle} setPlanTitle={setPlanTitle} clinician={clinician} setClinician={setClinician} startDateText={startDateText} setStartDateText={setStartDateText} duration={duration} setDuration={setDuration} durationOptions={durationOptions} rtpLabel={rtpLabel} path={path} readOnly playerNameReadOnly={initialValues && initialValues.playerName} injuryLabelReadOnly={initialValues && initialValues.injuryLabel} />
        )}
        {stepKey === 'athlete' && <StepAthlete player={player} setPlayer={handleSelectPlayer} injuryIdx={injuryIdx} setInjuryIdx={handleSelectInjury} />}
        {stepKey === 'startFrom' && <StepStartFrom selected={startFrom} setSelected={handleSelectStartFrom} templatesData={templatesData} injuryFamily={injuryFamilyForMatch} />}
        {stepKey === 'details' && mode !== 'edit' && (
          <>
            <Box sx={{ fontSize: 11, color: '#5F7089', mb: 2 }}>{player.split(' · ')[0]}{selectedInjury ? ` · ${selectedInjury.label}` : ''}</Box>
            <StepDetails
              planTitle={planTitle} setPlanTitle={setPlanTitle}
              clinician={clinician} setClinician={setClinician}
              startDateText={startDateText} setStartDateText={setStartDateText}
              duration={duration} setDuration={setDuration} durationOptions={durationOptions}
              rtpLabel={rtpLabel} path={path} hideIdentity
              durationOverridden={durationOverridden} onChangeDuration={() => setDurationOverridden(true)}
              sourceTemplateName={templateName} sourceTemplateDuration={sourceTemplateDuration}
            />
          </>
        )}
        {stepKey === 'phases' && <StepPhases phases={phases} addPhase={addPhase} removePhase={removePhase} totalDays={totalDays} startDateObj={startDateObj} durationOptions={durationOptions} onExtendDuration={(target) => setDuration(nextDurationCovering(target, durationOptions).days)} />}
        {stepKey === 'milestones' && <StepMilestones phases={phases} milestones={milestones} addMilestone={addMilestone} removeMilestone={removeMilestone} menuAnchor={milestoneMenu.anchor} openMenu={openMilestoneMenu} closeMenu={closeMilestoneMenu} totalDays={totalDays} />}
        {stepKey === 'tplDetails' && <StepTemplateDetails title={templateTitle} setTitle={setTemplateTitle} family={injuryFamily} setFamily={setInjuryFamily} injuryType={injuryType} setInjuryType={setInjuryType} duration={duration} setDuration={setDuration} />}
        {stepKey === 'tplPhases' && <StepPhases phases={phases} addPhase={addPhase} removePhase={removePhase} totalDays={totalDays} startDateObj={null} durationOptions={durationOptions} onExtendDuration={(target) => setDuration(nextDurationCovering(target, durationOptions).days)} />}
        {stepKey === 'tplMilestones' && <StepMilestones phases={phases} milestones={milestones} addMilestone={addMilestone} removeMilestone={removeMilestone} menuAnchor={milestoneMenu.anchor} openMenu={openMilestoneMenu} closeMenu={closeMilestoneMenu} totalDays={totalDays} />}
        {stepKey === 'tplReview' && <StepTemplateReview title={templateTitle} family={injuryFamily} injuryType={injuryType} durationLabel={durationLabel} totalDays={totalDays} phases={phases} milestones={milestones} />}
      </Box>

      {mode === 'rehab' && isFinalStep && (effectivePhaseCount > 0 || effectiveMilestoneCount > 0) && (
        <Box sx={{ px: 3, py: 2, borderTop: '1px solid #E8EAED' }}>
          <FormControlLabel
            control={<Checkbox checked={alsoSaveTemplate} onChange={(e) => setAlsoSaveTemplate(e.target.checked)} />}
            label="Also save this as a template"
            sx={{ '& .MuiFormControlLabel-label': { fontSize: 13, color: '#3B4960' } }}
          />
          {alsoSaveTemplate && (
            <Box sx={{ display: 'flex', flexDirection: 'column', gap: 1.5, mt: 1 }}>
              <TextField variant="filled" size="small" label="Template name" value={inlineTemplateName} onChange={(e) => setInlineTemplateNameOverride(e.target.value)} fullWidth />
              <Select variant="filled" size="small" value={inlineFamily} onChange={(e) => setInlineTemplateFamily(e.target.value)} fullWidth>
                {INJURY_FAMILY_OPTIONS.map((f) => <MenuItem key={f} value={f}>{f}</MenuItem>)}
              </Select>
              <Box sx={{ fontSize: 11, color: '#5F7089' }}>
                Saves the {effectivePhaseCount} phases and {effectiveMilestoneCount} milestones. No exercises yet, so this will be a skeleton you can fill in later from the template area.
              </Box>
            </Box>
          )}
        </Box>
      )}

      <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', px: 3, py: 2, borderTop: '1px solid #E8EAED' }}>
        <Button variant="outlined" size="small" onClick={mode === 'edit' ? handleClose : (stepIndex === 0 ? handleClose : goBack)} sx={{ fontSize: 13 }}>{mode === 'edit' || stepIndex === 0 ? 'Cancel' : 'Back'}</Button>
        <Box sx={{ display: 'flex', gap: 1.5 }}>
          {mode === 'edit' ? (
            <Button variant="contained" size="small" disableElevation onClick={handleSaveEdit} sx={{ fontSize: 13 }}>Save changes</Button>
          ) : (
            <>
              {isOptionalStep && <Button variant="outlined" size="small" onClick={goNext} sx={{ fontSize: 13 }}>Skip</Button>}
              {isFinalStep
                ? <Button variant="contained" size="small" disableElevation onClick={handleCreate} disabled={stepKey === 'details' && mode === 'rehab' && (!hasValidStart || !hasValidDuration)} sx={{ fontSize: 13 }}>{mode === 'template' ? 'Create template' : 'Create plan'}</Button>
                : <Button variant="contained" size="small" disableElevation onClick={goNext} disabled={
                    (stepKey === 'athlete' && (!player || injuryIdx < 0)) ||
                    (stepKey === 'startFrom' && startFrom === null) ||
                    (stepKey === 'details' && mode === 'rehab' && (!hasValidStart || !hasValidDuration)) ||
                    (stepKey === 'tplDetails' && !templateTitle)
                  } sx={{ fontSize: 13 }}>Continue</Button>}
            </>
          )}
        </Box>
      </Box>
    </Drawer>
  );
}

// ---------- screens ----------
function RehabHub({ setScreen, onPlanCreated, onPlayerSelected, initialView, templatesData }) {
  const [status, setStatus] = useState('active');
  const [view, setView] = useState(initialView || 'table');
  const [showMaint, setShowMaint] = useState(false);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const handleSelectPlayer = (row) => onPlayerSelected(row, view);
  return (
    <Box sx={{ px: 4, py: 3 }}>
      <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <Box sx={{ fontSize: 24, fontWeight: 600, color: '#172B4D' }}>Rehab</Box>
        <Button variant="contained" size="small" disableElevation onClick={() => setDrawerOpen(true)}>Create rehab</Button>
      </Box>
      <FiltersRow />
      <ControlsRow status={status} setStatus={setStatus} view={view} setView={setView} showMaint={showMaint} setShowMaint={setShowMaint} setScreen={setScreen} />

function TemplatesScreen({ setScreen, onTemplateCreated, templatesData }) {
  const [search, setSearch] = useState('');
  const [family, setFamily] = useState('All injury families');
  const [createdBy, setCreatedBy] = useState('All clinicians');
  const [page, setPage] = useState(1);
  const [rowsPerPage, setRowsPerPage] = useState(10);
  const [menuAnchor, setMenuAnchor] = useState(null);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const closeMenu = () => setMenuAnchor(null);

const REHAB_START_DATE = mkDate(2026, 2, 25);

const BUILDER_TODAY_DAY = 22;
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const PLAN_START_DATE = mkDate(2026, 2, 25);
function dayInfo(day, startDate) {
  const s = startDate || PLAN_START_DATE;
  const date = new Date(s.getFullYear(), s.getMonth(), s.getDate() + (day - 1));
  return { day, dateLabel: `${WEEKDAYS[date.getDay()]} ${date.getDate()} ${MONTHS[date.getMonth()]}` };
}
function totalPhaseDays(phases) {
  return phases.reduce((sum, p) => sum + (p.endDay - p.startDay + 1), 0);
}
function windowDateRangeLabel(windowStart, windowEnd, planStartDate) {
  const s = dayInfo(windowStart, planStartDate);
  const e = dayInfo(windowEnd, planStartDate);
  const sParts = s.dateLabel.split(' ');
  const eParts = e.dateLabel.split(' ');
  if (sParts[2] === eParts[2]) return `${sParts[0]} ${sParts[1]} – ${e.dateLabel}`;
  return `${s.dateLabel} – ${e.dateLabel}`;
}

function exercisesForDay(family, planDay) {
  if (planDay % 4 === 0) return [];
  const pool = EXERCISE_POOL[family];
  if (!pool) return [];
  const i = (planDay - 1) % pool.length;
  const j = (i + 1) % pool.length;
  return [pool[i], pool[j]];
}
function countExercises(family, durationDays) {
  let total = 0;
  for (let d = 1; d <= durationDays; d++) total += exercisesForDay(family, d).length;
  return total;
}
function durationLabelToDays(label) {
  const found = REHAB_DURATION_OPTIONS.find((d) => d.label === label) || TEMPLATE_DURATION_OPTIONS.find((d) => d.label === label);
  return found ? found.days : null;
}

function SaveTemplateModal({ open, onClose, playerName, injuryLabel, phases, milestones, family, durationDays, sourceTemplate, templatesData, setTemplatesData, setSnackbar, onSaved }) {
  const [selectedCard, setSelectedCard] = useState(sourceTemplate ? 'copy' : 'new');

  const [newFamily, setNewFamily] = useState(family);
  const [copyName, setCopyName] = useState(sourceTemplate ? `${sourceTemplate} — ${playerName} variant` : '');
  const [search, setSearch] = useState('');
  const [showAllFamilies, setShowAllFamilies] = useState(false);

  const reset = () => {
    setSelectedCard(sourceTemplate ? 'copy' : 'new');
    setNewName(`${injuryLabel} — ${playerName} variant`);
    setNewFamily(family);
    setCopyName(sourceTemplate ? `${sourceTemplate} — ${playerName} variant` : '');
    setSearch(''); setShowAllFamilies(false); setSelectedTemplateName(null);
  };
  const handleClose = () => { reset(); onClose(); };

  const exerciseCount = countExercises(family, durationDays);
  const selectedTemplate = templatesData.find((t) => t.name === selectedTemplateName) || null;
  const isLockedSelected = Boolean(selectedTemplate && selectedTemplate.locked);
  const diffPhaseName = phases.length > 0 ? phases[0].shortName : 'the plan';

  const filtered = templatesData.filter((t) =>
    (showAllFamilies || t.family === family) && t.name.toLowerCase().includes(search.toLowerCase())
  );
  const cameFromList = sourceTemplate ? filtered.filter((t) => t.name === sourceTemplate) : [];
  const otherList = filtered.filter((t) => t.name !== sourceTemplate);

  const handleSaveAsCopyInstead = () => {
    if (sourceTemplate) {
      setSelectedCard('copy');
      setCopyName(`${selectedTemplate.name} — ${playerName} variant`);
    } else {
      setSelectedCard('new');
      setNewName(`${selectedTemplate.name} — ${playerName} variant`);
    }
  };

  const canConfirm = selectedCard === 'new' ? Boolean(newName.trim())
    : selectedCard === 'copy' ? Boolean(copyName.trim())
    : Boolean(selectedTemplateName) && !isLockedSelected;
  const primaryLabel = selectedCard === 'new' ? 'Create template' : selectedCard === 'copy' ? 'Create copy' : 'Update template';

  const handleConfirm = () => {
    if (selectedCard === 'new') {
      setTemplatesData((prev) => [...prev, { name: newName, phaseNames: phases.map((p) => p.shortName).join(' · '), family: newFamily, duration: `${durationDays} days`, phases: phases.length, milestones: milestones.length, exercises: exerciseCount, used: 0, updated: formatDate(TODAY) }]);
      setSnackbar(`Template created: ${newName}`);
      onSaved(newName);
    } else if (selectedCard === 'copy') {
      setTemplatesData((prev) => [...prev, { name: copyName, phaseNames: phases.map((p) => p.shortName).join(' · '), family, duration: `${durationDays} days`, phases: phases.length, milestones: milestones.length, exercises: exerciseCount, used: 0, updated: formatDate(TODAY) }]);
      setSnackbar(`Template created: ${copyName}`);
      onSaved(copyName);
    } else if (selectedCard === 'update' && selectedTemplate) {
      setTemplatesData((prev) => prev.map((t) => t.name === selectedTemplate.name ? { ...t, phaseNames: phases.map((p) => p.shortName).join(' · '), phases: phases.length, milestones: milestones.length, exercises: exerciseCount, updated: formatDate(TODAY) } : t));
      setSnackbar(`${selectedTemplate.name} updated`);
      onSaved(selectedTemplate.name);

    handleClose();
  };

  const renderTemplateRow = (t) => (

function TimelineStrip({ mode, totalDays, phases, milestones, windowStart, windowEnd, todayDay, isWholePlan, planStartDate, onPhaseClick }) {

  const widthPct = (span) => (span / totalDays) * 100;
  const covered = totalPhaseDays(phases);
  const lastCovered = phases.length ? Math.max(...phases.map((p) => p.endDay)) : 0;
  const unphasedSpan = totalDays - lastCovered;
  const markerDays = phases.map((p) => (milestones.some((m) => m.day >= p.startDay && m.day <= p.endDay) ? p.endDay : null)).filter((d) => d !== null);

        <Box sx={{ fontSize: 12, fontWeight: 600, color: '#172B4D' }}>{isTemplateMode ? `Day ${totalDays} · end of template` : `Day ${totalDays} · Return to play · ${endLabel}`}</Box>

      <Box sx={{ position: 'relative', height: 30 }}>
        <Box sx={{ position: 'absolute', inset: 0, borderRadius: '3px', bgcolor: '#F3F4F7', overflow: 'hidden' }}>

            <>
              {phases.map((ph, i) => (
                <Box key={i} onClick={onPhaseClick ? (e) => onPhaseClick(e, ph, i) : undefined} sx={{ position: 'absolute', left: `${pct(ph.startDay)}%`, width: `${widthPct(ph.endDay - ph.startDay + 1)}%`, top: 0, height: 30, bgcolor: ph.colour || PHASE_COLOURS[i % PHASE_COLOURS.length], display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: onPhaseClick ? 'pointer' : 'default' }}>
                  <Box sx={{ fontSize: 11, color: '#3B4960', whiteSpace: 'nowrap' }}>{ph.shortName}</Box>
                </Box>
              ))}
              {unphasedSpan > 3 && (
                <Box sx={{ position: 'absolute', left: `${pct(lastCovered + 1)}%`, width: `${widthPct(unphasedSpan)}%`, top: 0, height: 30, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <Box sx={{ fontSize: 10, color: '#5F7089', whiteSpace: 'nowrap' }}>Unphased — days {lastCovered + 1} to {totalDays}</Box>
                </Box>

            </>

        </Box>
        {markerDays.map((day) => (
          <Box key={day} sx={{ position: 'absolute', left: `${pct(day) + widthPct(1) / 2}%`, top: -5, width: 9, height: 9, bgcolor: '#ED6C02', transform: 'translateX(-50%) rotate(45deg)' }} />
        ))}
        {todayDay != null && (
          <Box sx={{ position: 'absolute', left: `${pct(todayDay) + widthPct(1) / 2}%`, top: 0, width: 2, height: 30, bgcolor: '#1D2635', transform: 'translateX(-50%)' }} />
        )}

          <Box sx={{ position: 'absolute', left: `${pct(windowStart)}%`, top: -11, fontSize: 9, color: '#1D2635', whiteSpace: 'nowrap' }}>Shown below</Box>

    </Box>
  );

function darkenHex(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, (n >> 16) - amount);
  const g = Math.max(0, ((n >> 8) & 0xff) - amount);
  const b = Math.max(0, (n & 0xff) - amount);
  return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
}

function CalendarGrid({ gridStartDay, gridEndDay, totalDays, phases, milestones, resolveExercises, planStartDate, todayPlanDay, selectedDay, onSelectDay, checkedDays, onToggleCheck, onMilestoneClick }) {
  const anchor = planStartDate || PLAN_START_DATE;
  const dateFor = (day) => new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate() + day - 1);
  const weeks = [];
  for (let d = gridStartDay; d <= gridEndDay; d += 7) weeks.push(Array.from({ length: 7 }, (_, i) => d + i));
  return (
    <Box>
      <Box sx={{ display: 'flex' }}>
        {WEEKDAY_HEADERS.map((wd) => <Box key={wd} sx={{ flex: 1, fontSize: 13, color: '#5F7089', py: 0.5, textAlign: 'center' }}>{wd}</Box>)}
      </Box>
      {weeks.map((week, wi) => (
        <Box key={wi} sx={{ display: 'flex' }}>
          {week.map((day) => {
            const inPlan = day >= 1 && day <= totalDays;
            const phaseIndex = inPlan ? phases.findIndex((p) => day >= p.startDay && day <= p.endDay) : -1;
            const phase = phaseIndex === -1 ? null : phases[phaseIndex];
            return (
              <CalendarDayCell
                key={day} day={day} date={dateFor(day)} inPlan={inPlan} phase={phase}
                showPhaseLabel={Boolean(inPlan && ((phase && day === phase.startDay) || day === week[0]))}
                isToday={todayPlanDay != null && day === todayPlanDay}
                isSelected={day === selectedDay}
                isChecked={checkedDays.has(day)}
                onToggleCheck={() => onToggleCheck(day)}
                dayMilestones={inPlan ? milestones.filter((m) => m.day === day) : []}
                exercises={inPlan ? resolveExercises(day) : []}
                isRtpDay={day === totalDays}
                onSelect={() => onSelectDay(day)}
                onMilestoneClick={onMilestoneClick}
              />
            );
          })}
        </Box>
      ))}
    </Box>
  );
}

function MonthNavRow({ viewMonthDate, onPrevMonth, onNextMonth, totalDays, planStartDate }) {
  const anchor = planStartDate || PLAN_START_DATE;
  const dayForDate = (date) => daysBetween(anchor, date) + 1;
  const monthStart = new Date(viewMonthDate.getFullYear(), viewMonthDate.getMonth(), 1);
  const monthEnd = new Date(viewMonthDate.getFullYear(), viewMonthDate.getMonth() + 1, 0);
  const firstPlanDayInMonth = Math.max(1, dayForDate(monthStart));
  const lastPlanDayInMonth = Math.min(totalDays, dayForDate(monthEnd));
  const hasOverlap = firstPlanDayInMonth <= lastPlanDayInMonth;
  const prevMonthEnd = new Date(monthStart.getFullYear(), monthStart.getMonth(), 0);
  const nextMonthStart = new Date(monthEnd.getFullYear(), monthEnd.getMonth() + 1, 1);
  const canPrev = dayForDate(prevMonthEnd) >= 1;
  const canNext = dayForDate(nextMonthStart) <= totalDays;
  return (
    <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5, mb: 1.5 }}>
      <IconButton size="small" onClick={onPrevMonth} disabled={!canPrev}><Box sx={{ fontSize: 15, lineHeight: 1, color: '#5F7089' }}>‹</Box></IconButton>
      <IconButton size="small" onClick={onNextMonth} disabled={!canNext}><Box sx={{ fontSize: 15, lineHeight: 1, color: '#5F7089' }}>›</Box></IconButton>
      <Box sx={{ fontSize: 15, fontWeight: 600, color: '#172B4D' }}>{MONTHS[viewMonthDate.getMonth()]} {viewMonthDate.getFullYear()}</Box>
      <Box sx={{ fontSize: 11, color: '#5F7089' }}>{hasOverlap ? `Days ${firstPlanDayInMonth} to ${lastPlanDayInMonth} of the plan fall in this month` : 'No plan days fall in this month'}</Box>
    </Box>
  );
}

            {exercises.map((ex, i) => (
              <Box key={i} sx={{ bgcolor: '#fff', border: '1px solid #E8EAED', borderRadius: '4px', p: 1.25, mb: 1 }}>

                  <Box sx={{ fontSize: 13, fontWeight: 600, color: '#172B4D', flex: 1 }}>{ex.name}</Box>
                  <IconButton size="small" onClick={() => onRemoveExercise(i)}><XIcon size={14} /></IconButton>

                <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.75, mt: 0.5 }}>
                  <Box sx={{ width: 15, height: 15, borderRadius: '50%', border: '1px solid #CCD6E0', flexShrink: 0 }} />

                </Box>
              </Box>
            ))}
            <Box sx={{ fontSize: 11, color: '#5F7089', cursor: 'pointer' }} onClick={(e) => setPickerAnchor(e.currentTarget)}>+ Add exercise</Box>

      <Menu anchorEl={pickerAnchor} open={Boolean(pickerAnchor)} onClose={() => setPickerAnchor(null)}>

      <Box sx={{ display: 'flex', flexDirection: 'column', gap: 1, mt: 2, pt: 2, borderTop: '1px solid #E8EAED' }}>
        <Button variant="contained" size="small" disableElevation onClick={onOpenIn5DayView}>Open in 5 day view</Button>
        <Button variant="outlined" size="small" onClick={onClearDay}>Clear day</Button>
      </Box>
    </Box>
  );
}

// ---------- plan editing: helpers ----------
const PHASE_SWATCHES = ['#E4E9F0', '#DCE8E3', '#F0E7DA', '#E9E0EC', '#F5E1E4', '#F5EFDC', '#DCEAEC', '#E7E7E7'];

function weeksAndDaysLabel(totalDays) {
  return `${Math.floor(totalDays / 7)} weeks · ${totalDays} days`;
}
function durationDaysToLabel(days, options) {
  return (options.find((d) => d.days === days) || {}).label || weeksAndDaysLabel(days);
}
function removalCheckboxLabel(counts) {
  const parts = [];
  if (counts.days) parts.push(`${counts.days} day${counts.days === 1 ? '' : 's'}`);
  if (counts.exercises) parts.push(`${counts.exercises} exercise${counts.exercises === 1 ? '' : 's'}`);
  if (counts.milestones) parts.push(`${counts.milestones} milestone${counts.milestones === 1 ? '' : 's'}`);
  if (!parts.length) return 'I understand this change cannot be undone.';
  const joined = parts.length === 1 ? parts[0] : parts.length === 2 ? `${parts[0]} and ${parts[1]}` : `${parts[0]}, ${parts[1]} and ${parts[2]}`;
  return `I understand ${joined} will be removed.`;
}
function buildDayMap(oldTotalDays, removedSet) {
  const map = new Map();
  let newDay = 1;
  for (let d = 1; d <= oldTotalDays; d++) { if (removedSet.has(d)) continue; map.set(d, newDay); newDay += 1; }
  return map;
}
function remapPhasesAfterRemoval(phasesList, removedSet, dayMap) {
  return phasesList.map((p) => {
    const kept = [];
    for (let d = p.startDay; d <= p.endDay; d++) if (!removedSet.has(d)) kept.push(dayMap.get(d));
    if (!kept.length) return null;
    return { ...p, startDay: Math.min(...kept), endDay: Math.max(...kept) };
  }).filter(Boolean);
}
function remapMilestonesAfterRemoval(milestonesList, removedSet, dayMap) {
  return milestonesList.filter((m) => !removedSet.has(m.day)).map((m) => ({ ...m, day: dayMap.get(m.day) }));
}
function remapExerciseOverridesAfterRemoval(getDayExercises, removedSet, dayMap, oldTotalDays) {
  const next = {};
  for (let d = 1; d <= oldTotalDays; d++) { if (removedSet.has(d)) continue; next[dayMap.get(d)] = getDayExercises(d); }
  return next;
}
function extendLastPhase(phasesList, newTotalDays) {
  if (!phasesList.length) return phasesList;
  let lastIdx = 0;
  phasesList.forEach((p, i) => { if (p.endDay > phasesList[lastIdx].endDay) lastIdx = i; });
  return phasesList.map((p, i) => (i === lastIdx ? { ...p, endDay: newTotalDays } : p));
}
function buildAddedDaysOverrides(exerciseOverrides, getDayExercises, oldTotalDays, addCount, fillChoice) {
  const next = { ...exerciseOverrides };
  for (let i = 0; i < addCount; i++) {
    const newDay = oldTotalDays + 1 + i;
    if (fillChoice === 'empty') { next[newDay] = []; continue; }
    const sourceDay = Math.max(1, oldTotalDays - 6 + (i % 7));
    next[newDay] = getDayExercises(sourceDay);
  }
  return next;
}
function shiftExerciseOverridesForInsert(getDayExercises, insertAfterDay, addCount, fillChoice, oldTotalDays) {
  const next = {};
  for (let d = 1; d <= oldTotalDays; d++) {
    const val = getDayExercises(d);
    if (d <= insertAfterDay) next[d] = val;
    else next[d + addCount] = val;
  }
  for (let i = 0; i < addCount; i++) {
    const newDay = insertAfterDay + 1 + i;
    if (fillChoice === 'empty') { next[newDay] = []; continue; }
    const sourceDay = Math.max(1, insertAfterDay - 6 + (i % 7));
    next[newDay] = getDayExercises(sourceDay);
  }
  return next;
}
function resizePhase(phasesList, index, newStartDay, newEndDay) {
  const next = phasesList.map((p) => ({ ...p }));
  const origStartDay = phasesList[index].startDay;
  const origEndDay = phasesList[index].endDay;
  next[index].startDay = newStartDay;
  next[index].endDay = newEndDay;
  if (index > 0 && newStartDay !== origStartDay) {
    const prev = next[index - 1];
    if (next[index].startDay <= prev.startDay) next[index].startDay = prev.startDay + 1;
    prev.endDay = next[index].startDay - 1;
  }
  if (index < next.length - 1 && newEndDay !== origEndDay) {
    const after = next[index + 1];
    if (next[index].endDay >= after.endDay) next[index].endDay = after.endDay - 1;
    after.startDay = next[index].endDay + 1;
  }
  return next.filter((p) => p.startDay <= p.endDay);
}
function assignDaysToPhase(phasesList, dayMin, dayMax, targetIndex) {
  const next = phasesList.map((p) => ({ ...p }));
  next[targetIndex].startDay = Math.min(next[targetIndex].startDay, dayMin);
  next[targetIndex].endDay = Math.max(next[targetIndex].endDay, dayMax);
  return next.map((p, i) => {
    if (i === targetIndex) return p;
    let { startDay, endDay } = p;
    if (startDay >= dayMin && startDay <= dayMax) startDay = dayMax + 1;
    if (endDay >= dayMin && endDay <= dayMax) endDay = dayMin - 1;
    return { ...p, startDay, endDay };
  }).filter((p) => p.startDay <= p.endDay);
}

// ---------- plan editing: mini timeline for ConfirmPlanChange ----------
function MiniTimelineStrip({ phases, stripTotalDays, addedRange, removedRange, oldRtpDay, newRtpDay }) {
  const pct = (day) => ((day - 1) / stripTotalDays) * 100;
  const widthPct = (span) => (span / stripTotalDays) * 100;
  return (
    <Box>
      <Box sx={{ position: 'relative', height: 24, borderRadius: '3px', bgcolor: '#F3F4F7', overflow: 'hidden' }}>
        {phases.map((ph, i) => (
          <Box key={i} sx={{ position: 'absolute', left: `${pct(ph.startDay)}%`, width: `${widthPct(ph.endDay - ph.startDay + 1)}%`, top: 0, height: 24, bgcolor: ph.colour || PHASE_COLOURS[i % PHASE_COLOURS.length] }} />
        ))}
        {addedRange && (
          <Box sx={{ position: 'absolute', left: `${pct(addedRange.start)}%`, width: `${widthPct(addedRange.end - addedRange.start + 1)}%`, top: 0, height: 24, border: '2px dashed #1D2635', boxSizing: 'border-box' }} />
        )}
        {removedRange && (
          <Box sx={{ position: 'absolute', left: `${pct(removedRange.start)}%`, width: `${widthPct(removedRange.end - removedRange.start + 1)}%`, top: 0, height: 24, bgcolor: '#D32F2F', opacity: 0.35, border: '1px solid #D32F2F', boxSizing: 'border-box' }} />
        )}
        {oldRtpDay != null && (
          <Box sx={{ position: 'absolute', left: `${pct(oldRtpDay)}%`, top: 7, width: 10, height: 10, borderRadius: '50%', border: '2px solid #5F7089', bgcolor: '#fff', transform: 'translateX(-50%)', zIndex: 2 }} />
        )}
        {newRtpDay != null && (
          <Box sx={{ position: 'absolute', left: `${pct(newRtpDay)}%`, top: 7, width: 10, height: 10, borderRadius: '50%', bgcolor: '#1D2635', transform: 'translateX(-50%)', zIndex: 2 }} />
        )}
      </Box>
      <Box sx={{ fontSize: 10, color: '#5F7089', mt: 0.75 }}>
        ○ Old return to play · ● New return to play{addedRange ? ' · ┅ Added days' : ''}{removedRange ? ' · ▨ Removed days' : ''}
      </Box>
    </Box>
  );
}

// ---------- plan editing: shared confirmation dialog ----------
function ConfirmPlanChange({ open, onClose, change }) {
  const [reason, setReason] = useState('');
  const [fillChoice, setFillChoice] = useState('repeat');
  const [phaseAssignChoice, setPhaseAssignChoice] = useState('extend');
  const [checked, setChecked] = useState(false);
  const [restChoice, setRestChoice] = useState('shift');

  useEffect(() => {
    if (open) { setReason(''); setFillChoice('repeat'); setPhaseAssignChoice('extend'); setChecked(false); setRestChoice('shift'); }
  }, [open]);

  if (!change) return null;
  const rp = change.restOfPlan;
  const variant = rp && rp.mode === 'choice' ? (restChoice === 'absorb' ? rp.absorb : rp.shift) : null;
  const effective = variant || change;
  const {
    playerName, injuryLabel, summaryLine, actionLabel, currentRtpDate, newRtpDate, newDurationDays,
    phases, stripTotalDays, addedRange, removedRange, oldRtpDay, newRtpDay, affects,
    needsFillChoice, needsPhaseAssignChoice, lastPhaseName, requiresRemovalCheckbox, removalCounts,
  } = effective;
  const { onConfirm } = change;
  const isAbsorbing = restChoice === 'absorb' && rp && rp.mode === 'choice';

  const rtpDeltaDays = daysBetween(currentRtpDate, newRtpDate);
  const later = rtpDeltaDays >= 0;
  const canConfirm = reason.trim().length > 0 && (!requiresRemovalCheckbox || checked);
  const handleConfirm = () => onConfirm({ reason, fillChoice, phaseAssignChoice, restChoice });

  return (
    <Dialog open={open} onClose={onClose} PaperProps={{ sx: { width: 600, maxWidth: 600 } }}>
      <Box sx={{ px: 3, pt: 3 }}>
        <Box sx={{ fontSize: 17, fontWeight: 600, color: '#172B4D' }}>Confirm plan change</Box>
        <Box sx={{ fontSize: 11, color: '#5F7089', mt: 0.5 }}>{playerName} · {injuryLabel}</Box>
      </Box>
      <Box sx={{ px: 3, py: 2.5, display: 'flex', flexDirection: 'column', gap: 2.5, maxHeight: '70vh', overflowY: 'auto' }}>
        <Box sx={{ bgcolor: '#F3F4F7', borderRadius: 1, p: 1.5, fontSize: 12, color: '#3B4960' }}>{summaryLine}</Box>

        {rp && (
          <Box>
            <Box sx={{ fontSize: 12, fontWeight: 600, color: '#172B4D', mb: 0.75 }}>What happens to the rest of the plan</Box>
            {rp.mode === 'lastPhaseNote' ? (
              <Box sx={{ fontSize: 12, color: '#3B4960' }}>{rp.noteText}</Box>
            ) : (
              <Box sx={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
                <Box onClick={() => setRestChoice('shift')} sx={{ display: 'flex', alignItems: 'flex-start', gap: 1, cursor: 'pointer' }}>
                  <RadioDot selected={restChoice === 'shift'} />
                  <Box>
                    <Box sx={{ fontSize: 12, color: '#3B4960' }}>Shift the later phases</Box>
                    <Box sx={{ fontSize: 11, color: '#5F7089', mt: 0.25 }}>{rp.shiftSub}</Box>
                  </Box>
                </Box>
                {rp.canAbsorb && (
                  <Box onClick={() => setRestChoice('absorb')} sx={{ display: 'flex', alignItems: 'flex-start', gap: 1, cursor: 'pointer' }}>
                    <RadioDot selected={restChoice === 'absorb'} />
                    <Box>
                      <Box sx={{ fontSize: 12, color: '#3B4960' }}>Absorb it into {rp.nextPhaseName}</Box>
                      <Box sx={{ fontSize: 11, color: '#5F7089', mt: 0.25 }}>{rp.absorbSub}</Box>
                    </Box>
                  </Box>
                )}
              </Box>
            )}
          </Box>
        )}

        {isAbsorbing ? (
          <Box sx={{ bgcolor: '#F3F4F7', borderRadius: 1, p: 1.5, fontSize: 12, color: '#3B4960' }}>Return to play stays {formatDate(newRtpDate)}.</Box>
        ) : (
          <Box>
            <Box sx={{ display: 'flex', alignItems: 'center' }}>
              <Box sx={{ flex: 1 }}>
                <Box sx={{ fontSize: 11, color: '#5F7089' }}>Current return to play</Box>
                <Box sx={{ fontSize: 16, fontWeight: 600, color: '#172B4D', mt: 0.25 }}>{formatDateWithWeekday(currentRtpDate)}</Box>
              </Box>
              <Box sx={{ fontSize: 18, color: '#5F7089', px: 2 }}>→</Box>
              <Box sx={{ flex: 1, textAlign: 'right' }}>
                <Box sx={{ fontSize: 11, color: '#5F7089' }}>New return to play</Box>
                <Box sx={{ fontSize: 16, fontWeight: 600, color: later ? '#ED6C02' : '#1D2635', mt: 0.25 }}>{formatDateWithWeekday(newRtpDate)}</Box>
              </Box>
            </Box>
            <Box sx={{ fontSize: 11, color: '#5F7089', mt: 1 }}>{Math.abs(rtpDeltaDays)} day{Math.abs(rtpDeltaDays) === 1 ? '' : 's'} {later ? 'later' : 'earlier'}</Box>
            <Box sx={{ fontSize: 11, color: '#5F7089' }}>Duration becomes {weeksAndDaysLabel(newDurationDays)}</Box>
          </Box>
        )}

        <MiniTimelineStrip phases={phases} stripTotalDays={stripTotalDays} addedRange={addedRange} removedRange={removedRange} oldRtpDay={oldRtpDay} newRtpDay={newRtpDay} />

        {(affects.losses.length > 0 || affects.changes.length > 0 || affects.reassurances.length > 0) && (
          <Box>
            <Box sx={{ fontSize: 12, fontWeight: 600, color: '#172B4D', mb: 0.75 }}>What this affects</Box>
            <Box sx={{ display: 'flex', flexDirection: 'column', gap: 0.5 }}>
              {affects.losses.map((l, i) => <Box key={'l' + i} sx={{ fontSize: 12, color: '#D32F2F' }}>− {l}</Box>)}
              {affects.changes.map((c, i) => <Box key={'c' + i} sx={{ fontSize: 12, color: '#3B4960' }}>~ {c}</Box>)}
              {affects.reassurances.map((r, i) => <Box key={'r' + i} sx={{ fontSize: 12, color: '#5F7089' }}>· {r}</Box>)}

            <Box sx={{ fontSize: 12, fontWeight: 600, color: '#172B4D', mb: 0.75 }}>Fill the added days</Box>

              </Box>
              <Box onClick={() => setFillChoice('empty')} sx={{ display: 'flex', alignItems: 'center', gap: 1, cursor: 'pointer' }}>
                <RadioDot selected={fillChoice === 'empty'} /><Box sx={{ fontSize: 12, color: '#3B4960' }}>Leave them empty</Box>
              </Box>
            </Box>
          </Box>
        )}

        {needsPhaseAssignChoice && (
          <Box>
            <Box sx={{ fontSize: 12, fontWeight: 600, color: '#172B4D', mb: 0.75 }}>The added days belong to</Box>
            <Box sx={{ display: 'flex', flexDirection: 'column', gap: 0.75 }}>
              <Box onClick={() => setPhaseAssignChoice('extend')} sx={{ display: 'flex', alignItems: 'center', gap: 1, cursor: 'pointer' }}>
                <RadioDot selected={phaseAssignChoice === 'extend'} /><Box sx={{ fontSize: 12, color: '#3B4960' }}>{lastPhaseName}, extended</Box>
              </Box>
              <Box onClick={() => setPhaseAssignChoice('none')} sx={{ display: 'flex', alignItems: 'center', gap: 1, cursor: 'pointer' }}>
                <RadioDot selected={phaseAssignChoice === 'none'} /><Box sx={{ fontSize: 12, color: '#3B4960' }}>No phase</Box>
              </Box>
            </Box>
          </Box>
        )}

        <Box>
          <TextField variant="filled" size="small" label="Reason" value={reason} onChange={(e) => setReason(e.target.value)} multiline minRows={2} fullWidth />
          <Box sx={{ fontSize: 11, color: '#5F7089', mt: 0.5 }}>This is a medical record, so a change to the return to play date needs a rationale.</Box>
        </Box>

        {requiresRemovalCheckbox && (
          <FormControlLabel
            control={<Checkbox checked={checked} onChange={(e) => setChecked(e.target.checked)} />}
            label={removalCheckboxLabel(removalCounts)}
            sx={{ alignItems: 'flex-start', mt: -0.5, '& .MuiFormControlLabel-label': { fontSize: 12, color: '#3B4960', mt: 0.3 } }}
          />
        )}
      </Box>
      <Box sx={{ display: 'flex', justifyContent: 'space-between', px: 3, py: 2, borderTop: '1px solid #E8EAED' }}>
        <Button variant="outlined" size="small" onClick={onClose}>Cancel</Button>
        <Button variant="contained" size="small" disableElevation disabled={!canConfirm} onClick={handleConfirm}>{actionLabel}</Button>
      </Box>
    </Dialog>
  );
}

// ---------- plan editing: phase popover (entry point B) ----------
function PhasePopover({ anchorEl, onClose, phase, phaseIndex, phases, totalDays, planStartDate, onSaveImmediate, onExtendPastEnd, onRemove, onRequestDurationChange }) {
  const [name, setName] = useState('');
  const [colour, setColour] = useState('');
  const [startDay, setStartDay] = useState(1);
  const [durationLabel, setDurationLabel] = useState(PHASE_DURATION_OPTIONS[0].label);
  const [initialDurationLabel, setInitialDurationLabel] = useState(PHASE_DURATION_OPTIONS[0].label);

  useEffect(() => {
    if (phase) {
      setName(phase.name);
      setColour(phase.colour);
      setStartDay(phase.startDay);
      const span = phase.endDay - phase.startDay + 1;
      const match = PHASE_DURATION_OPTIONS.find((d) => d.days === span);
      const label = match ? match.label : `${span} days (current)`;
      setDurationLabel(label);
      setInitialDurationLabel(label);
    }
  }, [phase]);

  if (!phase) return null;
  const currentSpan = phase.endDay - phase.startDay + 1;
  const durationSelectOptions = PHASE_DURATION_OPTIONS.some((d) => d.days === currentSpan)
    ? PHASE_DURATION_OPTIONS
    : [...PHASE_DURATION_OPTIONS, { label: `${currentSpan} days (current)`, days: currentSpan }].sort((a, b) => a.days - b.days);
  const durationDays = (durationSelectOptions.find((d) => d.label === durationLabel) || durationSelectOptions[0]).days;
  const endDay = startDay + durationDays - 1;
  const isLastPhase = phaseIndex === phases.length - 1;
  const dateLabel = dayInfo(endDay, planStartDate).dateLabel;

  const handleSave = () => {
    const durationChanged = durationLabel !== initialDurationLabel;
    if (durationChanged) {
      onRequestDurationChange({ name, colour, startDay, endDay, durationDays });
    } else {
      const base = { ...phase, name, shortName: name, colour };
      if (isLastPhase && endDay > totalDays) onExtendPastEnd({ ...base, startDay, endDay });
      else onSaveImmediate({ ...base, startDay, endDay: Math.min(endDay, totalDays) });
    }
    onClose();
  };

  return (
    <Popover open={Boolean(anchorEl)} anchorEl={anchorEl} onClose={onClose} anchorOrigin={{ vertical: 'bottom', horizontal: 'left' }} PaperProps={{ sx: { maxHeight: 'calc(100vh - 24px)', overflowY: 'auto' } }}>
      <Box sx={{ width: 260, p: 2 }}>
        <Box sx={{ fontSize: 12, fontWeight: 600, color: '#172B4D', mb: 1.5 }}>Phase</Box>
        <TextField variant="filled" size="small" label="Name" value={name} onChange={(e) => setName(e.target.value)} fullWidth sx={{ mb: 1.5 }} />
        <Box sx={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 1, mb: 1.5 }}>
          {PHASE_SWATCHES.map((c) => (
            <Box key={c} onClick={() => setColour(c)} sx={{ width: '100%', height: 24, borderRadius: '4px', bgcolor: c, cursor: 'pointer', border: colour === c ? '2px solid #1D2635' : '1px solid #E8EAED' }} />
          ))}
        </Box>
        <Box sx={{ display: 'flex', gap: 1, mb: 1.5 }}>
          <TextField variant="filled" size="small" label="Starts on day" type="number" value={startDay} onChange={(e) => setStartDay(Math.max(1, Number(e.target.value) || 1))} sx={{ flex: 1 }} />
          <TextField variant="filled" size="small" select label="Duration" value={durationLabel} onChange={(e) => setDurationLabel(e.target.value)} sx={{ flex: 1 }}>

        <Box sx={{ fontSize: 11, color: '#5F7089', mb: 1.5 }}>Changing this phase moves the boundary with the phase beside it. Exercises stay on their days.</Box>
        <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <Button variant="text" size="small" onClick={() => { onRemove(); onClose(); }} sx={{ color: '#D32F2F' }}>Remove phase</Button>
          <Button variant="contained" size="small" disableElevation onClick={handleSave}>Save</Button>
        </Box>
      </Box>
    </Popover>
  );
}

// ---------- plan editing: milestone popover (entry point D) ----------
function MilestonePopover({ anchorEl, onClose, milestone, phases, totalDays, planStartDate, onSaveImmediate, onExtendPastEnd, onRemove }) {
  const [text, setText] = useState('');
  const [day, setDay] = useState(1);

  useEffect(() => {
    if (milestone) { setText(milestone.text); setDay(milestone.day); }
  }, [milestone]);

  if (!milestone) return null;
  const clampedDay = Math.max(1, day);
  const withinPlan = clampedDay <= totalDays;
  const phaseHere = phases.find((p) => clampedDay >= p.startDay && clampedDay <= p.endDay);
  const dateLabel = dayInfo(clampedDay, planStartDate).dateLabel;

  const handleSave = () => {
    const updated = { ...milestone, text, day: clampedDay };
    if (!withinPlan) onExtendPastEnd(updated);
    else onSaveImmediate(updated);
    onClose();
  };

  return (
    <Popover open={Boolean(anchorEl)} anchorEl={anchorEl} onClose={onClose} anchorOrigin={{ vertical: 'bottom', horizontal: 'left' }} PaperProps={{ sx: { maxHeight: 'calc(100vh - 24px)', overflowY: 'auto' } }}>
      <Box sx={{ width: 280, p: 2 }}>
        <Box sx={{ fontSize: 12, fontWeight: 600, color: '#172B4D', mb: 1.5 }}>Milestone</Box>
        <TextField variant="filled" size="small" label="Milestone" value={text} onChange={(e) => setText(e.target.value)} multiline minRows={2} fullWidth sx={{ mb: 1.5 }} />
        <TextField variant="filled" size="small" label="Day" type="number" value={day} onChange={(e) => setDay(Number(e.target.value) || 1)} fullWidth sx={{ mb: 1 }} />
        <Box sx={{ fontSize: 11, color: '#5F7089', mb: 1.5 }}>{dateLabel}{withinPlan ? ` · ${phaseHere ? phaseHere.shortName : 'No phase'}` : ' · Past the current plan end'}</Box>
        <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <Button variant="text" size="small" onClick={() => { onRemove(); onClose(); }} sx={{ color: '#D32F2F' }}>Remove</Button>
          <Button variant="contained" size="small" disableElevation onClick={handleSave}>Save</Button>
        </Box>
      </Box>
    </Popover>
  );
}

function WholePlanCalendar({ phases, milestones, totalDays, planStartDate, todayPlanDay, selectedDay, checkedDays, onCellClick }) {
  const anchor = planStartDate || PLAN_START_DATE;
  const planEnd = addDays(anchor, totalDays - 1);
  const months = [];
  let cursor = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const endCursor = new Date(planEnd.getFullYear(), planEnd.getMonth(), 1);
  while (cursor <= endCursor) { months.push({ year: cursor.getFullYear(), month: cursor.getMonth() }); cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1); }
  const useWeekCells = totalDays > 120;
  const dayForDate = (date) => daysBetween(anchor, date) + 1;
  const mondaySnapLocal = (day) => {
    const d = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate() + day - 1);
    return day - ((d.getDay() + 6) % 7);
  };
  const phaseFor = (day) => phases.find((p) => day >= p.startDay && day <= p.endDay) || null;
  const hasMilestoneOn = (a, b) => milestones.some((m) => m.day >= a && m.day <= b);
  const gridTemplate = '44px repeat(31, 24px)';

  return (
    <Box sx={{ display: 'inline-block' }}>
      <Box sx={{ display: 'grid', gridTemplateColumns: gridTemplate, gap: '3px', mb: 1 }}>
        <Box />
        {[5, 10, 15, 20, 25, 30].map((d) => (
          <Box key={d} sx={{ gridColumn: d + 1, fontSize: 8, color: '#5F7089', textAlign: 'center' }}>{d}</Box>
        ))}
      </Box>
      {months.map(({ year, month }, mi) => {
        const monthLabel = MONTHS[month].slice(0, 3);
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const cells = [];
        if (!useWeekCells) {
          for (let dom = 1; dom <= daysInMonth; dom++) {
            const day = dayForDate(new Date(year, month, dom));
            const inPlan = day >= 1 && day <= totalDays;
            const phase = inPlan ? phaseFor(day) : null;
            cells.push(
              <Box key={dom} sx={{ gridColumn: dom + 1 }}>
                <WholePlanCell
                  label={dom} inPlan={inPlan} phase={phase}
                  isToday={inPlan && todayPlanDay === day} isSelected={inPlan && selectedDay === day}
                  isChecked={inPlan && checkedDays.has(day)} isRtpDay={inPlan && day === totalDays}
                  hasMilestone={inPlan && hasMilestoneOn(day, day)}
                  onClick={(e) => onCellClick(day, e)}
                />
              </Box>
            );
          }
        } else {
          let dom = 1;
          while (dom <= daysInMonth) {
            const day = dayForDate(new Date(year, month, dom));
            const weekStartDay = mondaySnapLocal(day);
            const weekEndDay = weekStartDay + 6;
            const spanEndDom = Math.min(daysInMonth, dom + (weekEndDay - day));
            const span = spanEndDom - dom + 1;
            const rangeStart = Math.max(1, weekStartDay);
            const rangeEnd = Math.min(totalDays, weekEndDay);
            const inPlan = rangeStart <= rangeEnd;
            const midDay = inPlan ? Math.floor((rangeStart + rangeEnd) / 2) : dayForDate(new Date(year, month, dom));
            const phase = inPlan ? phaseFor(midDay) : null;
            const weekNumber = Math.max(1, Math.ceil(weekStartDay / 7));
            cells.push(
              <Box key={dom} sx={{ gridColumn: `${dom + 1} / span ${span}` }}>
                <WholePlanCell
                  label={`W${weekNumber}`} span={span} inPlan={inPlan} phase={phase}
                  isToday={inPlan && todayPlanDay != null && todayPlanDay >= rangeStart && todayPlanDay <= rangeEnd}
                  isSelected={inPlan && selectedDay != null && selectedDay >= rangeStart && selectedDay <= rangeEnd}
                  isChecked={inPlan && Array.from({ length: rangeEnd - rangeStart + 1 }, (_, i) => rangeStart + i).some((d) => checkedDays.has(d))}
                  isRtpDay={inPlan && totalDays >= rangeStart && totalDays <= rangeEnd}
                  hasMilestone={inPlan && hasMilestoneOn(rangeStart, rangeEnd)}
                  onClick={(e) => onCellClick(midDay, e)}
                />
              </Box>
            );
            dom = spanEndDom + 1;
          }
        }
        return (
          <Box key={mi} sx={{ display: 'grid', gridTemplateColumns: gridTemplate, gap: '3px', mb: '3px', alignItems: 'center' }}>
            <Box sx={{ fontSize: 11, fontWeight: 600, color: '#172B4D' }}>{monthLabel}</Box>
            {cells}
          </Box>
        );
      })}
      {milestones.length > 0 && (
        <Box sx={{ display: 'flex', flexDirection: 'column', gap: 0.75, mt: 1.5, pt: 1.5, borderTop: '1px solid #E8EAED' }}>
          {[...milestones].sort((a, b) => a.day - b.day).map((m, i) => (
            <Box key={i} onClick={(e) => onCellClick(m.day, e)} sx={{ display: 'flex', alignItems: 'center', gap: 0.75, cursor: 'pointer' }}>
              <Box sx={{ width: 8, height: 8, bgcolor: '#ED6C02', transform: 'rotate(45deg)', flexShrink: 0 }} />
              <Box sx={{ fontSize: 11, color: '#3B4960' }}>{m.text}</Box>
              <Box sx={{ fontSize: 10, color: '#5F7089' }}>Day {m.day} · {dayInfo(m.day, planStartDate).dateLabel}</Box>
            </Box>
          ))}
        </Box>
      )}
      <WholePlanLegend todayPlanDay={todayPlanDay} />
    </Box>
  );
}

            }}>
