        <Box sx={{ width: 60, background: 'var(--nav-gradient)', color: '#fff', display: 'flex', flexDirection: 'column', alignItems: 'center', pt: 2, gap: 0.5, flexShrink: 0 }}>
          <Box title="NFL" sx={{ display: 'flex', alignItems: 'center', justifyContent: 'center', mb: 2 }}>
            <NflLogo size={30} />
          </Box>
          {items.map((it) => {
            const active = it.key === 'roster';
            return (
              <Box key={it.key} onClick={() => active && go('roster')} title={it.label}
                sx={{ width: '100%', height: 48, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: active ? 'pointer' : 'default',
                  position: 'relative', bgcolor: active ? 'rgba(255,255,255,0.1)' : 'transparent',
                  borderLeft: active ? '6px solid #fff' : '6px solid transparent' }}>
                <Svg path={it.icon} size={20} color="#fff" style={{ marginRight: active ? 6 : 0 }} />
              </Box>
            );
          })}
        </Box>
      );
    };

    /* ---------- Screen 1: Roster ---------- */
    const RosterScreen = ({ go, pendingCount, tab, setTab, pendingBody }) => {
      const [search, setSearch] = useState('');
      const tabs = ['Roster', 'Notes', 'Diagnostics', 'Procedures', 'Medical Flags', 'Documents', 'Coaches Report', `Record Approvals (${pendingCount})`];
      const pendingIdx = tabs.length - 1;
      const rows = ROSTER.filter((r) => r.name.toLowerCase().includes(search.toLowerCase()));
      const positions = [];
      Object.values(ROSTER_MEDICAL).forEach((m) => { if (!positions.includes(m.nflPos)) positions.push(m.nflPos); });
      positions.sort();
      return (
        <Box>
          <Box sx={{ bgcolor: '#fff', borderBottom: '1px solid var(--border)', px: 3, pt: 1.5 }}>
            <Box sx={{ display: 'flex', alignItems: 'center', mb: 1.5 }}>
              <Typography sx={{ fontSize: 12, fontWeight: 600, color: 'var(--text-secondary)' }}>Medical</Typography>
              <Box sx={{ flex: 1 }} />
              <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5 }}>
                <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.5, cursor: 'pointer' }}>
                  <Typography sx={{ fontSize: 13, fontWeight: 600, color: 'var(--text-primary)' }}>Active Roster</Typography>
                  <Svg path={P.expand} size={18} color="#5b6472" />
                </Box>
                <Avatar sx={{ width: 32, height: 32, bgcolor: 'var(--nav-dark)', fontSize: 12, fontWeight: 600 }}>LV</Avatar>
              </Box>
            </Box>
            <Typography variant="h5" sx={{ mb: '38px' }}>Medical</Typography>
            <Tabs value={tab} variant="scrollable" scrollButtons={false}
              onChange={(e, v) => { if (v === 0 || v === pendingIdx) setTab(v); }}>
              {tabs.map((t) => <Tab key={t} label={t} />)}
            </Tabs>
          </Box>

          {tab === pendingIdx ? pendingBody : (
          <Box sx={{ p: 3, bgcolor: '#fff', minHeight: '100%' }}>
            <Box sx={{ display: 'flex', alignItems: 'center', mb: 2 }}>
              <Typography sx={{ fontSize: 18, fontWeight: 600 }}>Roster</Typography>
              <Box sx={{ flex: 1 }} />
              <Box sx={{ display: 'flex', gap: 1.5 }}>
                <Button endIcon={<Svg path={P.expand} size={16} color="#fff" />}
                  sx={{ bgcolor: 'var(--nav-dark)', color: '#fff', '&:hover': { bgcolor: '#0f1c33' } }}>Add</Button>
                <Button endIcon={<Svg path={P.expand} size={16} color="#5b6472" />}
                  sx={{ bgcolor: 'var(--grey-fill)', color: 'var(--text-primary)', '&:hover': { bgcolor: '#e6e8ee' } }}>Download</Button>
              </Box>
            </Box>

            <Box sx={{ display: 'flex', gap: 2, mb: 2, flexWrap: 'wrap' }}>
              <TextField placeholder="Search players" value={search} onChange={(e) => setSearch(e.target.value)} hiddenLabel sx={{ width: 260 }}
                InputProps={{ endAdornment: <InputAdornment position="end"><Svg path={P.search} size={18} color="#8a93a1" /></InputAdornment> }} />
              <FormControl variant="filled" size="small" hiddenLabel sx={{ minWidth: 170 }}>
                <Select value="active">
                  <MenuItem value="active">Active Roster</MenuItem>
                  <MenuItem value="practice">Practice squad</MenuItem>
                  <MenuItem value="ir">Injured reserve</MenuItem>
                </Select>
              </FormControl>
              <FormControl variant="filled" size="small" hiddenLabel sx={{ minWidth: 190 }}>
                <Select value="all" displayEmpty renderValue={(v) => v === 'all' ? 'Roster position' : v}>
                  <MenuItem value="all">All positions</MenuItem>
                  {positions.map((p) => <MenuItem key={p} value={p}>{p}</MenuItem>)}
                </Select>
              </FormControl>
              <FormControl variant="filled" size="small" hiddenLabel sx={{ minWidth: 150 }}>
                <Select value="all" displayEmpty renderValue={(v) => v === 'all' ? 'Injured' : v}>
                  <MenuItem value="all">All</MenuItem>
                  <MenuItem value="Out">Out</MenuItem>
                  <MenuItem value="Limited">Limited</MenuItem>
                </Select>
              </FormControl>
            </Box>

            <Paper elevation={0} sx={{ border: '1px solid var(--border)', borderRadius: '8px', overflow: 'hidden' }}>
              <Table size="small" sx={{ '& .MuiTableCell-head': { textTransform: 'none' } }}>
                <TableHead>
                  <TableRow>
                    <TableCell>Player</TableCell>
                    <TableCell>Status</TableCell>
                    <TableCell>Injury</TableCell>
                    <TableCell>Latest note</TableCell>
                    <TableCell>Allergies</TableCell>
                  </TableRow>
                </TableHead>
                <TableBody>
                  {rows.map((r, idx) => {
                    const m = ROSTER_MEDICAL[r.id];
                    const photoId = [12, 15, 33, 45, 51, 60, 68, 5, 22, 7, 41][idx % 11];
                    return (
                    <TableRow key={r.id} hover sx={{ verticalAlign: 'top' }}>
                      <TableCell sx={{ py: 1.5 }}>
                        <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.25 }}>
                          <Avatar src={`https://i.pravatar.cc/80?img=${photoId}`} alt={r.name} sx={{ width: 32, height: 32 }} />
                          <Box>
                            <Link component="button" onClick={() => go('player', r.id)}
                              sx={{ color: 'var(--text-primary)', fontWeight: 400, fontSize: 14, letterSpacing: '0.17px', textDecoration: 'none', display: 'block', textAlign: 'left', '&:hover': { textDecoration: 'underline' } }}>
                              {r.name}
                            </Link>
                            <Typography sx={{ fontSize: 12, color: 'var(--text-secondary)' }}>{m.nflPos}</Typography>
                          </Box>
                        </Box>
                      </TableCell>
                      <TableCell sx={{ py: 1.5 }}>
                        <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                          <Badge variant="dot" color={m.status === 'Out' ? 'error' : 'warning'}
                            sx={{ '& .MuiBadge-badge': { position: 'static', transform: 'none' } }} />
                          <Typography sx={{ fontSize: 13 }}>{m.status}</Typography>
                        </Box>
                        <Typography sx={{ fontSize: 12, color: 'var(--text-secondary)', ml: '16px' }}>{m.days} days</Typography>
                      </TableCell>
                      <TableCell sx={{ py: 1.5 }}>
                        {m.injuries.map((inj, i) => (
                          <Box key={i} sx={{ mb: i < m.injuries.length - 1 ? 1 : 0 }}>
                            <Typography sx={{ fontSize: 13 }}>{inj.date}, {inj.name}</Typography>
                            <Typography sx={{ fontSize: 12, color: 'var(--text-secondary)' }}>Unavailable, time loss</Typography>
                          </Box>
                        ))}
                      </TableCell>
                      <TableCell sx={{ py: 1.5, fontSize: 13, maxWidth: 300 }}>{m.note}</TableCell>
                      <TableCell sx={{ py: 1.5 }}>
                        <Box sx={{ display: 'flex', flexWrap: 'wrap', gap: 0.5 }}>
                          {m.allergies.length
                            ? m.allergies.map((a, i) => {
                                const palette = [
                                  { bg: '#fdecea', color: '#b3261e' },
                                  { bg: '#fff1e0', color: '#b25e00' },
                                  { bg: '#fff8dc', color: '#8a6d00' },
                                ][i % 3];
                                return <Chip key={a} label={a} sx={{ bgcolor: palette.bg, color: palette.color, fontSize: 12, fontWeight: 400 }} />;
                              })
                            : <Typography sx={{ fontSize: 13, color: 'var(--text-secondary)' }}>—</Typography>}
                        </Box>
                      </TableCell>
                    </TableRow>
                    );
                  })}
                </TableBody>
              </Table>
            </Paper>
          </Box>
          )}
        </Box>
      );
    };

    /* ---------- Screen 2: Record Approvals ---------- */
    const FIELD_GRID = '36px 168px 260px 260px minmax(200px, 1fr)';
    const HDR = { fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', color: 'var(--text-secondary)' };

    const FieldHeaderRow = () => (
      <Box sx={{ display: 'grid', gridTemplateColumns: FIELD_GRID, alignItems: 'center', columnGap: 1.5, px: 2, py: 0.75, borderBottom: '1px solid var(--border)', bgcolor: '#fbfbfc' }}>
        <Box />
        <Typography sx={HDR}>Form Input</Typography>
        <Typography sx={HDR}>Current</Typography>
        <Typography sx={HDR}>Form Answer</Typography>
        <Typography sx={{ ...HDR, textAlign: 'right' }}>Actions</Typography>
      </Box>
    );

    const FieldRow = ({ f, checked, onToggle, onApprove, onReject }) => {
      const approved = f.status === 'approved';
      const rejected = f.status === 'rejected';
      const existingValue = f.current || (f.duplicate ? `${f.duplicate.matchTitle} · ${f.duplicate.matchDate}` : null);
      const hasConflict = !!existingValue;
      return (
        <Box sx={{
          display: 'grid',
          gridTemplateColumns: FIELD_GRID,
          alignItems: 'center',
          columnGap: 1.5,
          px: 2, py: 1,
          borderBottom: '1px solid var(--border)',
          bgcolor: approved ? 'var(--success-bg)' : rejected ? '#fbfbfc' : '#fff',
          transition: 'background .25s',
        }}>
          <Checkbox size="small" checked={checked} disabled={f.status !== 'pending'} onChange={onToggle} sx={{ p: 0.5 }} />

          <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.75, minWidth: 0 }}>
            <Typography sx={{ fontWeight: 600, fontSize: 13.5 }}>{f.label}</Typography>
            {approved && <Svg path={P.checkCircle} size={15} color="#2e7d4f" />}
            {rejected && <Typography sx={{ fontSize: 11.5, fontWeight: 600, color: 'var(--error)' }}>Rejected</Typography>}
          </Box>

          <Box sx={{ minWidth: 0 }}>
            {hasConflict ? (
              <Typography sx={{ fontSize: 12.5 }}>{existingValue}</Typography>
            ) : (
              <Typography sx={{ fontSize: 12, color: '#8a93a1', fontStyle: 'italic' }}>No value on record</Typography>
            )}
          </Box>

          <Box sx={{ minWidth: 0 }}>
            <Typography sx={{ fontSize: 12.5 }}>{f.incoming}</Typography>
          </Box>

          <Box sx={{ display: 'flex', alignItems: 'center', gap: 1, justifyContent: 'flex-end' }}>
            {f.status === 'pending' && (
              <React.Fragment>
                <Button onClick={onApprove} sx={{ bgcolor: '#005293', fontSize: 12, whiteSpace: 'nowrap' }}>{hasConflict ? 'Override' : 'Add to record'}</Button>
                <Button onClick={onReject} sx={{ bgcolor: 'transparent', color: 'var(--error)', border: '1px solid var(--error)', fontSize: 12, '&:hover': { bgcolor: '#fdeceb' } }}>Reject</Button>
              </React.Fragment>
            )}
          </Box>
        </Box>
      );
    };

    const PendingScreen = ({ fields, selected, setSelected, approveFields, rejectFields, openConfirm }) => {
      const [filter, setFilter] = useState('Pending');
      const [fieldFilter, setFieldFilter] = useState([]);
      const [search, setSearch] = useState('');
      const [expanded, setExpanded] = useState(() => new Set());

      const categories = [];
      fields.forEach((f) => { if (!categories.includes(f.category)) categories.push(f.category); });

      const counts = {
        Pending: fields.filter((f) => f.status === 'pending').length,
        Approved: fields.filter((f) => f.status === 'approved').length,
        Rejected: fields.filter((f) => f.status === 'rejected').length,
        All: fields.length,
      };
      const pendingAthletes = new Set(fields.filter((f) => f.status === 'pending').map((f) => f.athleteId)).size;

      const visible = fields.filter((f) => {
        if (filter !== 'All' && f.status !== filter.toLowerCase()) return false;
        if (fieldFilter.length && !fieldFilter.includes(f.category)) return false;
        const a = athleteById(f.athleteId);
        const q = search.toLowerCase();
        return !q || a.name.toLowerCase().includes(q) || f.label.toLowerCase().includes(q);
      });
      const groups = ROSTER.map((a) => ({ athlete: a, rows: visible.filter((f) => f.athleteId === a.id) })).filter((g) => g.rows.length);

      const toggleExp = (id) => setExpanded((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const toggleSel = (id) => setSelected((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });

      const approveAll = (athleteId) => {
        const eligible = fields.filter((f) => f.athleteId === athleteId && f.status === 'pending' && !f.clinical).map((f) => f.id);
        if (!eligible.length) return;
        setSelected((s) => new Set([...s, ...eligible]));
        openConfirm(new Set([...selected, ...eligible]));
      };

      const stat = (n, label) => (
        <Paper key={label} elevation={0} sx={{ border: '1px solid var(--border)', borderRadius: '8px', px: 2.5, py: 1.5, minWidth: 190 }}>
          <Typography sx={{ fontSize: 24, fontWeight: 600, lineHeight: 1.2 }}>{n}</Typography>
          <Typography sx={{ fontSize: 12.5, color: 'var(--text-secondary)' }}>{label}</Typography>
        </Paper>
      );

      return (
        <Box sx={{ pb: selected.size ? 10 : 0, bgcolor: '#fff', minHeight: '100%' }}>
          <Box sx={{ p: 3 }}>
            <Box sx={{ display: 'flex', gap: 2, mb: 3, pb: 2.5, borderBottom: '1px solid var(--border)', flexWrap: 'wrap', alignItems: 'center' }}>
              <TextField placeholder="Search players" value={search} onChange={(e) => setSearch(e.target.value)} hiddenLabel sx={{ width: 260 }}
                InputProps={{ endAdornment: <InputAdornment position="end"><Svg path={P.search} size={18} color="#8a93a1" /></InputAdornment> }} />

              <FormControl variant="filled" size="small" hiddenLabel sx={{ minWidth: 180 }}>
                <Select value={filter} onChange={(e) => setFilter(e.target.value)}>
                  {['Pending', 'Approved', 'Rejected', 'All'].map((k) => (
                    <MenuItem key={k} value={k}>{`${k} (${counts[k]})`}</MenuItem>
                  ))}
                </Select>
              </FormControl>

              <FormControl variant="filled" size="small" hiddenLabel sx={{ minWidth: 220 }}>
                <Select multiple displayEmpty value={fieldFilter} onChange={(e) => setFieldFilter(e.target.value)}
                  renderValue={(sel) => sel.length === 0 ? <span style={{ color: '#8a93a1' }}>All field types</span> : sel.join(', ')}>
                  {categories.map((c) => (
                    <MenuItem key={c} value={c}>
                      <Checkbox size="small" checked={fieldFilter.includes(c)} sx={{ p: 0.5, mr: 1 }} />
                      {c}
                    </MenuItem>
                  ))}
                </Select>
              </FormControl>
            </Box>

            {groups.length === 0 ? (
              <Paper elevation={0} sx={{ border: '1px solid var(--border)', borderRadius: '8px', p: 4, textAlign: 'center', color: 'var(--text-secondary)' }}>
                No fields match this filter.
              </Paper>
            ) : (
            <Paper elevation={0} sx={{ border: '1px solid var(--border)', borderRadius: '8px', overflow: 'hidden' }}>
              {groups.map(({ athlete, rows }) => {
                const pendingRows = fields.filter((f) => f.athleteId === athlete.id && f.status === 'pending');
                const eligibleCount = pendingRows.filter((f) => !f.clinical).length;
                return (
                  <Accordion key={athlete.id} disableGutters square elevation={0} expanded={expanded.has(athlete.id)} onChange={() => toggleExp(athlete.id)}
                    sx={{ boxShadow: 'none', bgcolor: 'transparent', '&:before': { display: 'none' }, m: '0 !important' }}>
                    <AccordionSummary expandIcon={<Svg path={P.expand} size={20} color="#5b6472" />}
                      sx={{ flexDirection: 'row-reverse', gap: 1, px: 2, minHeight: 0, bgcolor: '#fff', borderBottom: '1px solid var(--border)',
                        '& .MuiAccordionSummary-content': { my: 1.25, alignItems: 'center' } }}>
                      <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5, width: '100%', pr: 1 }}>
                        <Avatar sx={{ width: 30, height: 30, fontSize: 12, bgcolor: 'var(--grey-fill)', color: 'var(--text-secondary)', fontWeight: 600 }}>
                          {athlete.name.split(',')[0].slice(0, 2).toUpperCase()}
                        </Avatar>
                        <Typography sx={{ fontWeight: 600, fontSize: 14 }}>{athlete.name}</Typography>
                        <Box sx={{ display: 'flex', alignItems: 'baseline', gap: 1, ml: 2 }}>
                          <Typography sx={{ fontSize: 12, color: 'var(--text-secondary)' }}>Submission date</Typography>
                          <Typography sx={{ fontSize: 13.5, fontWeight: 600, color: 'var(--text-primary)' }}>{SUBMITTED}</Typography>
                        </Box>
                        <Box sx={{ flex: 1 }} />
                        {eligibleCount > 0 && (
                          <Tooltip title={`Selects the ${eligibleCount} eligible non-clinical field${eligibleCount > 1 ? 's' : ''} and opens the confirmation step. Injury history, allergy and medication fields require individual review.`}>
                            <Button onClick={(e) => { e.stopPropagation(); approveAll(athlete.id); }}
                              sx={{ bgcolor: 'var(--grey-fill)', color: 'var(--text-primary)', fontSize: 12, '&:hover': { bgcolor: '#e6e8ee' } }}>
                              Approve all
                            </Button>
                          </Tooltip>
                        )}
                      </Box>
                    </AccordionSummary>
                    <AccordionDetails sx={{ p: 0 }}>
                      <FieldHeaderRow />
                      {rows.map((f) => (
                        <FieldRow key={f.id} f={f} checked={selected.has(f.id)} onToggle={() => toggleSel(f.id)}
                          onApprove={() => approveFields([f.id])} onReject={() => rejectFields([f.id])} />
                      ))}
                    </AccordionDetails>
                  </Accordion>
                );
              })}
            </Paper>
            )}
          </Box>

          {selected.size > 0 && (
            <Paper elevation={8} sx={{ position: 'fixed', bottom: 0, left: 72, right: 0, zIndex: 1200, px: 3, py: 1.5,
              display: 'flex', alignItems: 'center', gap: 2, bgcolor: 'var(--nav-dark)', color: '#fff', borderRadius: 0 }}>
              <Typography sx={{ fontWeight: 600, fontSize: 14 }}>{selected.size} selected</Typography>
              <Button onClick={() => openConfirm(selected)} sx={{ bgcolor: '#005293' }}>Review &amp; approve</Button>
              <Button onClick={() => { rejectFields([...selected]); setSelected(new Set()); }}
                sx={{ bgcolor: 'transparent', color: '#ffb4a9', border: '1px solid rgba(255,255,255,0.3)', '&:hover': { bgcolor: 'rgba(255,255,255,0.08)' } }}>
                Reject selected
              </Button>
              <Button onClick={() => setSelected(new Set())}
                sx={{ bgcolor: 'transparent', color: '#fff', '&:hover': { bgcolor: 'rgba(255,255,255,0.08)' } }}>
                Clear selection
              </Button>
            </Paper>
          )}
        </Box>
      );
    };

    /* ---------- Screen 3: Player Overview ---------- */
    const PlayerScreen = ({ athleteId, injuries, go }) => {
      const a = athleteById(athleteId);
      const rows = injuries.filter((i) => i.athleteId === athleteId);
      const tabs = ['Injury/Illness', 'Notes', 'Diagnostics', 'Player details', 'Maintenance', 'Medications', 'Procedures', 'Documents'];
      const meta = athleteId === 'akron2'
        ? { dob: 'Mar 3, 2004', age: 22, country: 'United States', height: '180 cm', roster: 'First team', open: rows.filter((r) => r.status === 'Open').length }
        : { dob: 'Jan 1, 2002', age: 24, country: 'United States', height: '182 cm', roster: 'First team', open: rows.filter((r) => r.status === 'Open').length };

      const headStat = (label, value) => (
        <Box key={label} sx={{ minWidth: 110 }}>
          <Typography sx={{ fontSize: 11, color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>{label}</Typography>
          <Typography sx={{ fontSize: 13.5, fontWeight: 600, mt: 0.25 }}>{value}</Typography>
        </Box>
      );

      return (
        <Box>
          <Box sx={{ bgcolor: '#fff', borderBottom: '1px solid var(--border)', px: 3, pt: 2 }}>
            <Button onClick={() => go('roster')} startIcon={<Svg path={P.back} size={16} />}
              sx={{ bgcolor: 'transparent', color: '#005293', px: 1, mb: 1, '&:hover': { bgcolor: 'var(--grey-fill)' } }}>Back to roster</Button>
            <Box sx={{ display: 'flex', alignItems: 'center', gap: 2, mb: 2, flexWrap: 'wrap' }}>
              <Avatar sx={{ width: 56, height: 56, bgcolor: 'var(--nav-dark)', fontWeight: 600 }}>{a.name.split(',')[0].slice(0, 2).toUpperCase()}</Avatar>
              <Box>
                <Typography variant="h5">{a.name}</Typography>
                <StatusPill status={a.status} />
              </Box>
              <Divider orientation="vertical" flexItem sx={{ mx: 1 }} />
              <Box sx={{ display: 'flex', gap: 3, flexWrap: 'wrap' }}>
                {headStat('DOB', meta.dob)}
                {headStat('Age', meta.age)}
                {headStat('Country', meta.country)}
                {headStat('Height', meta.height)}
                {headStat('Roster position', a.pos)}
                {headStat('Roster', meta.roster)}
                {headStat('Open injury/illness', meta.open)}
              </Box>
            </Box>
            <Tabs value={0} variant="scrollable" scrollButtons={false}>
              {tabs.map((t) => <Tab key={t} label={t} />)}
            </Tabs>
          </Box>

          <Box sx={{ p: 3 }}>
            <Typography sx={{ fontSize: 16, fontWeight: 600, mb: 1.5 }}>Open injury/illness</Typography>
            <Paper elevation={0} sx={{ border: '1px solid var(--border)', borderRadius: '8px', overflow: 'hidden' }}>
              <Table size="small">
                <TableHead>
                  <TableRow>
                    <TableCell>Date of Injury/Illness</TableCell>
                    <TableCell>Type</TableCell>
                    <TableCell>
                      <Box sx={{ display: 'inline-flex', alignItems: 'center', gap: 0.5 }}>
                        Title
                        <Tooltip title="Injury or illness title as recorded"><span style={{ display: 'inline-flex' }}><InfoIcon /></span></Tooltip>
                      </Box>
                    </TableCell>
                    <TableCell>Status</TableCell>
                  </TableRow>
                </TableHead>
                <TableBody>
                  {rows.length === 0 && (
                    <TableRow><TableCell colSpan={4} sx={{ color: 'var(--text-secondary)', fontSize: 13, py: 3, textAlign: 'center' }}>No open injury/illness records.</TableCell></TableRow>
                  )}
                  {rows.map((r) => (
                    <TableRow key={r.id} hover>
                      <TableCell sx={{ fontSize: '16.59px', fontWeight: 400, textDecoration: 'underline', color: 'var(--text-primary)' }}>{r.date}</TableCell>
                      <TableCell sx={{ fontSize: 13 }}>{r.type}</TableCell>
                      <TableCell sx={{ fontSize: '16.59px', fontWeight: 400, color: 'var(--text-primary)' }}>
                        <Box sx={{ display: 'inline-flex', alignItems: 'center', gap: 0.5 }}>
                          {r.fromForm && (
                            <Tooltip title={`Added via Medical History Form · approved ${r.approvedDate}`}>
                              <span style={{ display: 'inline-flex' }}><Svg path={P.desc} size={14} color="#8a93a1" /></span>
                            </Tooltip>
                          )}
                          <span style={{ textDecoration: 'underline' }}>{r.title}</span>
                        </Box>
                      </TableCell>
                      <TableCell>
                        <Chip label={r.status} sx={{ bgcolor: r.status === 'Open' ? 'var(--warn-bg)' : 'var(--success-bg)', color: r.status === 'Open' ? 'var(--warn)' : 'var(--success)', fontWeight: 600, fontSize: 12 }} />
                      </TableCell>
                    </TableRow>
                  ))}
                </TableBody>
              </Table>
            </Paper>
          </Box>
        </Box>
      );
    };

    /* ---------- App ---------- */
    const App = () => {
      const [screen, setScreen] = useState({ name: 'roster', athleteId: null });
      const [medTab, setMedTab] = useState(0);
      const [fields, setFields] = useState(INITIAL_FIELDS.map((f) => ({ ...f, status: 'pending' })));
      const [selected, setSelected] = useState(new Set());
      const [confirmIds, setConfirmIds] = useState(null); // Set of ids or null
      const [injuries, setInjuries] = useState([
        { id: 'i1', athleteId: 'akron2', date: 'May 12, 2026', type: 'Injury', title: 'Lateral Ankle Sprain - Ligament Unknown [Left]', status: 'Open', fromForm: false },
      ]);

      const go = (name, athleteId = null) => setScreen({ name, athleteId });

      const applyStatus = (ids, status) => {
        setFields((fs) => fs.map((f) => (ids.includes(f.id) && f.status === 'pending' ? { ...f, status } : f)));
        if (status === 'approved') {
          const approvedInjuries = fields.filter((f) => ids.includes(f.id) && f.status === 'pending' && f.category === 'Injury history');
          if (approvedInjuries.length) {
            setInjuries((inj) => [
              ...inj,
              ...approvedInjuries.map((f) => ({
                id: 'inj-' + f.id, athleteId: f.athleteId,
                date: f.duplicate ? 'May 2026' : '—', type: 'Injury',
                title: f.incoming.split(' · ')[0], status: 'Open', fromForm: true, approvedDate: TODAY,
              })),
            ]);
          }
        }
        setSelected((s) => { const n = new Set(s); ids.forEach((id) => n.delete(id)); return n; });
      };

      const approveFields = (ids) => applyStatus(ids, 'approved');
      const rejectFields = (ids) => applyStatus(ids, 'rejected');

      const pendingCount = new Set(fields.filter((f) => f.status === 'pending').map((f) => f.athleteId)).size;
      const confirmList = confirmIds ? fields.filter((f) => confirmIds.has(f.id) && f.status === 'pending') : [];
      const confirmGroups = confirmIds
        ? ROSTER.map((a) => ({ athlete: a, rows: confirmList.filter((f) => f.athleteId === a.id) })).filter((g) => g.rows.length)
        : [];

      return (
        <ThemeProvider theme={theme}>
          <CssBaseline />
          <Box sx={{ display: 'flex', minHeight: '100vh' }}>
            <NavRail screen={screen.name} go={go} />
            <Box sx={{ flex: 1, minWidth: 0 }}>
              {screen.name === 'roster' && (
                <RosterScreen go={go} pendingCount={pendingCount} tab={medTab} setTab={setMedTab}
                  pendingBody={
                    <PendingScreen fields={fields} selected={selected} setSelected={setSelected}
                      approveFields={approveFields} rejectFields={rejectFields}
                      openConfirm={(ids) => setConfirmIds(new Set(ids))} />
                  } />
              )}
              {screen.name === 'player' && <PlayerScreen athleteId={screen.athleteId} injuries={injuries} go={go} />}
            </Box>
          </Box>

          <Dialog open={!!confirmIds} onClose={() => setConfirmIds(null)} maxWidth="sm" fullWidth>
            <DialogTitle sx={{ fontWeight: 600, fontSize: 18 }}>Confirm approval of {confirmList.length} field{confirmList.length !== 1 ? 's' : ''}</DialogTitle>
            <DialogContent dividers sx={{ p: 0 }}>
              <Typography sx={{ fontSize: 13, color: 'var(--text-secondary)', px: 3, py: 1.5 }}>
                The following values will be written to each athlete's medical record. Nothing is committed until you confirm.
              </Typography>
              {confirmGroups.map(({ athlete, rows }) => (
                <Box key={athlete.id} sx={{ px: 3, pb: 1.5 }}>
                  <Typography sx={{ fontSize: 13, fontWeight: 600, py: 0.75 }}>{athlete.name}</Typography>
                  {rows.map((f) => (
                    <Box key={f.id} sx={{ display: 'flex', gap: 1.5, py: 0.5, pl: 1.5, borderLeft: '2px solid var(--border)' }}>
                      <Typography sx={{ fontSize: 13, width: 200, flexShrink: 0, color: 'var(--text-secondary)' }}>{f.label}</Typography>
                      <Typography sx={{ fontSize: 13 }}>{f.incoming}</Typography>
                    </Box>
                  ))}
                </Box>
              ))}
            </DialogContent>
            <DialogActions sx={{ px: 3, py: 2 }}>
              <Button onClick={() => setConfirmIds(null)} sx={{ bgcolor: 'var(--grey-fill)', color: 'var(--text-primary)' }}>Go back</Button>
              <Button onClick={() => { approveFields(confirmList.map((f) => f.id)); setConfirmIds(null); }} sx={{ bgcolor: '#005293' }}>
                Confirm approval of {confirmList.length} field{confirmList.length !== 1 ? 's' : ''}
              </Button>
            </DialogActions>
          </Dialog>
        </ThemeProvider>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
