<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow">
    <title>Share Record — Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        try {
          if (sessionStorage.getItem('kl_gate') === '1') {
            return;
          }

          var overlay = document.createElement('div');
          overlay.id = 'kl-gate-overlay';
          overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:999999;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:"Open Sans",sans-serif;';

          var box = document.createElement('div');
          box.style.cssText = 'width:320px;max-width:90vw;text-align:center;';

          var heading = document.createElement('h1');
          heading.textContent = 'Enter password';
          heading.style.cssText = 'margin:0 0 20px;font-family:"Open Sans",sans-serif;font-weight:600;font-size:20px;color:#172B4D;';

          var input = document.createElement('input');
          input.type = 'password';
          input.placeholder = 'Password';
          input.autocomplete = 'off';
          input.style.cssText = 'width:100%;box-sizing:border-box;padding:10px 12px;background:#F3F4F7;border:1px solid #E8EAED;border-radius:4px;font-family:"Open Sans",sans-serif;font-weight:400;font-size:14px;color:#172B4D;outline:none;';

          var button = document.createElement('button');
          button.type = 'button';
          button.textContent = 'Continue';
          button.style.cssText = 'width:100%;margin-top:12px;padding:10px 12px;background:#1D2635;color:#FFFFFF;border:none;border-radius:4px;font-family:"Open Sans",sans-serif;font-weight:400;font-size:14px;cursor:pointer;';

          var error = document.createElement('div');
          error.textContent = 'Incorrect password. Please try again.';
          error.style.cssText = 'display:none;margin-top:10px;font-family:"Open Sans",sans-serif;font-weight:400;font-size:13px;color:#D32F2F;';

          box.appendChild(heading);
          box.appendChild(input);
          box.appendChild(button);
          box.appendChild(error);
          overlay.appendChild(box);
          document.body.appendChild(overlay);
          document.body.style.overflow = 'hidden';

          var attempt = function () {
            try {
              if (input.value === 'kitman2026') {
                sessionStorage.setItem('kl_gate', '1');
                overlay.remove();
                document.body.style.overflow = '';
              } else {
                error.style.display = 'block';
              }
            } catch (e) {
              overlay.remove();
              document.body.style.overflow = '';
            }
          };

          button.addEventListener('click', attempt);
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
              attempt();
            }
          });

          input.focus();
        } catch (e) {
          var existing = document.getElementById('kl-gate-overlay');
          if (existing) {
            existing.remove();
          }
          document.body.style.overflow = '';
        }
      })();
    </script>
  </body>
</html>
