    // Monday-first 6-week grid for a given year/month
    function buildGrid(year, month) {
      const first = new Date(year, month, 1);
      const jsDow = first.getDay();               // 0 = Sun
      const lead = (jsDow + 6) % 7;               // days from previous month to show
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysPrev = new Date(year, month, 0).getDate();
      const cells = [];
      for (let i = 0; i < 42; i++) {
        const dayNum = i - lead + 1;
        if (dayNum < 1) cells.push({ day: daysPrev + dayNum, inMonth: false, m: month - 1 });
        else if (dayNum > daysInMonth) cells.push({ day: dayNum - daysInMonth, inMonth: false, m: month + 1 });
        else cells.push({ day: dayNum, inMonth: true, m: month });
      }
      return cells;
    }

        height: 48, borderRadius: '4px 4px 0 0', backgroundColor: '#F3F4F7', boxShadow: 'none',
        borderBottom: '1px solid #E8EAED',
        '&:hover': { backgroundColor: '#ECEEF2' },
        '&.Mui-focused': { backgroundColor: '#ECEEF2', boxShadow: 'none', borderBottom: '2px solid #3B4960' },
      },
      '& .MuiFilledInput-input': { fontSize: 15, color: '#172B4D' },
      '& .MuiFilledInput-input::placeholder': { color: '#5F7089', opacity: 1, fontSize: 15 },
      '& .MuiInputLabel-root': { fontSize: 15, fontWeight: 400, color: '#5F7089' },
      '& .MuiSelect-icon': { color: '#5F7089', fontSize: 20 },
      '& .MuiSvgIcon-root': { color: '#5F7089', fontSize: 20 },
    };
    const DRAWER_FIELD_MULTILINE_SX = {
      ...DRAWER_FIELD_SX,
      '& .MuiFilledInput-root': { ...DRAWER_FIELD_SX['& .MuiFilledInput-root'], height: 'auto', borderRadius: '4px' },
    };
    const DRAWER_DIVIDER_SX = { my: 3, borderColor: '#E8EAED' };

    /* ═══════════════════════════════════════════════════════════════════════
       NAV RAIL
       ═══════════════════════════════════════════════════════════════════════ */
    function NavRail() {
      const items = [
        { icon: P.analytics }, { icon: P.network }, { icon: P.medical }, { icon: P.drop },
        { icon: P.clipboard }, { icon: P.calendar, active: true }, { icon: P.inbox },
        { icon: P.folder }, { icon: P.person }, { icon: P.document }, { icon: P.settings },
      ];
      return (
        <Box sx={{
          width: 60, display: 'flex', flexDirection: 'column', alignItems: 'center', flexShrink: 0,
          background: 'linear-gradient(180deg, #0A1428 0%, #0F2545 45%, #1B4A8A 100%)',
          boxShadow: '2px 0 8px rgba(0,0,0,0.15)',
        }}>
          {/* org crest */}
          <Box sx={{ width: '100%', height: 60, bgcolor: '#06101F', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
            <Box sx={{ width: 32, height: 32, borderRadius: '50%', bgcolor: 'var(--org-red)', display: 'flex', alignItems: 'center', justifyContent: 'center', border: '2px solid #C8151C' }}>
              <Typography sx={{ color: '#fff', fontSize: 17 }}>KL</Typography>
            </Box>
          </Box>
          {items.map((it, i) => (
            <Box key={i} sx={{
              width: '100%', height: 48, display: 'flex', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer', position: 'relative',
              bgcolor: it.active ? 'rgba(255,255,255,0.10)' : 'transparent',
              borderLeft: it.active ? '4px solid #FFB81C' : '4px solid transparent',
              '&:hover': { bgcolor: it.active ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.06)' },
            }}>
              <Icon path={it.icon} size={20} color="#fff" />
            </Box>
          ))}
          <Box sx={{ flex: 1 }} />
          <Box sx={{ height: 48, display: 'flex', alignItems: 'center' }}><Icon path={P.help} size={20} color="#fff" /></Box>
          <Box sx={{ height: 48, display: 'flex', alignItems: 'center' }}>
            <Icon path={P.chevronDoubleRight} size={20} color="#fff" />
          </Box>
        </Box>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       ORG MULTI-SELECT  (CHANGE 2) — reuses the org-selector accordion pattern
       ═══════════════════════════════════════════════════════════════════════ */
    function OrgSelector({ selectedOrgIds, selectedSquadIds, onOrgToggle, anchorLabelColor }) {
      const [anchor, setAnchor] = useState(null);
      const [expanded, setExpanded] = useState(() => new Set(['atl']));

      const label = useMemo(() => {
        const ids = [...selectedOrgIds];
        if (ids.length === 0) return 'Select organisation';
        if (ids.length === 1) return ORG_BY_ID[ids[0]].name;
        return `${ORG_BY_ID[ids[0]].name} +${ids.length - 1}`;
      }, [selectedOrgIds]);

      const toggleExpand = (id) => setExpanded(prev => {
        const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n;
      });

      return (
        <>
          <Box onClick={(e) => setAnchor(e.currentTarget)} sx={{
            bgcolor: 'var(--org-red)', color: '#fff', height: 30, borderRadius: '4px',
            px: 2, minWidth: 250, display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer', gap: 1, '&:hover': { bgcolor: '#D4141B' },
          }}>
            <Typography sx={{ fontSize: 18, color: '#fff' }}>{label}</Typography>
            <Icon path={P.chevronDown} size={23} color="#fff" />
          </Box>

          <Popover open={Boolean(anchor)} anchorEl={anchor} onClose={() => setAnchor(null)}
            anchorOrigin={{ vertical: 'bottom', horizontal: 'center' }} transformOrigin={{ vertical: 'top', horizontal: 'center' }}
            PaperProps={{ sx: { mt: 1, width: 340, maxHeight: 460, borderRadius: 2, boxShadow: '0 8px 28px rgba(0,0,0,0.16)' } }}>
            <Box sx={{ px: 2, py: 1.5, borderBottom: '1px solid var(--border)' }}>
              <Typography sx={{ fontSize: 18, color: 'var(--text-primary)' }}>Organisations in view</Typography>
              <Typography sx={{ fontSize: 16, color: 'var(--text-secondary)' }}>Pick one or more to see their calendars together</Typography>
            </Box>
            <Box sx={{ overflowY: 'auto', maxHeight: 360 }}>
              {ORGS.map(org => {
                const isOn = selectedOrgIds.has(org.id);
                const isOpen = expanded.has(org.id);
                const squadCount = org.squads.filter(s => selectedSquadIds.has(s.id)).length;
                return (
                  <Box key={org.id} sx={{ borderBottom: '1px solid var(--border)' }}>
                    <Box sx={{ display: 'flex', alignItems: 'center', px: 1, py: 0.75 }}>
                      <Checkbox checked={isOn} onChange={() => onOrgToggle(org.id)} />
                      <Box onClick={() => onOrgToggle(org.id)} sx={{ display: 'flex', alignItems: 'center', gap: 1, flex: 1, cursor: 'pointer', minWidth: 0 }}>
                        <Avatar src={org.avatar} variant="circular" sx={{ width: 24, height: 24, bgcolor: 'transparent', flexShrink: 0, '& img': { objectFit: 'contain' } }} />
                        <Typography sx={{ fontSize: 18, color: 'var(--text-primary)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{org.name}</Typography>
                        <Typography sx={{ fontSize: 16, color: 'var(--text-muted)' }}>{org.squads.length} squads</Typography>
                      </Box>
                      <IconButton size="small" onClick={() => toggleExpand(org.id)}>
                        <Icon path={isOpen ? P.chevronUp : P.chevronDown} size={23} color="var(--text-secondary)" />
                      </IconButton>
                    </Box>
                    <Collapse in={isOpen}>
                      <Box sx={{ pl: 4.5, pr: 2, pb: 1 }}>
                        {org.squads.map(s => (
                          <Typography key={s.id} sx={{ fontSize: 17, color: selectedSquadIds.has(s.id) ? 'var(--text-primary)' : 'var(--text-muted)', py: 0.25, display: 'flex', alignItems: 'center', gap: 0.75 }}>
                            <Box sx={{ width: 6, height: 6, borderRadius: '50%', bgcolor: squadColor(s.id) }} />{s.name}
                          </Typography>
                        ))}
                      </Box>
                    </Collapse>
                  </Box>
                );
              })}
            </Box>
          </Popover>
        </>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       TOP BAR
       ═══════════════════════════════════════════════════════════════════════ */
    function TopBar({ selectedOrgIds, selectedSquadIds, onOrgToggle }) {
      return (
        <Box sx={{ height: 64, bgcolor: '#fff', borderBottom: '1px solid #E8EAED', display: 'flex', alignItems: 'center', px: 3, flexShrink: 0 }}>
          <Box sx={{ display: 'flex', alignItems: 'center', flex: 1 }}>
            <Typography sx={{ fontSize: 16, fontWeight: 400, color: '#5F7089' }}>Calendar</Typography>
            <Box sx={{ display: 'flex', alignItems: 'center', gap: 1, cursor: 'pointer', ml: 3 }}>
              <Icon path={P.person} size={20} color="#172B4D" />
              <Typography sx={{ fontSize: 16, fontWeight: 600, color: '#172B4D' }}>Player list</Typography>
              <Icon path={P.chevronDoubleRight} size={18} color="#172B4D" />
            </Box>
          </Box>
          <OrgSelector selectedOrgIds={selectedOrgIds} selectedSquadIds={selectedSquadIds} onOrgToggle={onOrgToggle} />
          <Box sx={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 1.5 }}>
            <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.75, cursor: 'pointer' }}>
              <Box sx={{ width: 22, height: 22, borderRadius: '50%', bgcolor: 'var(--org-red)', border: '1.5px solid #C8151C' }} />
              <Typography sx={{ fontSize: 18, color: 'var(--text-primary)' }}>Test</Typography>
              <Icon path={P.chevronDown} size={21} color="var(--text-secondary)" />
            </Box>
            <Box sx={{ width: '1px', height: 24, bgcolor: '#E8EAED' }} />
            <Box sx={{ width: 30, height: 30, borderRadius: '50%', bgcolor: '#DDE1E7', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <Typography sx={{ fontSize: 16, color: 'var(--navy)' }}>LV</Typography>
            </Box>
          </Box>
        </Box>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       TOOLBAR (Show Filters / Today / arrows / month / view / Add)
       ═══════════════════════════════════════════════════════════════════════ */
    function Toolbar({ showFilters, onToggleFilters, filterBadge, monthLabel, onNav, onAdd }) {
      const [addAnchor, setAddAnchor] = useState(null);
      const [viewAnchor, setViewAnchor] = useState(null);
      const [view, setView] = useState('Month');
      return (
        <Box sx={{ minHeight: 72, bgcolor: '#fff', display: 'flex', alignItems: 'center', px: 3, position: 'relative', flexShrink: 0 }}>
          {/* left */}
          <Box sx={{ display: 'flex', alignItems: 'center', gap: 1, flex: 1 }}>
            <Badge badgeContent={filterBadge} sx={{
              '& .MuiBadge-badge': { bgcolor: '#1D2635', color: '#fff', fontSize: 11 },
            }}>
              <GreyButton onClick={onToggleFilters} sx={{ gap: 0.5, bgcolor: showFilters ? '#E8EAED' : '#F3F4F7' }}>
                Show filters <Icon path={P.filter} size={22} />
              </GreyButton>
            </Badge>
            <GreyButton onClick={() => onNav('today')}>Today</GreyButton>
            <GreyButton onClick={() => onNav('prev')} sx={{ minWidth: 52, width: 52, px: 0 }}><Icon path={P.chevronLeft} size={22} /></GreyButton>
            <GreyButton onClick={() => onNav('next')} sx={{ minWidth: 52, width: 52, px: 0 }}><Icon path={P.chevronRight} size={22} /></GreyButton>
          </Box>

          {/* center month */}
          <Box sx={{ position: 'absolute', left: '50%', transform: 'translateX(-50%)', display: 'flex', alignItems: 'center', gap: 0.5 }}>
            <Typography variant="h1" sx={{ fontSize: 28, fontWeight: 700, color: '#172B4D' }}>{monthLabel}</Typography>
            <Icon path={P.chevronDown} size={20} color="#172B4D" />
          </Box>

          {/* right */}
          <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5, flex: 1, justifyContent: 'flex-end' }}>
            <Box sx={{ width: '1px', height: 24, bgcolor: '#E8EAED' }} />
            <GreyButton onClick={(e) => setViewAnchor(e.currentTarget)} sx={{ gap: 0.5 }}>
              {view} <Icon path={P.chevronDown} size={22} />
            </GreyButton>
            <Button onClick={(e) => setAddAnchor(e.currentTarget)} sx={{ ...PRIMARY_BTN_SX, gap: 0.5 }}>
              Add <Icon path={P.chevronDown} size={22} />
            </Button>
          </Box>

          <Menu anchorEl={viewAnchor} open={Boolean(viewAnchor)} onClose={() => setViewAnchor(null)}>
            {['Month', 'Week', 'Day', 'List'].map(v => (
              <MenuItem key={v} onClick={() => { setView(v); setViewAnchor(null); }}>{v}</MenuItem>
            ))}
          </Menu>
          <Menu anchorEl={addAnchor} open={Boolean(addAnchor)} onClose={() => setAddAnchor(null)}
            anchorOrigin={{ vertical: 'bottom', horizontal: 'right' }} transformOrigin={{ vertical: 'top', horizontal: 'right' }}>
            {['Event', 'Session', 'Game'].map(t => (
              <MenuItem key={t} onClick={() => { setAddAnchor(null); onAdd(t); }}>{t}</MenuItem>
            ))}
          </Menu>
        </Box>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       FILTERS PANEL — Squads grouped by org (CHANGE 2) + dynamic Types (CHANGE 1)
       ═══════════════════════════════════════════════════════════════════════ */
    function FilterSection({ title, count, expanded, onToggle, children }) {
      return (
        <Box sx={{ borderBottom: '1px solid var(--border)' }}>
          <Box onClick={onToggle} sx={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', px: 2, py: 1.5, cursor: 'pointer' }}>
            <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.75 }}>
              <Typography sx={{ fontSize: 18, color: 'var(--text-primary)' }}>{title}</Typography>
              <Typography sx={{ fontSize: 17, color: 'var(--text-muted)' }}>{count}</Typography>
            </Box>
            <Icon path={expanded ? P.chevronUp : P.chevronDown} size={26} color="var(--text-secondary)" />
          </Box>
          <Collapse in={expanded}><Box sx={{ px: 2, pb: 2 }}>{children}</Box></Collapse>
        </Box>
      );
    }

    function SelectClear({ onAll, onClear }) {
      const link = { fontSize: 17, color: 'var(--blue)', cursor: 'pointer', '&:hover': { textDecoration: 'underline' } };
      return (
        <Box sx={{ display: 'flex', alignItems: 'center', gap: 1, mb: 1 }}>
          <Typography sx={link} onClick={onAll}>Select all</Typography>
          <Typography sx={{ fontSize: 17, color: 'var(--text-muted)' }}>|</Typography>
          <Typography sx={link} onClick={onClear}>Clear</Typography>
        </Box>
      );
    }

    function SquadRow({ label, checked, onToggle, color }) {
      return (
        <Box onClick={onToggle} sx={{ display: 'flex', alignItems: 'center', cursor: 'pointer', py: 0.25 }}>
          <Checkbox checked={checked} onChange={onToggle} sx={{ p: 0.5, mr: 1 }} />
          {color && <Box sx={{ width: 8, height: 8, borderRadius: '2px', bgcolor: color, mr: 1, flexShrink: 0 }} />}
          <Typography sx={{ fontSize: 18, color: 'var(--text-primary)' }}>{label}</Typography>
        </Box>
      );
    }

    function FiltersPanel({ onClose, selectedOrgIds, onOrgToggle, selectedSquadIds, setSelectedSquadIds, types, selectedTypes, setSelectedTypes, typeColors }) {
      const [orgsOpen, setOrgsOpen] = useState(true);
      const [squadsOpen, setSquadsOpen] = useState(true);
      const [typesOpen, setTypesOpen] = useState(true);
      const [search, setSearch] = useState('');
      const [globalSearch, setGlobalSearch] = useState('');
      const [showMore, setShowMore] = useState(false);
      const [openOrgGroups, setOpenOrgGroups] = useState(() => new Set([...selectedOrgIds]));

      const orgsInView = ORGS.filter(o => selectedOrgIds.has(o.id));
      const multiOrg = orgsInView.length > 1;
      const match = (s) => s.toLowerCase().includes(search.toLowerCase());
      const globalMatch = (s) => s.toLowerCase().includes(globalSearch.toLowerCase());
      const searchFieldSx = {
        '& .MuiFilledInput-root': {
          height: 56, borderRadius: '4px 4px 0 0', backgroundColor: '#F3F4F7', boxShadow: 'none',
          borderBottom: '1px solid #B3BAC5',
          '&:hover': { backgroundColor: '#F3F4F7', borderBottom: '1px solid #5F7089' },
          '&.Mui-focused': { backgroundColor: '#EDEFF3', boxShadow: 'none', borderBottom: '2px solid #172B4D' },
        },
        '& .MuiFilledInput-input': { fontSize: 16, fontWeight: 400, color: '#172B4D' },
        '& .MuiFilledInput-input::placeholder': { color: '#5F7089', opacity: 1, fontSize: 16, fontWeight: 400, fontStyle: 'normal' },
      };

      const toggleSquad = (id) => setSelectedSquadIds(prev => {
        const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n;
      });
      const setSquadsBulk = (ids, on) => setSelectedSquadIds(prev => {
        const n = new Set(prev); ids.forEach(id => on ? n.add(id) : n.delete(id)); return n;
      });
      const toggleOrgGroup = (id) => setOpenOrgGroups(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });

      const toggleType = (t) => setSelectedTypes(prev => {
        const n = new Set(prev); n.has(t) ? n.delete(t) : n.add(t); return n;
      });

      const allVisibleSquadIds = orgsInView.flatMap(o => o.squads.filter(s => match(s.name) && globalMatch(s.name)).map(s => s.id));

      return (
        <Box sx={{ width: 360, bgcolor: '#fff', borderRight: '1px solid var(--border)', display: 'flex', flexDirection: 'column', flexShrink: 0, height: '100%' }}>
          <Box sx={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', px: 2, py: 1.75, borderBottom: '1px solid var(--border)' }}>
            <Typography sx={{ fontSize: 23, color: 'var(--text-primary)' }}>Filters</Typography>
            <IconButton size="small" onClick={onClose}><Icon path={P.close} size={26} color="var(--text-secondary)" /></IconButton>
          </Box>

          <Box sx={{ flex: 1, overflowY: 'auto' }}>
            <Box sx={{ px: 2, pt: 2 }}>
              <TextField variant="filled" fullWidth placeholder="Search" value={globalSearch} onChange={(e) => setGlobalSearch(e.target.value)}
                InputProps={{ endAdornment: <InputAdornment position="end"><Icon path={P.search} size={20} color="#5F7089" /></InputAdornment> }}
                sx={{ ...searchFieldSx, mb: 3 }} />
            </Box>
            {/* ── ORGANISATION ── */}
            <FilterSection title="Organisation" count={selectedOrgIds.size} expanded={orgsOpen} onToggle={() => setOrgsOpen(!orgsOpen)}>
              {ORGS.filter(org => globalMatch(org.name)).map(org => (
                <Box key={org.id} onClick={() => onOrgToggle(org.id)} sx={{ display: 'flex', alignItems: 'center', cursor: 'pointer', py: 0.25 }}>
                  <Checkbox checked={selectedOrgIds.has(org.id)} onChange={() => onOrgToggle(org.id)} onClick={(e) => e.stopPropagation()} sx={{ p: 0.5, mr: 1 }} />
                  <Avatar src={org.avatar} variant="circular" sx={{ width: 24, height: 24, bgcolor: 'transparent', mr: 1, flexShrink: 0, '& img': { objectFit: 'contain' } }} />
                  <Typography sx={{ fontSize: 15, color: 'var(--text-primary)' }}>{org.name}</Typography>
                </Box>
              ))}
            </FilterSection>

            {/* ── SQUADS ── */}
            <FilterSection title="Squads" count={selectedSquadIds.size} expanded={squadsOpen} onToggle={() => setSquadsOpen(!squadsOpen)}>
              <TextField fullWidth placeholder="Search" value={search} onChange={(e) => setSearch(e.target.value)}
                InputProps={{ endAdornment: <InputAdornment position="end"><Icon path={P.search} size={23} color="var(--text-secondary)" /></InputAdornment> }}
                sx={{ mb: 1.5 }} />
              <SelectClear onAll={() => setSquadsBulk(allVisibleSquadIds, true)} onClear={() => setSquadsBulk(allVisibleSquadIds, false)} />

              {multiOrg ? (
                /* grouped by org — accordion header per org */
                orgsInView.map(org => {
                  const squads = org.squads.filter(s => match(s.name) && globalMatch(s.name));
                  if (!squads.length) return null;
                  const open = openOrgGroups.has(org.id);
                  return (
                    <Box key={org.id} sx={{ mb: 0.5 }}>
                      <Box onClick={() => toggleOrgGroup(org.id)} sx={{ display: 'flex', alignItems: 'center', gap: 0.75, py: 0.5, cursor: 'pointer' }}>
                        <Icon path={open ? P.chevronUp : P.chevronDown} size={23} color="var(--text-secondary)" />
                        <Avatar src={org.avatar} variant="circular" sx={{ width: 24, height: 24, bgcolor: 'transparent', '& img': { objectFit: 'contain' } }} />
                        <Typography sx={{ fontSize: 17, color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: 0.3 }}>{org.name}</Typography>
                      </Box>
                      <Collapse in={open}>
                        <Box sx={{ pl: 2.5 }}>
                          {squads.map(s => (
                            <SquadRow key={s.id} label={s.name} color={squadColor(s.id)}
                              checked={selectedSquadIds.has(s.id)} onToggle={() => toggleSquad(s.id)} />
                          ))}
                        </Box>
                      </Collapse>
                    </Box>
                  );
                })
              ) : (
                /* single org — flat list with Show more */
                (() => {
                  const org = orgsInView[0];
                  if (!org) return <Typography sx={{ fontSize: 17, color: 'var(--text-muted)' }}>Select an organisation.</Typography>;
                  const squads = org.squads.filter(s => match(s.name) && globalMatch(s.name));
                  const visible = showMore ? squads : squads.slice(0, 8);
                  return (
                    <>
                      {visible.map(s => (
                        <SquadRow key={s.id} label={s.name} checked={selectedSquadIds.has(s.id)} onToggle={() => toggleSquad(s.id)} />
                      ))}
                      {squads.length > 8 && (
                        <Typography onClick={() => setShowMore(!showMore)} sx={{ fontSize: 17, color: 'var(--blue)', cursor: 'pointer', mt: 0.5, '&:hover': { textDecoration: 'underline' } }}>
                          {showMore ? 'Show less' : 'Show more'}
                        </Typography>
                      )}
                    </>
                  );
                })()
              )}
            </FilterSection>

            {/* ── TYPES (dynamic) ── */}
            <FilterSection title="Types" count={selectedTypes.size} expanded={typesOpen} onToggle={() => setTypesOpen(!typesOpen)}>
              <SelectClear onAll={() => setSelectedTypes(new Set(types))} onClear={() => setSelectedTypes(new Set())} />
              {types.filter(t => globalMatch(t)).map(t => (
                <Box key={t} onClick={() => toggleType(t)} sx={{ display: 'flex', alignItems: 'center', cursor: 'pointer', py: 0.25 }}>
                  <Checkbox checked={selectedTypes.has(t)} onChange={() => toggleType(t)} onClick={(e) => e.stopPropagation()} sx={{ p: 0.5, mr: 1 }} />
                  <Box sx={{ width: 12, height: 12, borderRadius: '50%', bgcolor: typeColors[t], mr: 1, flexShrink: 0 }} />
                  <Typography sx={{ fontSize: 18, color: 'var(--text-primary)' }}>{t}</Typography>
                  {!DEFAULT_TYPES.includes(t) && <Chip label="Custom" size="small" sx={{ ml: 1, height: 18, bgcolor: '#E9EFF6', color: 'var(--blue)', borderRadius: '10px', '& .MuiChip-label': { px: 0.75, fontSize: 11 } }} />}
                </Box>
              ))}
            </FilterSection>
          </Box>
        </Box>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       CALENDAR GRID
       ═══════════════════════════════════════════════════════════════════════ */
    function EventPill({ event, onClick, typeColors }) {
      const color = typeColors[event.type];
      const text = contrastText(color);
      const timeText = text === '#FFFFFF' ? 'rgba(255,255,255,0.8)' : 'rgba(23,43,77,0.7)';
      const org = ORG_BY_ID[event.orgId];
      const orgShortName = org.name.replace('KL ', '');
      return (
        <Box onClick={(e) => { e.stopPropagation(); onClick(event); }} sx={{
          display: 'flex', alignItems: 'center', gap: 0.5, px: 1, py: '4px', mb: '3px',
          borderRadius: '3px', bgcolor: color, borderLeft: `3px solid ${color}`,

          <Typography sx={{ fontSize: 14, color: text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
            {orgShortName} · {event.title}
          </Typography>
        </Box>
      );
    }

    function CalendarGrid({ year, month, events, multiOrg, onEventClick, typeColors }) {
      const cells = useMemo(() => buildGrid(year, month), [year, month]);
      const eventsByDay = useMemo(() => {
        const map = {};
        events.forEach(e => { (map[e.day] = map[e.day] || []).push(e); });
        Object.values(map).forEach(list => list.sort((a, b) => a.start.localeCompare(b.start)));
        return map;
      }, [events]);
      const [morePopover, setMorePopover] = useState(null);

      const openMore = (e, dow, day, dayEvents) => setMorePopover({ anchorEl: e.currentTarget, dow, day, events: dayEvents });
      const closeMore = () => setMorePopover(null);
      const handlePopoverEventClick = (evt) => { closeMore(); onEventClick(evt); };

      return (
        <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', bgcolor: '#fff', overflow: 'hidden' }}>
          {/* weekday header */}
          <Box sx={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', borderBottom: '1px solid var(--border)' }}>
            {DOW.map(d => (
              <Typography key={d} sx={{ fontSize: 17, color: 'var(--text-secondary)', textAlign: 'center', py: 1.25 }}>{d}</Typography>
            ))}
          </Box>
          {/* 6 rows */}
          <Box sx={{ flex: 1, display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gridTemplateRows: 'repeat(6, 1fr)' }}>
            {cells.map((cell, i) => {
              const isToday = cell.inMonth && cell.m === TODAY.m && year === TODAY.y && cell.day === TODAY.d;
              const dayEvents = cell.inMonth ? (eventsByDay[cell.day] || []) : [];
              const shown = dayEvents.slice(0, 3);
              const more = dayEvents.length - shown.length;
              return (
                <Box key={i} sx={{
                  borderRight: (i % 7 !== 6) ? '1px solid var(--border)' : 'none',
                  borderBottom: (i < 35) ? '1px solid var(--border)' : 'none',
                  bgcolor: isToday ? 'var(--today)' : '#fff', p: 0.75, overflow: 'hidden',
                  display: 'flex', flexDirection: 'column', minWidth: 0,
                }}>
                  <Typography sx={{ fontSize: 17, mb: 0.5, color: cell.inMonth ? 'var(--text-primary)' : 'var(--text-muted)' }}>
                    {cell.day}

                  <Box sx={{ flex: 1, overflow: 'hidden' }}>
                    {shown.map(e => <EventPill key={e.id} event={e} onClick={onEventClick} typeColors={typeColors} />)}
                    {more > 0 && (
                      <Typography onClick={(e) => openMore(e, DOW[i % 7], cell.day, dayEvents)} sx={{ fontSize: 14, color: 'var(--blue)', cursor: 'pointer', pl: 0.5 }}>
                        +{more} more
                      </Typography>

                  </Box>
                </Box>

          <Popover open={Boolean(morePopover)} anchorEl={morePopover?.anchorEl} onClose={closeMore} elevation={3}

            {morePopover && (
              <Box>

                  <IconButton size="small" onClick={closeMore}><Icon path={P.close} size={20} color="var(--text-secondary)" /></IconButton>

                <Box sx={{ maxHeight: 400, overflowY: 'auto' }}>

                    return (
                      <Box key={e.id} onClick={() => handlePopoverEventClick(e)} sx={{
                        display: 'flex', alignItems: 'center', gap: 1, px: 1.5, py: 0.75, cursor: 'pointer',

    /* ═══════════════════════════════════════════════════════════════════════
       LOCATION FIELD + MAP PREVIEW  (CHANGE 6)
       ═══════════════════════════════════════════════════════════════════════ */
    function MapPreview({ location, onLocationChange }) {
      const [dragging, setDragging] = useState(false);
      const [offset, setOffset] = useState({ x: 0, y: 0 });
      const [scale, setScale] = useState(1);
      const [resolving, setResolving] = useState(false);
      const [resolved, setResolved] = useState(location);
      const dragStart = useRef(null);

      useEffect(() => { setResolved(location); }, [location]);

      // fake reverse-geocode: deterministic per pan position, no real API
      const fakeGeocode = (ox, oy) => {
        const idx = Math.abs(Math.round(ox / 45) + Math.round(oy / 45) * 3) % LOCATION_SUGGESTIONS.length;
        return LOCATION_SUGGESTIONS[idx];
      };

      const pointerXY = (e) => (e.touches ? e.touches[0] : e);

      const handleDown = (e) => {
        const p = pointerXY(e);
        dragStart.current = { x: p.clientX - offset.x, y: p.clientY - offset.y };
        setDragging(true);
      };
      const handleMove = (e) => {
        if (!dragStart.current) return;
        const p = pointerXY(e);
        setOffset({ x: p.clientX - dragStart.current.x, y: p.clientY - dragStart.current.y });
      };
      const handleUp = () => {
        if (!dragStart.current) return;
        dragStart.current = null;
        setDragging(false);
        setResolving(true);
        setResolved(null); // never show a stale address while resolving
        const next = fakeGeocode(offset.x, offset.y);
        setTimeout(() => {
          setResolved(next);
          setResolving(false);
          onLocationChange && onLocationChange(next);
        }, 500);
      };
      const handleWheel = (e) => {
        e.preventDefault();
        setScale(s => Math.min(2, Math.max(0.6, s - e.deltaY * 0.001)));
      };

      return (
        <Box sx={{ mt: 1, borderRadius: 1.5, overflow: 'hidden', border: '1px solid var(--border)' }}>
          <Box
            onMouseDown={handleDown} onMouseMove={handleMove} onMouseUp={handleUp} onMouseLeave={handleUp}
            onTouchStart={handleDown} onTouchMove={handleMove} onTouchEnd={handleUp}
            onWheel={handleWheel}
            sx={{ position: 'relative', height: 130, bgcolor: '#E8EDF2', overflow: 'hidden', cursor: dragging ? 'grabbing' : 'grab', touchAction: 'none' }}
          >
            <Box sx={{ position: 'absolute', inset: -80, transform: `translate(${offset.x}px, ${offset.y}px) scale(${scale})`, transition: dragging ? 'none' : 'transform 150ms ease' }}>
              <svg width="100%" height="100%" viewBox="0 0 560 290" preserveAspectRatio="xMidYMid slice" style={{ width: '100%', height: '100%', display: 'block' }}>
                <rect width="560" height="290" fill="#E8EDF2" />
                <rect x="60" y="30" width="150" height="70" fill="#D6E8D2" />
                <rect x="360" y="150" width="160" height="70" fill="#D6E8D2" />
                <rect x="240" y="40" width="80" height="60" fill="#DCE6F0" />
                <rect x="80" y="180" width="120" height="60" fill="#DCE6F0" />
                <g stroke="#FFFFFF" strokeWidth="7">
                  <line x1="0" y1="145" x2="560" y2="145" />
                  <line x1="230" y1="0" x2="230" y2="290" />
                  <line x1="365" y1="0" x2="365" y2="290" />
                </g>
                <g stroke="#C7D2DC" strokeWidth="2">
                  <line x1="0" y1="70" x2="560" y2="70" />
                  <line x1="0" y1="220" x2="560" y2="220" />
                  <line x1="130" y1="0" x2="130" y2="290" />
                  <line x1="450" y1="0" x2="450" y2="290" />
                </g>
              </svg>
            </Box>
            {/* fixed centre pin — static overlay, never a Marker, anchored by its tip */}
            <Box sx={{
              position: 'absolute', left: '50%', top: '50%', pointerEvents: 'none',
              transform: dragging ? 'translate(-50%, calc(-100% - 6px))' : 'translate(-50%, -100%)',
              transition: 'transform 150ms ease',
            }}>
              <Box sx={{
                position: 'absolute', bottom: dragging ? -10 : -3, left: '50%', transform: 'translateX(-50%)',
                width: dragging ? 18 : 10, height: dragging ? 6 : 3, borderRadius: '50%',
                bgcolor: 'rgba(0,0,0,0.35)', filter: 'blur(1px)', opacity: dragging ? 1 : 0, transition: 'all 150ms ease',
              }} />
              <Icon path={P.pin} size={40} color="#EA4335" />
            </Box>
          </Box>
          <Box sx={{ px: 1.5, py: 1, bgcolor: '#fff', display: 'flex', gap: 1, alignItems: 'flex-start' }}>
            <Icon path={P.pin} size={21} color="var(--blue)" sx={{ mt: '2px' }} />
            <Box sx={{ flex: 1 }}>
              {resolving || !resolved ? (
                <Typography sx={{ fontSize: 17, color: '#5F7089' }}>Locating…</Typography>
              ) : (
                <>
                  <Typography sx={{ fontSize: 17, color: 'var(--text-primary)' }}>{resolved.name}</Typography>
                  <Typography sx={{ fontSize: 16, color: 'var(--text-secondary)' }}>{resolved.address}</Typography>
                </>
              )}
            </Box>
          </Box>
        </Box>
      );
    }

          {mode === 'map' && (

    /* ═══════════════════════════════════════════════════════════════════════
       COLOR PICKER MODAL  (CHANGE 2)
       ═══════════════════════════════════════════════════════════════════════ */
    function hsvToHex(h, s, v) {
      s /= 100; v /= 100;
      const c = v * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = v - c;
      let r = 0, g = 0, b = 0;
      if (h < 60) { r = c; g = x; b = 0; }
      else if (h < 120) { r = x; g = c; b = 0; }
      else if (h < 180) { r = 0; g = c; b = x; }
      else if (h < 240) { r = 0; g = x; b = c; }
      else if (h < 300) { r = c; g = 0; b = x; }
      else { r = x; g = 0; b = c; }
      const toHex = (n) => Math.round((n + m) * 255).toString(16).padStart(2, '0');
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`.toUpperCase();
    }

    const BRANDING_SWATCHES = [

        const newHex = hsvToHex(h, (x / 300) * 100, 100 - (y / 160) * 100);
        setHex(newHex); setTempColor(newHex);

      const handleCanvasPointer = (e) => {

        setHandlePos({ x, y });
        updateFromCanvas(x, y, hue);
      };

      const handleHueChange = (h) => { setHue(h); updateFromCanvas(handlePos.x, handlePos.y, h); };
      const handleHexInput = (v) => { setHex(v); if (/^#[0-9A-Fa-f]{6}$/.test(v)) setTempColor(v); };
      const handleSelect = () => { onChange(tempColor); onClose(); };

      return (

                    <Box key={`${c}-${i}`} onClick={() => setTempColor(c)} sx={{
                      width: 44, height: 44, borderRadius: 2, bgcolor: c, cursor: 'pointer',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
