                  <Box sx={{
                    position: 'absolute', left: handlePos.x - 7, top: handlePos.y - 7, width: 14, height: 14, borderRadius: '50%',
                    border: '2px solid #fff', boxShadow: '0 0 0 1px rgba(0,0,0,0.3)', bgcolor: tempColor, pointerEvents: 'none',
                  }} />
                </Box>

                <Box sx={{
                  mt: 1.5, height: 14, borderRadius: 7, mx: 'auto', width: 300, position: 'relative',
                  background: 'linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000)',
                }}>
                  <input type="range" min="0" max="360" value={hue} onChange={(e) => handleHueChange(Number(e.target.value))}
                    style={{ width: '100%', height: 14, margin: 0, opacity: 0, cursor: 'pointer', position: 'absolute', top: 0, left: 0 }} />
                  <Box sx={{ position: 'absolute', left: `calc(${(hue / 360) * 100}% - 7px)`, top: -1, width: 16, height: 16, borderRadius: '50%', bgcolor: '#fff', border: '2px solid var(--border)', pointerEvents: 'none' }} />
                </Box>

                <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5, mt: 2 }}>
                  <Box sx={{ width: 32, height: 32, borderRadius: 1, bgcolor: tempColor, border: '1px solid var(--border)', flexShrink: 0 }} />
                  <TextField fullWidth value={hex} onChange={(e) => handleHexInput(e.target.value)} placeholder="#000000" />
                </Box>
              </Box>
            )}
          </Box>

          <Box sx={{ px: 2.5, py: 2, borderTop: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <Box onClick={() => setApplyAll(!applyAll)} sx={{ display: 'flex', alignItems: 'center', cursor: 'pointer' }}>
              <Checkbox checked={applyAll} onChange={() => setApplyAll(!applyAll)} sx={{ p: 0.5, mr: 0.5 }} />
              <Typography sx={{ fontSize: 17, color: 'var(--text-primary)' }}>Apply to all in group</Typography>
            </Box>
            <Box sx={{ display: 'flex', gap: 1 }}>
              <GreyButton onClick={onClose}>Cancel</GreyButton>
              <Button onClick={handleSelect} sx={PRIMARY_BTN_SX}>Select</Button>
            </Box>
          </Box>
        </Dialog>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       GROUP PICKER STEP HELPERS  (CHANGE 1)
       ═══════════════════════════════════════════════════════════════════════ */
    function OrgLogo({ org, size = 32 }) {
      return (
        <Avatar src={org.avatar} variant="circular" sx={{ width: size, height: size, bgcolor: 'transparent', flexShrink: 0, '& img': { objectFit: 'contain' } }} />
      );
    }

    function GroupPickerStep({ selectedCustomIds, onToggleCustom, selectedOrgIds, onToggleOrg }) {
      const [search, setSearch] = useState('');
      const match = (s) => s.toLowerCase().includes(search.toLowerCase());

      const visibleCustomGroups = GROUP_PICKER_CUSTOM_GROUPS.filter(g => match(g.name));
      const visibleOrgs = ORGS.filter(o => match(o.name));

      return (
        <Box sx={{ px: 2.5, pt: 2, pb: 2 }}>
          <TextField variant="filled" fullWidth placeholder="Search group/club" value={search} onChange={(e) => setSearch(e.target.value)}
            InputProps={{ endAdornment: <InputAdornment position="end"><Icon path={P.search} size={23} color="var(--text-secondary)" /></InputAdornment> }}
            sx={{ mb: 2 }} />

          {visibleCustomGroups.length > 0 && (
            <>
              <Typography sx={{ fontSize: 14, color: 'var(--navy)', mb: 1 }}>Custom group</Typography>
              {visibleCustomGroups.map((g, i) => (
                <React.Fragment key={g.id}>
                  <Box onClick={() => onToggleCustom(g.id)} sx={{ display: 'flex', alignItems: 'center', height: 48, gap: 1.5, cursor: 'pointer' }}>
                    <Checkbox checked={selectedCustomIds.has(g.id)} onChange={() => onToggleCustom(g.id)} onClick={(e) => e.stopPropagation()} />
                    <Typography sx={{ fontSize: 15, color: 'var(--text-primary)' }}>{g.name}</Typography>
                  </Box>
                  {i < visibleCustomGroups.length - 1 && <Divider />}
                </React.Fragment>
              ))}
              <Divider sx={{ my: 1.5 }} />
            </>
          )}

          <Typography sx={{ fontSize: 14, color: 'var(--navy)', mb: 1 }}>Club</Typography>
          {visibleOrgs.map((org, i) => (
            <React.Fragment key={org.id}>
              <Box onClick={() => onToggleOrg(org.id)} sx={{ display: 'flex', alignItems: 'center', height: 48, gap: 1.5, cursor: 'pointer' }}>
                <Checkbox checked={selectedOrgIds.has(org.id)} onChange={() => onToggleOrg(org.id)} onClick={(e) => e.stopPropagation()} />
                <OrgLogo org={org} />
                <Typography sx={{ fontSize: 15, color: 'var(--text-primary)' }}>{org.name}</Typography>
              </Box>
              {i < visibleOrgs.length - 1 && <Divider />}
            </React.Fragment>
          ))}
        </Box>
      );
    }

    function ParticipantsStep({ selectedOrgIds, expandedOrgIds, onToggleExpand, orgParticipantIds, onToggleParticipant, onToggleSelectAllOrg, orgStaffId, onSetStaff }) {
      const selectedOrgs = ORGS.filter(o => selectedOrgIds.has(o.id));

      return (
        <Box sx={{ px: 2.5, pt: 2, pb: 2 }}>
          <Typography sx={{ fontSize: 14, color: 'var(--navy)', mb: 1 }}>Club</Typography>
          {selectedOrgs.map(org => {
            const open = expandedOrgIds.has(org.id);
            const squad = org.squads[0];
            const roster = squad ? rosterForSquad(squad.id) : [];
            const athletes = roster.filter(a => a.type === 'athlete');
            const staff = roster.filter(a => a.type === 'staff');
            const checkedIds = orgParticipantIds[org.id] || new Set();

            const fieldSx = {
              '& .MuiFilledInput-root': {
                height: 56, borderRadius: '4px 4px 0 0', backgroundColor: '#F3F4F7', boxShadow: 'none',
                borderBottom: '1px solid #B3BAC5',
                '&:hover': { backgroundColor: '#F3F4F7', borderBottom: '1px solid #5F7089' },
                '&.Mui-focused': { backgroundColor: '#EDEFF3', boxShadow: 'none', borderBottom: '2px solid #172B4D' },
              },
              '& .MuiFilledInput-input': { fontSize: 16, fontWeight: 400, color: '#172B4D' },
              '& .MuiFilledInput-input::placeholder': { color: '#5F7089', opacity: 1, fontSize: 16, fontWeight: 400, fontStyle: 'normal' },
              '& .MuiSelect-select': { fontSize: 16, fontWeight: 400, fontStyle: 'normal', color: '#172B4D' },
              '& .MuiSelect-icon': { color: '#5F7089', fontSize: 20 },
              '& .MuiSvgIcon-root': { color: '#5F7089', fontSize: 20 },
            };
            return (
              <Box key={org.id}>
                <Box sx={{ display: 'flex', alignItems: 'center', height: 48, gap: 1.5 }}>
                  <OrgLogo org={org} />
                  <Typography sx={{ fontSize: 15, color: 'var(--text-primary)', flex: 1 }}>{org.name}</Typography>
                  <Box onClick={() => onToggleSelectAllOrg(org.id)} sx={{
                    bgcolor: '#F3F4F7', '&:hover': { bgcolor: '#E8EAED' },
                    borderRadius: '999px', height: 36, px: 2, display: 'flex', alignItems: 'center', cursor: 'pointer', flexShrink: 0,
                  }}>
                    <Typography sx={{ fontSize: 15, fontWeight: 400, textTransform: 'none', color: '#5F7089' }}>Select all</Typography>
                  </Box>
                  <IconButton size="small" onClick={() => onToggleExpand(org.id)}>
                    <Icon path={open ? P.chevronUp : P.chevronDown} size={23} color="var(--text-muted)" />
                  </IconButton>
                </Box>
                <Divider />

                <Collapse in={open}>
                  <Box sx={{ pt: 1.5 }}>
                    <TextField variant="filled" fullWidth placeholder="Search athletes"
                      InputProps={{ endAdornment: <InputAdornment position="end"><Icon path={P.search} size={20} color="#5F7089" /></InputAdornment> }}
                      sx={{ ...fieldSx, mb: 1.5 }} />

                    <Box sx={{ display: 'flex', gap: 2, mb: 1.5 }}>
                      <FormControl variant="filled" size="small" sx={{ ...fieldSx, flex: 1 }}>
                        <Select defaultValue="All teams">
                          <MenuItem value="All teams">All teams</MenuItem>
                          {org.squads.map(s => <MenuItem key={s.id} value={s.id}>{s.name}</MenuItem>)}
                        </Select>
                      </FormControl>
                      <FormControl variant="filled" size="small" sx={{ ...fieldSx, flex: 1 }}>
                        <Select defaultValue="A-Z">
                          <MenuItem value="A-Z">A-Z</MenuItem>
                          <MenuItem value="Z-A">Z-A</MenuItem>
                        </Select>
                      </FormControl>
                    </Box>

                    {athletes.map((a, i) => (
                      <React.Fragment key={a.id}>
                        <Box onClick={() => onToggleParticipant(org.id, a.id)} sx={{ display: 'flex', alignItems: 'center', height: 44, gap: 1.5, cursor: 'pointer' }}>
                          <Checkbox checked={checkedIds.has(a.id)} onChange={() => onToggleParticipant(org.id, a.id)} onClick={(e) => e.stopPropagation()} />
                          <Box sx={{ width: 32, height: 32, borderRadius: '50%', bgcolor: 'var(--secondary)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                            <Typography sx={{ fontSize: 12, color: 'var(--text-secondary)' }}>{a.name.split(' ').map(w => w[0]).join('').slice(0, 2)}</Typography>
                          </Box>
                          <Typography sx={{ fontSize: 15, color: 'var(--text-primary)' }}>{a.name}</Typography>
                        </Box>
                        {i < athletes.length - 1 && <Divider />}
                      </React.Fragment>
                    ))}

                    <FormControl variant="filled" fullWidth sx={{
                      ...fieldSx, mt: 1.5,
                      '& .MuiSelect-select': { ...fieldSx['& .MuiSelect-select'], color: orgStaffId[org.id] ? '#172B4D' : '#5F7089' },
                    }}>
                      <Select displayEmpty value={orgStaffId[org.id] || ''} onChange={(e) => onSetStaff(org.id, e.target.value)}>
                        <MenuItem value="">Select staff</MenuItem>
                        {staff.map(s => <MenuItem key={s.id} value={s.id}>{s.name}</MenuItem>)}
                      </Select>
                    </FormControl>
                  </Box>
                </Collapse>
              </Box>
            );
          })}
        </Box>
      );
    }

    function addDuration(start, durationLabel) {
      const mins = { '30m': 30, '1h': 60, '1.5h': 90, '2h': 120 }[durationLabel];
      if (!mins) return null;
      const [h, m] = start.split(':').map(Number);
      const total = h * 60 + m + mins;
      const eh = Math.floor((total / 60) % 24).toString().padStart(2, '0');
      const em = (total % 60).toString().padStart(2, '0');
      return `${eh}:${em}`;
    }

    const ADD_EVENT_STEPS = ['Select group', 'Select participants', 'Event set up'];

    /* ═══════════════════════════════════════════════════════════════════════
       ADD EVENT DRAWER  (CHANGES 1, 3, 5, 6 — now a 3-step flow)
       ═══════════════════════════════════════════════════════════════════════ */
    function AddEventDrawer({ open, kind, onClose, onSave, types, onCreateType, typeColors, onSetTypeColor }) {
      const [step, setStep] = useState(1);
      const [selectedCustomIds, setSelectedCustomIds] = useState(() => new Set());
      const [selectedOrgIds, setSelectedOrgIds] = useState(() => new Set());
      const [expandedOrgIds, setExpandedOrgIds] = useState(() => new Set());
      const [orgParticipantIds, setOrgParticipantIds] = useState({});
      const [orgStaffId, setOrgStaffId] = useState({});
      const [title, setTitle] = useState('');
      const [type, setType] = useState('');
      const [description, setDescription] = useState('');
      const [colorModalOpen, setColorModalOpen] = useState(false);
      const [date, setDate] = useState('2026-07-15');
      const [start, setStart] = useState('09:00');
      const [duration, setDuration] = useState('1h');
      const [customEnd, setCustomEnd] = useState('10:00');
      const [timezone, setTimezone] = useState('ET');
      const [repeat, setRepeat] = useState('Never');
      const [location, setLocation] = useState(null);
      const [visibility, setVisibility] = useState('All staff');
      const [attachments, setAttachments] = useState([]);
      const [attachmentTitle, setAttachmentTitle] = useState('');
      const [attachmentLink, setAttachmentLink] = useState('');
      const [notifyChannels, setNotifyChannels] = useState(() => new Set());
      const [reminderPlayer, setReminderPlayer] = useState('None');
      const [reminderPush, setReminderPush] = useState('1 min before');

      const selectedOrgList = useMemo(() => ORGS.filter(o => selectedOrgIds.has(o.id)), [selectedOrgIds]);
      const primaryOrgId = selectedOrgList[0]?.id || 'atl';
      const primarySquadId = (ORG_BY_ID[primaryOrgId].squads[0] && ORG_BY_ID[primaryOrgId].squads[0].id) || 'atl-first';

      useEffect(() => {
        setOrgParticipantIds(prev => {
          const next = { ...prev };
          selectedOrgIds.forEach(orgId => {
            if (!next[orgId]) {
              const squadId = ORG_BY_ID[orgId].squads[0]?.id;
              next[orgId] = new Set(rosterForSquad(squadId).filter(a => a.type === 'athlete').map(a => a.id));
            }
          });
          return next;
        });
      }, [selectedOrgIds]);

      const toggleCustom = (id) => setSelectedCustomIds(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const toggleOrg = (id) => setSelectedOrgIds(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const toggleExpandOrg = (id) => setExpandedOrgIds(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const toggleParticipant = (orgId, athleteId) => setOrgParticipantIds(prev => {
        const current = new Set(prev[orgId] || []);
        current.has(athleteId) ? current.delete(athleteId) : current.add(athleteId);
        return { ...prev, [orgId]: current };
      });
      const toggleSelectAllOrg = (orgId) => setOrgParticipantIds(prev => {
        const squadId = ORG_BY_ID[orgId].squads[0]?.id;
        const athletes = rosterForSquad(squadId).filter(a => a.type === 'athlete');
        const current = prev[orgId] || new Set();
        const allSelected = athletes.every(a => current.has(a.id));
        return { ...prev, [orgId]: new Set(allSelected ? [] : athletes.map(a => a.id)) };
      });
      const setStaffForOrg = (orgId, staffId) => setOrgStaffId(prev => ({ ...prev, [orgId]: staffId }));

      const toggleNotifyChannel = (ch) => setNotifyChannels(prev => { const n = new Set(prev); n.has(ch) ? n.delete(ch) : n.add(ch); return n; });
      const addAttachment = () => {
        if (!attachmentTitle.trim()) return;
        setAttachments(prev => [...prev, { id: `att-${prev.length}-${attachmentTitle.trim()}`, title: attachmentTitle.trim(), link: attachmentLink.trim() }]);
        setAttachmentTitle(''); setAttachmentLink('');
      };
      const removeAttachment = (id) => setAttachments(prev => prev.filter(a => a.id !== id));

      const reset = () => {
        setStep(1); setSelectedCustomIds(new Set()); setSelectedOrgIds(new Set());
        setExpandedOrgIds(new Set()); setOrgParticipantIds({}); setOrgStaffId({});
        setTitle(''); setType(''); setDescription(''); setColorModalOpen(false);
        setDate('2026-07-15'); setStart('09:00'); setDuration('1h'); setCustomEnd('10:00'); setTimezone('ET'); setRepeat('Never');
        setLocation(null); setVisibility('All staff'); setAttachments([]); setAttachmentTitle(''); setAttachmentLink('');
        setNotifyChannels(new Set()); setReminderPlayer('None'); setReminderPush('1 min before');
      };
      const close = () => { reset(); onClose(); };

      const displayColour = typeColors[type] || '#3B4960';
      const canSave = title.trim() && type;
      const hasGroupSelection = selectedCustomIds.size + selectedOrgIds.size > 0;

      const goBack = () => { if (step === 1) { close(); return; } setStep(s => s - 1); };
      const goNext = () => {
        if (step === 1 && !hasGroupSelection) return;
        if (step === 1) setExpandedOrgIds(new Set(selectedOrgList[0] ? [selectedOrgList[0].id] : []));
        if (step < 3) setStep(s => s + 1);
        else save();
      };

      const save = () => {
        if (!canSave) return;
        const dayNum = date ? Number(date.split('-')[2]) : 15;
        const endTime = duration === 'Custom' ? customEnd : (addDuration(start, duration) || customEnd);
        const roster = rosterForSquad(primarySquadId);
        const chosenAthleteIds = orgParticipantIds[primaryOrgId] || new Set();
        const chosenStaffId = orgStaffId[primaryOrgId];
        const attendees = roster.filter(a => (a.type === 'athlete' && chosenAthleteIds.has(a.id)) || (a.type === 'staff' && a.id === chosenStaffId));
        const reminders = [
          ...(reminderPlayer !== 'None' ? [`Player: ${reminderPlayer}`] : []),
          `Push: ${reminderPush}`,
        ];
        onSave({
          id: `ev-${Date.now()}`, day: dayNum, orgId: primaryOrgId, squadId: primarySquadId, type,
          title: title.trim(), start, end: endTime, location, reminders, notes: description,
          attendees: attendees.length ? attendees : roster,
          repeat, visibility, attachments, notifyChannels: [...notifyChannels],
        });
        reset();
      };

      return (
        <Drawer anchor="right" open={open} onClose={close} PaperProps={{ sx: { width: 560 } }}>
          <Box sx={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
            <Box sx={{ px: 2.5, py: 2, borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <Typography sx={{ fontSize: 23, color: 'var(--text-primary)' }}>New {kind.toLowerCase()}</Typography>
              <IconButton size="small" onClick={close}><Icon path={P.close} size={26} color="var(--text-secondary)" /></IconButton>
            </Box>

            {/* Stepper */}
            <Box sx={{ display: 'flex', alignItems: 'center', px: 2.5, py: 2, borderBottom: '1px solid var(--border)', gap: 1 }}>
              {ADD_EVENT_STEPS.map((label, i) => {
                const n = i + 1;
                const state = n < step ? 'done' : n === step ? 'active' : 'upcoming';
                return (
                  <React.Fragment key={label}>
                    <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                      <Box sx={{
                        width: 24, height: 24, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
                        bgcolor: state === 'upcoming' ? '#E8EAED' : '#3B4960',
                      }}>
                        {state === 'done'
                          ? <Icon path={P.check} size={14} color="#fff" />
                          : <Typography sx={{ fontSize: 12, color: state === 'active' ? '#fff' : '#5F7089' }}>{n}</Typography>}
                      </Box>
                      <Typography sx={{ fontSize: 14, fontWeight: state === 'active' ? 600 : 400, color: state === 'active' ? '#172B4D' : '#5F7089' }}>{label}</Typography>
                    </Box>
                    {n < ADD_EVENT_STEPS.length && <Box sx={{ flex: 1, height: 0, borderTop: `1px solid ${state === 'done' ? '#3B4960' : '#E8EAED'}` }} />}
                  </React.Fragment>
                );
              })}
            </Box>

            <Box sx={{ flex: 1, overflowY: 'auto' }}>
              {step === 1 && (
                <GroupPickerStep selectedCustomIds={selectedCustomIds} onToggleCustom={toggleCustom}
                  selectedOrgIds={selectedOrgIds} onToggleOrg={toggleOrg} />
              )}

              {step === 2 && (
                <ParticipantsStep selectedOrgIds={selectedOrgIds} expandedOrgIds={expandedOrgIds} onToggleExpand={toggleExpandOrg}
                  orgParticipantIds={orgParticipantIds} onToggleParticipant={toggleParticipant} onToggleSelectAllOrg={toggleSelectAllOrg}
                  orgStaffId={orgStaffId} onSetStaff={setStaffForOrg} />
              )}

              {step === 3 && (
                <Box sx={{ px: 2.5, py: 2 }}>
                  <Box sx={{ mb: 2 }}>
                    <FieldLabel required>Event type</FieldLabel>
                    <TypeCombo types={types} value={type} onSelect={setType} onCreate={onCreateType} />
                  </Box>

                  <Box sx={{ mb: 2 }}>
                    <FieldLabel required>Title</FieldLabel>
                    <TextField fullWidth placeholder={`${kind} name`} value={title} onChange={(e) => setTitle(e.target.value)} sx={DRAWER_FIELD_SX} />
                  </Box>

                  <Box sx={{ mb: 2 }}>
                    <FieldLabel>Description</FieldLabel>
                    <TextField fullWidth multiline rows={3} placeholder="Add details…" value={description} onChange={(e) => setDescription(e.target.value)} sx={DRAWER_FIELD_MULTILINE_SX} />
                  </Box>

                  <Divider sx={DRAWER_DIVIDER_SX} />

                  <Box sx={{ mb: 2 }}>
                    <FieldLabel>Date</FieldLabel>
                    <TextField fullWidth type="date" value={date} onChange={(e) => setDate(e.target.value)} sx={DRAWER_FIELD_SX} />
                  </Box>

                  <Box sx={{ mb: 2 }}>
                    <FieldLabel>Start time</FieldLabel>
                    <TextField fullWidth type="time" value={start} onChange={(e) => setStart(e.target.value)} sx={DRAWER_FIELD_SX} />
                  </Box>

                  <Box sx={{ mb: 2 }}>
                    <FieldLabel>Duration</FieldLabel>
                    <FormControl fullWidth sx={DRAWER_FIELD_SX}>
                      <Select value={duration} onChange={(e) => setDuration(e.target.value)}>
                        <MenuItem value="30m">30 min</MenuItem>
                        <MenuItem value="1h">1 hr</MenuItem>
                        <MenuItem value="1.5h">1.5 hr</MenuItem>
                        <MenuItem value="2h">2 hr</MenuItem>
                        <MenuItem value="Custom">Custom</MenuItem>
                      </Select>
                    </FormControl>
                  </Box>

                  {duration === 'Custom' && (
                    <Box sx={{ mb: 2 }}>
                      <FieldLabel>End time</FieldLabel>
                      <TextField fullWidth type="time" value={customEnd} onChange={(e) => setCustomEnd(e.target.value)} sx={DRAWER_FIELD_SX} />
                    </Box>
                  )}

                  <Box sx={{ mb: 2 }}>
                    <FieldLabel>Time zone</FieldLabel>
                    <FormControl fullWidth sx={DRAWER_FIELD_SX}>
                      <Select value={timezone} onChange={(e) => setTimezone(e.target.value)}>
                        {['ET', 'CT', 'MT', 'PT', 'GMT'].map(tz => <MenuItem key={tz} value={tz}>{tz}</MenuItem>)}
                      </Select>
                    </FormControl>
                  </Box>

                  <Box sx={{ mb: 2 }}>
                    <FieldLabel>Repeat</FieldLabel>
                    <FormControl fullWidth sx={DRAWER_FIELD_SX}>
                      <Select value={repeat} onChange={(e) => setRepeat(e.target.value)}>
                        {['Never', 'Daily', 'Weekly', 'Monthly'].map(r => <MenuItem key={r} value={r}>{r}</MenuItem>)}
                      </Select>
                    </FormControl>
                  </Box>

                  <Box sx={{ mb: 2 }}>
                    <FieldLabel>Address</FieldLabel>
                    <LocationField value={location} onChange={setLocation} />
                  </Box>

                  <Divider sx={DRAWER_DIVIDER_SX} />

                  <Box sx={{ mb: 2 }}>
                    <FieldLabel>Staff visibility</FieldLabel>
                    <FormControl fullWidth sx={DRAWER_FIELD_SX}>
                      <Select value={visibility} onChange={(e) => setVisibility(e.target.value)}>
                        {['All staff', 'Only selected staff', 'Staff and additional viewers'].map(v => <MenuItem key={v} value={v}>{v}</MenuItem>)}
                      </Select>
                    </FormControl>
                  </Box>

                  <Divider sx={DRAWER_DIVIDER_SX} />

                  <Box sx={{ mb: 2 }}>
                    <FieldLabel>Attach files</FieldLabel>
                    <Box sx={{ border: '1px dashed var(--border)', borderRadius: '6px', p: 3, textAlign: 'center', mb: 1.5 }}>
                      <Icon path={P.add} size={23} color="var(--text-muted)" />
                      <Typography sx={{ fontSize: 14, color: 'var(--text-muted)' }}>Drag and drop files or browse</Typography>
                    </Box>
                    <Box sx={{ display: 'flex', gap: 1 }}>
                      <TextField placeholder="Title" value={attachmentTitle} onChange={(e) => setAttachmentTitle(e.target.value)} sx={{ ...DRAWER_FIELD_SX, flex: 1 }} />
                      <TextField placeholder="Link (optional)" value={attachmentLink} onChange={(e) => setAttachmentLink(e.target.value)} sx={{ ...DRAWER_FIELD_SX, flex: 1 }} />
                      <Button onClick={addAttachment} disabled={!attachmentTitle.trim()}
                        sx={{ ...PRIMARY_BTN_SX, '&.Mui-disabled': { bgcolor: '#C7CBD3', color: '#fff' } }}>
                        Add
                      </Button>
                    </Box>
                    {attachments.map(a => (
                      <Box key={a.id} sx={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', py: 0.75 }}>
                        <Typography sx={{ fontSize: 14, color: 'var(--text-primary)' }}>{a.title}</Typography>
                        <IconButton size="small" onClick={() => removeAttachment(a.id)}><Icon path={P.close} size={16} color="var(--text-muted)" /></IconButton>
                      </Box>
                    ))}
                  </Box>

                  <Divider sx={DRAWER_DIVIDER_SX} />

                  <Box sx={{ mb: 2 }}>
                    <FieldLabel>Notify via</FieldLabel>
                    <Box sx={{ display: 'flex', gap: 1 }}>
                      {['Email', 'Push'].map(ch => {
                        const on = notifyChannels.has(ch);
                        return (
                          <Box key={ch} onClick={() => toggleNotifyChannel(ch)} sx={{
                            bgcolor: on ? 'var(--navy)' : 'var(--grey-fill)', color: on ? '#fff' : 'var(--text-primary)',
                            borderRadius: 20, px: 1.5, py: 0.5, cursor: 'pointer',
                          }}>
                            <Typography sx={{ fontSize: 14, color: 'inherit' }}>{ch}</Typography>
                          </Box>
                        );
                      })}
                    </Box>
                  </Box>

                  <Divider sx={DRAWER_DIVIDER_SX} />

                  <Box sx={{ mb: 2 }}>
                    <FieldLabel>Reminders</FieldLabel>
                    <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5, mb: 1 }}>
                      <Typography sx={{ fontSize: 15, color: 'var(--text-primary)', width: 60, flexShrink: 0 }}>Player</Typography>
                      <FormControl fullWidth sx={DRAWER_FIELD_SX}>
                        <Select value={reminderPlayer} onChange={(e) => setReminderPlayer(e.target.value)}>
                          {['None', 'All'].map(o => <MenuItem key={o} value={o}>{o}</MenuItem>)}
                        </Select>
                      </FormControl>
                    </Box>
                    <Box sx={{ display: 'flex', alignItems: 'center', gap: 1.5 }}>
                      <Typography sx={{ fontSize: 15, color: 'var(--text-primary)', width: 60, flexShrink: 0 }}>Push</Typography>
                      <FormControl fullWidth sx={DRAWER_FIELD_SX}>
                        <Select value={reminderPush} onChange={(e) => setReminderPush(e.target.value)}>
                          {['1 min before', '5 min before', '30 min before', '1 day before', 'Custom'].map(o => <MenuItem key={o} value={o}>{o}</MenuItem>)}
                        </Select>
                      </FormControl>
                    </Box>
                  </Box>

                  <Box sx={{ mb: 1 }}>
                    <FieldLabel>Event colour</FieldLabel>
                    <Box onClick={() => setColorModalOpen(true)} sx={{
                      display: 'flex', alignItems: 'center', gap: 1.5, bgcolor: 'var(--grey-fill)', borderRadius: '6px', px: 1.5, py: 1, cursor: 'pointer',
                    }}>
                      <Box sx={{ width: 20, height: 20, borderRadius: '50%', bgcolor: displayColour, flexShrink: 0 }} />
                      <Typography sx={{ fontSize: 14, color: 'var(--text-primary)', flex: 1 }}>{displayColour}</Typography>
                      <Icon path={P.chevronDown} size={23} color="var(--text-secondary)" />
                    </Box>
                  </Box>
                </Box>
              )}
            </Box>

            <Box sx={{ px: 2.5, py: 2, borderTop: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between' }}>
              <GreyButton onClick={goBack}>{step === 1 ? 'Cancel' : 'Back'}</GreyButton>
              {step < 3 ? (
                <Button disabled={step === 1 && !hasGroupSelection} onClick={goNext}
                  sx={{ ...PRIMARY_BTN_SX, '&.Mui-disabled': { bgcolor: '#C7CBD3', color: '#fff' } }}>
                  Next
                </Button>
              ) : (
                <Button disabled={!canSave} onClick={save}
                  sx={{ ...PRIMARY_BTN_SX, '&.Mui-disabled': { bgcolor: '#C7CBD3', color: '#fff' } }}>
                  Create event
                </Button>
              )}
            </Box>
          </Box>

          <ColorPickerModal open={colorModalOpen} color={displayColour}
            onChange={(hex) => type && onSetTypeColor(type, hex)} onClose={() => setColorModalOpen(false)} />
        </Drawer>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       EVENT DETAIL DIALOG  (CHANGES 4, 5, 6)
       ═══════════════════════════════════════════════════════════════════════ */
    function DetailRow({ icon, children }) {
      return (
        <Box sx={{ display: 'flex', gap: 1.25, mb: 1.5, alignItems: 'flex-start' }}>
          <Icon path={icon} size={23} color="var(--text-secondary)" sx={{ mt: '1px' }} />
          <Box sx={{ flex: 1 }}>{children}</Box>
        </Box>
      );
    }

    function EventDetailDialog({ event, onClose, onSendMessage }) {
      const [permissions, setPermissions] = useState('Creator only');
      const [mapsMenuAnchor, setMapsMenuAnchor] = useState(null);
      if (!event) return null;
      const org = ORG_BY_ID[event.orgId];
      const squad = SQUAD_BY_ID[event.squadId];
      const color = squadColor(event.squadId);
      return (
        <Dialog open={Boolean(event)} onClose={onClose} PaperProps={{ sx: { width: 460, maxWidth: '92vw', borderRadius: 2 } }}>
          <Box sx={{ height: 6, bgcolor: color }} />
          <Box sx={{ p: 2.5 }}>
            <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', mb: 2 }}>
              <Box>
                <Chip label={event.type} size="small" sx={{ bgcolor: color + '1F', color, mb: 1, '& .MuiChip-label': { fontSize: 16 } }} />
                <Typography sx={{ fontSize: 20, color: 'var(--text-primary)' }}>{event.title}</Typography>
              </Box>
              <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
                <Tooltip title="Send message">
                  <IconButton onClick={() => onSendMessage(event)} sx={{
                    width: 40, height: 40, borderRadius: '6px', '&:hover': { bgcolor: '#F3F4F7' },
                  }}>
                    <Icon path={P.chatBubbleOutline} size={22} color="#3B4960" />
                  </IconButton>
                </Tooltip>
                <IconButton size="small" onClick={onClose}><Icon path={P.close} size={26} color="var(--text-secondary)" /></IconButton>
              </Box>
            </Box>

            <DetailRow icon={P.calendar}>
              <Typography sx={{ fontSize: 18 }}>{event.day} July 2026</Typography>
              <Typography sx={{ fontSize: 17, color: 'var(--text-secondary)' }}>{event.start} &ndash; {event.end}</Typography>
            </DetailRow>
            <DetailRow icon={P.network}>
              <Typography sx={{ fontSize: 18 }}>{org.name}</Typography>
              <Typography sx={{ fontSize: 17, color: 'var(--text-secondary)' }}>{squad ? squad.name : ''}</Typography>
            </DetailRow>
            <DetailRow icon={P.person}>
              <Typography sx={{ fontSize: 18 }}>{event.attendees.length} attendees</Typography>
              <Typography sx={{ fontSize: 17, color: 'var(--text-secondary)' }}>
                {event.attendees.slice(0, 3).map(a => a.name).join(', ')}{event.attendees.length > 3 ? ` +${event.attendees.length - 3} more` : ''}
              </Typography>
            </DetailRow>

            {/* CHANGE 5 — reminders list */}
            {event.reminders.length > 0 && (
              <DetailRow icon={P.bell}>
                <Typography sx={{ fontSize: 18, mb: 0.25 }}>Reminders</Typography>
                {event.reminders.map((r, i) => (
                  <Typography key={i} sx={{ fontSize: 17, color: 'var(--text-secondary)' }}>&bull; {r}</Typography>
                ))}
              </DetailRow>
            )}

            {/* CHANGE 3 — permissions */}
            <DetailRow icon={P.settings}>
              <Typography sx={{ fontSize: 17, color: 'var(--text-secondary)', mb: 0.5 }}>Who can edit?</Typography>
              <FormControl size="small" sx={{ minWidth: 220 }}>
                <Select value={permissions} onChange={(e) => setPermissions(e.target.value)}>
                  {['Creator only', 'Operations staff', 'Coaches', 'All assigned staff'].map(p => (
                    <MenuItem key={p} value={p}>{p}</MenuItem>
                  ))}
                </Select>
              </FormControl>
            </DetailRow>

            {/* CHANGE 6 — location + static map frame + Open in Maps */}
            {event.location && (() => {
              const lat = event.location.lat, lng = event.location.lng;
              const googleUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
              const appleUrl = `https://maps.apple.com/?ll=${lat},${lng}&q=${encodeURIComponent(event.location.name)}`;
              const openMapsMenu = (e) => setMapsMenuAnchor(e.currentTarget);
              return (
                <Box sx={{ mb: 1 }}>
                  <Box
                    onClick={openMapsMenu}
                    sx={{
                      width: '100%', height: 160, borderRadius: '8px', overflow: 'hidden',
                      border: '1px solid #E8EAED', mb: 1, position: 'relative', cursor: 'pointer', bgcolor: '#E8EDF2',
                    }}
                  >
                    <svg width="100%" height="100%" viewBox="0 0 400 160" preserveAspectRatio="xMidYMid slice">
                      <rect width="400" height="160" fill="#E8EDF2" />
                      <rect x="30" y="15" width="120" height="65" fill="#D6E8D2" />
                      <rect x="250" y="85" width="130" height="65" fill="#D6E8D2" />
                      <rect x="170" y="20" width="60" height="55" fill="#DCE6F0" />
                      <g stroke="#FFFFFF" strokeWidth="7">
                        <line x1="0" y1="80" x2="400" y2="80" />
                        <line x1="150" y1="0" x2="150" y2="160" />
                        <line x1="245" y1="0" x2="245" y2="160" />
                      </g>
                    </svg>
                    <Box sx={{ position: 'absolute', left: '50%', top: '50%', transform: 'translate(-50%, -100%)' }}>
                      <Icon path={P.pin} size={36} color="#EA4335" />
                    </Box>
                  </Box>
                  <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.75, mb: 0.75 }}>
                    <Icon path={P.pin} size={20} color="#5F7089" />
                    <Typography sx={{ fontSize: 15, color: '#172B4D' }}>{event.location.name}</Typography>
                  </Box>
                  <Box onClick={openMapsMenu} sx={{ display: 'inline-flex', alignItems: 'center', gap: 0.5, cursor: 'pointer' }}>
                    <Typography sx={{ fontSize: 15, fontWeight: 600, color: '#3B4960' }}>Open in Maps</Typography>
                    <Icon path={P.openInNew} size={20} color="#3B4960" />
                  </Box>
                  <Menu anchorEl={mapsMenuAnchor} open={Boolean(mapsMenuAnchor)} onClose={() => setMapsMenuAnchor(null)}>
                    <MenuItem component="a" href={googleUrl} target="_blank" rel="noopener"
                      onClick={() => setMapsMenuAnchor(null)} sx={{ height: 44, fontSize: 15, color: '#172B4D' }}>
                      Open in Google Maps
                    </MenuItem>
                    <MenuItem component="a" href={appleUrl} target="_blank" rel="noopener"
                      onClick={() => setMapsMenuAnchor(null)} sx={{ height: 44, fontSize: 15, color: '#172B4D' }}>
                      Open in Apple Maps
                    </MenuItem>
                  </Menu>
                </Box>
              );
            })()}
          </Box>

          <Box sx={{ px: 2.5, py: 2, borderTop: '1px solid var(--border)', display: 'flex', justifyContent: 'flex-end', gap: 1 }}>
            <GreyButton onClick={onClose}>Close</GreyButton>
          </Box>
        </Dialog>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       BROADCAST COMPOSE MODAL  (CHANGE 4) — compose-only, no stepper
       ═══════════════════════════════════════════════════════════════════════ */
    function BroadcastModal({ event, onClose, onSent }) {
      const [selected, setSelected] = useState(new Set());
      const [toExpanded, setToExpanded] = useState(false);
      const [subject, setSubject] = useState('');
      const [body, setBody] = useState('');
      const [scheduleOpen, setScheduleOpen] = useState(false);

      // pre-fill all event attendees as recipients, all checked on open
      useEffect(() => {
        if (event) {
          setSelected(new Set(event.attendees.map(a => a.id)));
          setToExpanded(false); setSubject(`Update: ${event.title}`); setBody(''); setScheduleOpen(false);
        }
      }, [event]);

      if (!event) return null;

      const fieldSx = {
        '& .MuiFilledInput-root': {
          height: 56, borderRadius: '4px 4px 0 0', backgroundColor: '#F3F4F7', boxShadow: 'none',
          borderBottom: '1px solid #B3BAC5',
          '&:hover': { backgroundColor: '#F3F4F7', borderBottom: '1px solid #5F7089' },
          '&.Mui-focused': { backgroundColor: '#F3F4F7', boxShadow: 'none', borderBottom: '2px solid #172B4D' },
        },
        '& .MuiFilledInput-input': { fontSize: 16, fontWeight: 400, color: '#172B4D' },
        '& .MuiFilledInput-input::placeholder': { color: '#5F7089', opacity: 1, fontSize: 16, fontWeight: 400, fontStyle: 'normal' },
      };

      const toggle = (id) => setSelected(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const total = selected.size;
      const canSend = total > 0 && subject.trim().length > 0;

      const send = () => { onSent(total); };

      return (
        <Dialog open={Boolean(event)} onClose={onClose} PaperProps={{ sx: { width: 960, maxWidth: 'min(960px, calc(100vw - 64px))', borderRadius: 2, maxHeight: '90vh', display: 'flex', flexDirection: 'column' } }}>
          <Box sx={{ px: 3, py: 2.5, borderBottom: '1px solid #E8EAED', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
            <Typography sx={{ fontSize: 20, fontWeight: 700, color: '#172B4D' }}>New Broadcast Message</Typography>
            <IconButton size="small" onClick={onClose}><Icon path={P.close} size={22} color="#5F7089" /></IconButton>
          </Box>

          <Box sx={{ flex: 1, overflowY: 'auto' }}>
            <Box sx={{ px: 3, py: 2, borderBottom: '1px solid #E8EAED' }}>
              <Typography sx={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.5px', color: '#5F7089', textTransform: 'uppercase' }}>To</Typography>
              <Box sx={{ display: 'flex', alignItems: 'center', gap: 1, mt: 0.5 }}>
                <Typography sx={{ fontSize: 15, color: '#172B4D' }}>{total} recipients</Typography>
                <IconButton size="small" onClick={() => setToExpanded(v => !v)}>
                  <Icon path={toExpanded ? P.chevronUp : P.chevronDown} size={18} color="#5F7089" />
                </IconButton>
              </Box>
              <Collapse in={toExpanded}>
                <Box sx={{ mt: 1 }}>
                  {event.attendees.map((a, i) => (
                    <React.Fragment key={a.id}>
                      <Box onClick={() => toggle(a.id)} sx={{ display: 'flex', alignItems: 'center', height: 44, gap: 1.5, cursor: 'pointer' }}>
                        <Checkbox checked={selected.has(a.id)} onChange={() => toggle(a.id)} onClick={(e) => e.stopPropagation()}
                          sx={{ color: '#B4B8C0', '&.Mui-checked': { color: '#3B4960' } }} />
                        <Box sx={{ width: 32, height: 32, borderRadius: '50%', bgcolor: 'var(--secondary)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                          <Typography sx={{ fontSize: 12, color: 'var(--text-secondary)' }}>{a.name.split(' ').map(w => w[0]).join('').slice(0, 2)}</Typography>
                        </Box>
                        <Typography sx={{ fontSize: 15, color: '#172B4D' }}>{a.name}</Typography>
                      </Box>
                      {i < event.attendees.length - 1 && <Divider sx={{ borderColor: '#E8EAED' }} />}
                    </React.Fragment>
                  ))}
                </Box>
              </Collapse>
            </Box>

            <Box sx={{ px: 3, py: 2, borderBottom: '1px solid #E8EAED', display: 'flex', alignItems: 'center', gap: 1 }}>
              <Icon path={P.mailOutline} size={20} color="#3B4960" />
              <Typography sx={{ fontSize: 15, fontWeight: 600, color: '#172B4D' }}>Send via Email</Typography>
              <Typography sx={{ fontSize: 14, color: '#5F7089' }}>{total} recipients</Typography>
            </Box>

            <Box sx={{ px: 3, py: 2.5 }}>
              <TextField fullWidth placeholder="Subject *" value={subject} onChange={(e) => setSubject(e.target.value)} sx={{ mb: 2, ...fieldSx }} />

              <Typography sx={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.5px', color: '#5F7089', textTransform: 'uppercase', mb: 1 }}>Body</Typography>
              <Box sx={{ display: 'flex', alignItems: 'center', px: 1.5, py: 1, bgcolor: '#F3F4F7', borderRadius: '4px 4px 0 0', gap: 0.5 }}>
                <IconButton size="small"><Icon path={P.bold} size={18} color="#5F7089" /></IconButton>
                <IconButton size="small"><Icon path={P.italic} size={18} color="#5F7089" /></IconButton>
                <IconButton size="small"><Icon path={P.link} size={18} color="#5F7089" /></IconButton>
                <IconButton size="small"><Icon path={P.bulletList} size={18} color="#5F7089" /></IconButton>
                <Box sx={{ flex: 1 }} />
                <IconButton size="small"><Icon path={P.attach} size={18} color="#5F7089" /></IconButton>
              </Box>
              <TextField fullWidth multiline minRows={7} placeholder="Write your message..." value={body} onChange={(e) => setBody(e.target.value)}
                sx={{
                  ...fieldSx,
                  '& .MuiFilledInput-root': { ...fieldSx['& .MuiFilledInput-root'], minHeight: 200, alignItems: 'flex-start', borderRadius: '0 0 4px 4px' },
                }} />
              <Typography sx={{ fontSize: 13, color: '#5F7089', mt: 1 }}>Maximum attachment size: 25MB</Typography>

              <Box sx={{ mt: 2 }}>
                {!scheduleOpen ? (
                  <Box onClick={() => setScheduleOpen(true)} sx={{
                    display: 'inline-flex', alignItems: 'center', gap: 0.75, bgcolor: '#F3F4F7', borderRadius: '6px',
                    height: 40, px: 2, cursor: 'pointer', '&:hover': { bgcolor: '#E8EAED' },
                  }}>
                    <Icon path={P.add} size={18} color="#3B4960" />
                    <Typography sx={{ fontSize: 15, fontWeight: 600, color: '#3B4960', textTransform: 'none' }}>Add schedule</Typography>
                  </Box>
                ) : (
                  <Box sx={{ display: 'flex', gap: 1.5 }}>
                    <TextField type="date" fullWidth sx={fieldSx} />
                    <TextField type="time" fullWidth sx={fieldSx} />
                  </Box>
                )}
              </Box>
            </Box>
          </Box>

          <Box sx={{ px: 3, py: 3, borderTop: '1px solid #E8EAED', display: 'flex', justifyContent: 'flex-end', gap: 2, flexShrink: 0 }}>
            <Button onClick={onClose} sx={{ bgcolor: 'transparent', boxShadow: 'none', color: '#3B4960', fontSize: 15, fontWeight: 600, textTransform: 'none', '&:hover': { bgcolor: 'transparent', boxShadow: 'none', textDecoration: 'underline' } }}>
              Save draft
            </Button>
            <Button disabled={!canSend} onClick={send} sx={{ ...PRIMARY_BTN_SX, '&.Mui-disabled': { bgcolor: '#E8EAED', color: '#5F7089' } }}>
              Send
            </Button>
          </Box>
        </Dialog>
      );
    }

    /* ═══════════════════════════════════════════════════════════════════════
       APP
       ═══════════════════════════════════════════════════════════════════════ */
    function App() {
      const [showFilters, setShowFilters] = useState(true);
      const [selectedOrgIds, setSelectedOrgIds] = useState(() => new Set(['atl']));
      const [selectedSquadIds, setSelectedSquadIds] = useState(() => new Set());
      const [types, setTypes] = useState([...DEFAULT_TYPES, 'Academy Day']);
      const [selectedTypes, setSelectedTypes] = useState(() => new Set([...DEFAULT_TYPES, 'Academy Day']));
      const [typeColors, setTypeColors] = useState(() => Object.fromEntries(
        [...DEFAULT_TYPES, 'Academy Day'].map((t, i) => [t, TYPE_COLORS[t] || TYPE_COLOR_FALLBACKS[i % TYPE_COLOR_FALLBACKS.length]])
      ));
      const [events, setEvents] = useState(SEED_EVENTS);

      const [addKind, setAddKind] = useState(null);
      const [detailEvent, setDetailEvent] = useState(null);
      const [broadcastEvent, setBroadcastEvent] = useState(null);
      const [toast, setToast] = useState(null);

      const multiOrg = selectedOrgIds.size > 1;

      // org toggle also selects/deselects that org's squads (single source of truth)
      const handleOrgToggle = (orgId) => {
        const org = ORG_BY_ID[orgId];
        const squadIds = org.squads.map(s => s.id);
        setSelectedOrgIds(prev => {
          const n = new Set(prev);
          if (n.has(orgId)) {
            n.delete(orgId);
            setSelectedSquadIds(sq => { const m = new Set(sq); squadIds.forEach(id => m.delete(id)); return m; });
          } else {
            n.add(orgId);
          }
          return n;
        });
      };

      // filter: org in view AND (no squads chosen OR squad chosen) AND type checked
      const visibleEvents = useMemo(() => events.filter(e => {
        if (!selectedOrgIds.has(e.orgId)) return false;
        const squadOk = selectedSquadIds.size === 0 || selectedSquadIds.has(e.squadId);
        const typeOk = selectedTypes.has(e.type);
        return squadOk && typeOk;
      }), [events, selectedOrgIds, selectedSquadIds, selectedTypes]);

      const filterBadge = types.length - selectedTypes.size;

      const createType = (t) => {
        if (types.includes(t)) return;
        setTypes(prev => [...prev, t]);
        setSelectedTypes(prev => new Set([...prev, t]));
        setTypeColors(prev => ({ ...prev, [t]: TYPE_COLOR_FALLBACKS[types.length % TYPE_COLOR_FALLBACKS.length] }));
        setToast({ severity: 'info', msg: `Type “${t}” added to the Types filter` });
      };

      const handleSaveEvent = (evt) => {
        setEvents(prev => [...prev, evt]);
        // make sure the org is in view so the new event is visible
        setSelectedOrgIds(prev => new Set([...prev, evt.orgId]));
        setAddKind(null);
        setToast({ severity: 'success', msg: `${addKind || 'Event'} added to the calendar` });
      };

      const handleSendMessage = (evt) => { setDetailEvent(null); setBroadcastEvent(evt); };

      return (
        <ThemeProvider theme={theme}>
          <CssBaseline />
          <Box sx={{ display: 'flex', height: '100%', bgcolor: 'var(--grey-fill)' }}>
            <NavRail />
            <Box sx={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
              <TopBar selectedOrgIds={selectedOrgIds} selectedSquadIds={selectedSquadIds} onOrgToggle={handleOrgToggle} />
              <Toolbar
                showFilters={showFilters}
                onToggleFilters={() => setShowFilters(v => !v)}
                filterBadge={filterBadge}
                monthLabel="July 2026"
                onNav={() => {}}
                onAdd={(kind) => setAddKind(kind)}
              />
              <Box sx={{ height: 50, flexShrink: 0 }} />
              <Box sx={{ flex: 1, display: 'flex', minHeight: 0, borderTop: '1px solid var(--border)' }}>
                {showFilters && (
                  <FiltersPanel
                    onClose={() => setShowFilters(false)}
                    selectedOrgIds={selectedOrgIds}
                    onOrgToggle={handleOrgToggle}
                    selectedSquadIds={selectedSquadIds}
                    setSelectedSquadIds={setSelectedSquadIds}
                    types={types}
                    selectedTypes={selectedTypes}
                    setSelectedTypes={setSelectedTypes}
                    typeColors={typeColors}
                  />
                )}
                <CalendarGrid year={2026} month={6} events={visibleEvents} multiOrg={multiOrg} onEventClick={setDetailEvent} typeColors={typeColors} />
              </Box>
            </Box>
          </Box>

          <AddEventDrawer
            open={Boolean(addKind)}
            kind={addKind || 'Event'}
            onClose={() => setAddKind(null)}
            onSave={handleSaveEvent}
            types={types}
            onCreateType={createType}
            typeColors={typeColors}
            onSetTypeColor={(t, hex) => setTypeColors(prev => ({ ...prev, [t]: hex }))}
          />

          <EventDetailDialog event={detailEvent} onClose={() => setDetailEvent(null)} onSendMessage={handleSendMessage} />

          <BroadcastModal
            event={broadcastEvent}
            onClose={() => setBroadcastEvent(null)}
            onSent={(count) => { setBroadcastEvent(null); setToast({ severity: 'success', msg: `Message sent to ${count} recipients` }); }}
          />

          <Snackbar open={Boolean(toast)} autoHideDuration={3500} onClose={() => setToast(null)}
            anchorOrigin={{ vertical: 'bottom', horizontal: 'center' }}>
            {toast && <Alert severity={toast.severity} onClose={() => setToast(null)} sx={{ '& .MuiAlert-message': { fontSize: 18 } }}>{toast.msg}</Alert>}
          </Snackbar>
        </ThemeProvider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Force Babel's classic JSX runtime so it runs in a plain script tag -->
  <script>
    (function () {
      const source = document.getElementById('app-source').textContent;
      const compiled = Babel.transform(source, { presets: [['react', { runtime: 'classic' }]] }).code;
      const script = document.createElement('script');
      script.text = compiled;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
